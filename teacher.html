      '<button class="back-btn" id="payCancel" style="flex:1;">Отмена</button>' +
      '<button class="save-btn" id="paySave" style="flex:1;margin-top:0;">Добавить</button>' +
      '</div></div>';
    document.body.appendChild(overlay);
    const studentInput = overlay.querySelector('#payStudent');
    const whoBox = overlay.querySelector('#payWho');
    const amountInput = overlay.querySelector('#payAmount');
    const dueInput = overlay.querySelector('#payDue');
    const labelInput = overlay.querySelector('#payLabel');
    const errBox = overlay.querySelector('#payErr');
    const saveBtn = overlay.querySelector('#paySave');

    let resolvedTelegramId = null;
    let lookupTimer = null;
    studentInput.oninput = () => {
      clearTimeout(lookupTimer);
      whoBox.style.display = 'none';
      resolvedTelegramId = null;
      const val = studentInput.value.trim();
      if (!val) return;
      lookupTimer = setTimeout(async () => {
        try {
          const info = await apiGet(`/api/teacher/lookup-student?query=${encodeURIComponent(val)}`);
          resolvedTelegramId = info.telegram_id;
          whoBox.textContent = '✅ ' + (info.first_name || '') + (info.username ? ' (@' + info.username + ')' : '') + ' · id' + info.telegram_id;
          whoBox.style.color = 'var(--green-dark)';
          whoBox.style.display = 'block';
        } catch (err) {
          resolvedTelegramId = null;
          whoBox.textContent = '❌ Пользователь не найден — он ещё ни разу не писал боту.';
          whoBox.style.color = 'var(--red-dark)';
          whoBox.style.display = 'block';
        }
      }, 400);
    };

    function closeOverlay() { unlockBodyScroll(); overlay.remove(); }
    overlay.querySelector('#payCancel').onclick = closeOverlay;
    saveBtn.onclick = async () => {
      if (!resolvedTelegramId) {
        errBox.textContent = 'Сначала дождитесь, пока ученик найдётся.';
        errBox.style.display = 'block';
        return;
      }
      const amount = parseFloat(amountInput.value);
      if (!amount || amount <= 0) {
        errBox.textContent = 'Укажите сумму.';
        errBox.style.display = 'block';
        return;
      }
      if (!dueInput.value) {
        errBox.textContent = 'Укажите срок оплаты.';
        errBox.style.display = 'block';
        return;
      }
      saveBtn.disabled = true;
      saveBtn.textContent = 'Добавляю…';
      try {
        await apiSend('POST', '/api/teacher/payments', {
          telegram_id: resolvedTelegramId, amount, due_date: dueInput.value,
          period_label: labelInput.value.trim(),
        });
        closeOverlay();
        onDone();
      } catch (err) {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Добавить';
        errBox.textContent = 'Не получилось: ' + err.message;
        errBox.style.display = 'block';
      }
    };
  }

        searchInput.placeholder = 'Найти ученика';
        searchInput.value = allStudentsSearch;
        searchInput.style.marginBottom = '10px';
        screen.appendChild(searchInput);

        // Курсы для выпадающего фильтра — собираем из того, что реально
        // есть у учеников, а не из отдельного запроса.
        const courseMap = new Map();
        students.forEach((s) => s.subjects.forEach((sub) => courseMap.set(sub.subject_id, sub.title)));
        if (courseMap.size) {
          const courseSelect = document.createElement('select');
          courseSelect.className = 'field-input';
          courseSelect.style.marginBottom = '10px';
          courseSelect.innerHTML = '<option value="">Все курсы</option>' +
            Array.from(courseMap.entries()).map(([id, title]) => `<option value="${id}">${escapeHtml(title)}</option>`).join('');
          courseSelect.value = allStudentsCourseFilter || '';
          courseSelect.onchange = () => { allStudentsCourseFilter = courseSelect.value; renderList(); };
          screen.appendChild(courseSelect);
        }

        const chipsRow = document.createElement('div');
        chipsRow.style.cssText = 'display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;';
        const chips = [
          { key: 'all', label: 'Все' },
          { key: 'individual', label: 'Индивидуальные' },
          { key: 'paired', label: 'Парные' },
          { key: 'awaiting_payment', label: 'Ожидают оплату' },
          { key: 'payment_due_soon', label: 'Скоро оплата' },
          { key: 'no_upcoming_lesson', label: 'Без занятия' },
          { key: 'not_renewing', label: 'Не продлевают' },
          { key: 'archived', label: 'Архив' },
        ];
        const listBox = document.createElement('div');

        function matchesFilter(s) {
          // Архивных не показываем нигде, кроме отдельного фильтра «Архив».
          if (allStudentsFilter === 'archived') return s.archived;
          if (s.archived) return false;
          if (allStudentsCourseFilter && !s.subjects.some((sub) => String(sub.subject_id) === allStudentsCourseFilter)) return false;
          if (allStudentsFilter === 'individual') return s.lesson_type === 'Индивидуальный';
          if (allStudentsFilter === 'paired') return s.lesson_type === 'Парный';
          if (allStudentsFilter === 'awaiting_payment') return s.awaiting_payment;
          if (allStudentsFilter === 'payment_due_soon') return s.payment_due_soon;
          if (allStudentsFilter === 'no_upcoming_lesson') return s.no_upcoming_lesson;
          if (allStudentsFilter === 'not_renewing') return s.not_renewing;
          return true;
        }

        function renderList() {
          listBox.innerHTML = '';
          const q = allStudentsSearch.trim().toLowerCase();
          const filtered = students.filter((s) => matchesFilter(s) && (!q || s.display_name.toLowerCase().includes(q)));
          if (!filtered.length) {
            const p = document.createElement('p');
            p.className = 'state-msg';
            p.textContent = 'Никого не нашлось.';
            listBox.appendChild(p);
            return;
          }
          filtered.forEach((s) => {
            const card = document.createElement('div');
            card.className = 'row-card';
            card.style.cssText = 'align-items:center;cursor:pointer;';
            const nextLessonText = s.next_lesson_at
              ? `Следующее: ${s.next_lesson_at.slice(8, 10)}.${s.next_lesson_at.slice(5, 7)} ${s.next_lesson_at.slice(11, 16)}`
              : 'нет следующего занятия';
            const badges = [];
            if (s.awaiting_payment) badges.push('<span style="padding:3px 7px;border-radius:7px;font-size:10.5px;font-weight:800;background:#FFF3D6;color:#B7791F;">ждёт оплаты</span>');
            else if (s.payment_due_soon) badges.push('<span style="padding:3px 7px;border-radius:7px;font-size:10.5px;font-weight:800;background:#FFF3D6;color:#B7791F;">скоро оплата</span>');
            if (s.not_renewing) badges.push('<span style="padding:3px 7px;border-radius:7px;font-size:10.5px;font-weight:800;background:var(--bg-soft);color:var(--text-soft);">не продлевает</span>');
            if (s.archived) badges.push('<span style="padding:3px 7px;border-radius:7px;font-size:10.5px;font-weight:800;background:var(--bg-soft);color:var(--text-soft);">архив</span>');
            const info = document.createElement('div');
            info.style.cssText = 'flex:1;min-width:0;';
            info.innerHTML = `<div class="row-title">${escapeHtml(s.display_name)}</div>` +
              `<div class="field-hint" style="margin-top:2px;">${escapeHtml(s.lesson_type)} \u00b7 ${nextLessonText}</div>` +
              (badges.length ? `<div style="margin-top:4px;">${badges.join(' ')}</div>` : '');
            card.appendChild(info);
            card.onclick = () => openStudentFromAllList(s);
            listBox.appendChild(card);
          });
        }

        chips.forEach((c) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          function applyStyle() {
            const active = allStudentsFilter === c.key;
            btn.style.cssText = `flex-shrink:0;padding:7px 12px;border-radius:20px;border:2px solid ${active ? 'var(--accent)' : 'var(--border)'};background:${active ? 'var(--blue-tint)' : 'var(--bg)'};color:${active ? 'var(--accent)' : 'var(--text-soft)'};font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;`;
          }
          applyStyle();
          btn.textContent = c.label;
          btn.onclick = () => {
            allStudentsFilter = c.key;
            renderAllStudents(false);
          };
          chipsRow.appendChild(btn);
        });
        screen.appendChild(chipsRow);
        screen.appendChild(listBox);
        renderList();

        let searchTimer = null;
        searchInput.oninput = () => {
          allStudentsSearch = searchInput.value;
          clearTimeout(searchTimer);
          searchTimer = setTimeout(renderList, 200);
        };
      }, isBack);
    } catch (err) { showErrorMsg(err, isBack); }
  }

  function openStudentFromAllList(s) {
    if (s.subjects.length >= 1) {
      currentSubjectId = s.subjects[0].subject_id;
      currentSubjectTitle = s.subjects[0].title;
    }
    renderStudentSubscriptions(s.telegram_id, s.display_name, null);
  }

  async function renderScheduleGrid(isBack) {
    showLoadingMenu();
    try {
      const pad2 = (n) => String(n).padStart(2, '0');
      // Дата в МЕСТНОМ времени. Раньше было toISOString() — это UTC, и
      // ночью (00:00–03:00 по Москве) неделя съезжала на день назад.
      const fmt = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
      const now = new Date();
      const thisMonday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7));
      if (!scheduleGridWeekStart) scheduleGridWeekStart = new Date(thisMonday);
      scheduleGridWeekStart.setHours(0, 0, 0, 0);
      const weekStart = new Date(scheduleGridWeekStart);
      const weekEnd = new Date(weekStart);
      weekEnd.setDate(weekStart.getDate() + 7);
      const lessons = await apiGet(`/api/teacher/lessons?date_from=${fmt(weekStart)}&date_to=${fmt(weekEnd)}`);
      const weekOffset = Math.round((weekStart - thisMonday) / (7 * 86400000));
      const shiftWeek = (n) => {
        if (n === 0) scheduleGridWeekStart = new Date(thisMonday);
        else scheduleGridWeekStart.setDate(scheduleGridWeekStart.getDate() + 7 * n);
        renderScheduleGrid(false);
      };

      // Часы сетки: обычно 8:00–22:00, но растягиваем, если уроки раньше/позже.
      const toMin = (str) => Number(str.slice(11, 13)) * 60 + Number(str.slice(14, 16));
      let startHour = 8, endHour = 22;
      lessons.forEach((l) => {
        const st = toMin(l.scheduled_at);
        startHour = Math.min(startHour, Math.floor(st / 60));
        endHour = Math.max(endHour, Math.ceil((st + (l.duration_minutes || 60)) / 60));
      });
      endHour = Math.min(24, endHour);

      swapScreen((screen) => {
        const root = document.createElement('div');
        root.className = 'sg';
        screen.appendChild(root);

        // --- Верх: заголовок, неделя со стрелками, «Сегодня», «+ Урок» ---
        const top = document.createElement('div');
        top.className = 'sg-top';
        top.innerHTML = '<div class="sg-title">Расписание</div>';
        const wk = document.createElement('div');
        wk.className = 'sg-week';
        const prev = document.createElement('button');
        prev.textContent = '\u2039';
        prev.onclick = () => shiftWeek(-1);
        const next = document.createElement('button');
        next.textContent = '\u203a';
        next.onclick = () => shiftWeek(1);
        const lastDay = new Date(weekEnd); lastDay.setDate(weekEnd.getDate() - 1);
        const range = `${weekStart.getDate()} ${DASH_MONTHS_SHORT[weekStart.getMonth()]} \u2014 ${lastDay.getDate()} ${DASH_MONTHS_SHORT[lastDay.getMonth()]}`;
        const title = weekOffset === 0 ? 'Эта неделя' : weekOffset === 1 ? 'Следующая' : weekOffset === -1 ? 'Прошлая' : `${weekStart.getFullYear()}`;
        const lbl = document.createElement('div');
        lbl.className = 'sg-week-label';
        lbl.innerHTML = `${title}<small>${range}</small>`;
        wk.appendChild(prev); wk.appendChild(lbl); wk.appendChild(next);
        top.appendChild(wk);
        if (weekOffset !== 0) {
          const tb = document.createElement('button');
          tb.className = 'sg-today-btn';
          tb.textContent = 'Сегодня';
          tb.onclick = () => shiftWeek(0);
          top.appendChild(tb);
        }
        const add = document.createElement('button');
        add.className = 'sg-add';
        add.textContent = '+ Урок';
        add.onclick = () => scMenu([
          { label: '➕ Разовый урок', onClick: () => promptAddLesson(() => renderScheduleGrid(false)) },
          { label: '🔁 Регулярное занятие', onClick: () => promptAddLessonSeries(() => renderScheduleGrid(false)) },
        ]);
        top.appendChild(add);
        root.appendChild(top);

        const legend = document.createElement('div');
        legend.className = 'sg-legend';
        legend.innerHTML =
          '<span><i style="background:#238BA7;"></i>запланирован</span>' +
          '<span><i style="background:#3E9E6A;"></i>проведён</span>' +
          '<span><i style="background:repeating-linear-gradient(135deg,#C3C9D0 0 3px,#F1F2F4 3px 6px);"></i>отменён</span>' +
          '<span><i style="border:1.5px dashed #B7BEC7;"></i>перенесён</span>';
        root.appendChild(legend);

        const box = document.createElement('div');
        box.className = 'sg-box';
        const scroll = document.createElement('div');
        scroll.className = 'sg-scroll';
        box.appendChild(scroll);
        root.appendChild(box);

        // Заголовки дней.
        const head = document.createElement('div');
        head.className = 'sg-head';
        head.innerHTML = '<div></div>';
        const todayStr = fmt(now);
        const days = [];
        for (let i = 0; i < 7; i++) {
          const d = new Date(weekStart); d.setDate(weekStart.getDate() + i);
          days.push(d);
          const hd = document.createElement('div');
          hd.className = 'sg-hd' + (fmt(d) === todayStr ? ' today' : '');
          hd.innerHTML = `${WEEKDAY_SHORT[i]}<b>${d.getDate()}</b>`;
          head.appendChild(hd);
        }
        scroll.appendChild(head);

        // Сетка по часам.
        const body = document.createElement('div');
        body.className = 'sg-body';
        const hourPx = parseFloat(getComputedStyle(root).getPropertyValue('--hour')) || 56;
        const hours = endHour - startHour;
        body.style.height = (hours * hourPx) + 'px';
        const times = document.createElement('div');
        times.className = 'sg-times';
        for (let h = startHour; h < endHour; h++) {
          times.insertAdjacentHTML('beforeend', `<div class="sg-time">${h === startHour ? '' : pad2(h) + ':00'}</div>`);
        }
        body.appendChild(times);

        const statusClass = (st) => st === 'conducted' ? 'conducted'
          : (st === 'cancelled_no_charge' || st === 'cancelled_charged') ? 'cancelled'
          : st === 'rescheduled' ? 'rescheduled' : '';

        days.forEach((d, i) => {
          const col = document.createElement('div');
          const isToday = fmt(d) === todayStr;
          col.className = 'sg-col' + (isToday ? ' today' : (i >= 5 ? ' weekend' : ''));
          const dayLessons = lessons.filter((l) => l.scheduled_at.slice(0, 10) === fmt(d))
            .sort((a, b) => a.scheduled_at.localeCompare(b.scheduled_at));

          // Пересекающиеся уроки ставим рядом, а не друг на друга.
          const lanesEnd = [];
          const placed = dayLessons.map((l) => {
            const st = toMin(l.scheduled_at), en = st + (l.duration_minutes || 60);
            let lane = lanesEnd.findIndex((e) => e <= st);
            if (lane === -1) { lane = lanesEnd.length; lanesEnd.push(en); } else lanesEnd[lane] = en;
            return { l, st, en, lane };
          });
          placed.forEach((p) => {
            const overlapLanes = Math.max(1, ...placed.filter((q) => q.st < p.en && q.en > p.st).map((q) => q.lane + 1));
            const l = p.l;
            const ev = document.createElement('div');
            ev.className = 'sg-ev ' + statusClass(l.status);
            if (!statusClass(l.status)) {
              const [c, tint] = lessonColor(l);
              ev.style.setProperty('--ev', c);
              ev.style.setProperty('--ev-tint', tint);
            }
            ev.style.top = ((p.st - startHour * 60) / 60 * hourPx + 1) + 'px';
            ev.style.height = Math.max(22, (p.en - p.st) / 60 * hourPx - 2) + 'px';
            if (overlapLanes > 1) {
              ev.style.left = `calc(${(p.lane / overlapLanes) * 100}% + 1px)`;
              ev.style.right = 'auto';
              ev.style.width = `calc(${100 / overlapLanes}% - 2px)`;
            }
            const endStr = `${pad2(Math.floor(p.en / 60) % 24)}:${pad2(p.en % 60)}`;
            const who = l.partner_name ? `${l.student_name} + ${l.partner_name}` : l.student_name;
            ev.title = `${l.scheduled_at.slice(11, 16)}\u2013${endStr} \u00b7 ${who}`;
            ev.innerHTML = `<div class="t">${l.scheduled_at.slice(11, 16)}<span class="end"> \u2014 ${endStr}</span></div>` +
              `<div class="n">${escapeHtml(who)}</div><div class="d">${l.duration_minutes || 60} мин</div>`;
            ev.onclick = () => promptLessonActions(l, () => renderScheduleGrid(false));
            col.appendChild(ev);
          });

          if (isToday) {
            const mins = now.getHours() * 60 + now.getMinutes();
            if (mins >= startHour * 60 && mins <= endHour * 60) {
              const line = document.createElement('div');
              line.className = 'sg-now';
              line.style.top = ((mins - startHour * 60) / 60 * hourPx) + 'px';
              col.appendChild(line);
            }
          }
          body.appendChild(col);
        });
        scroll.appendChild(body);

        if (!lessons.length) {
          root.insertAdjacentHTML('beforeend', '<div class="sg-empty-week">На этой неделе занятий нет</div>');
        }

        // Прокрутка к текущему времени (для этой недели) или к первому уроку.
        requestAnimationFrame(() => {
          let targetMin = null;
          if (weekOffset === 0) targetMin = now.getHours() * 60 + now.getMinutes() - 60;
          else if (lessons.length) targetMin = Math.min(...lessons.map((l) => toMin(l.scheduled_at))) - 30;
          if (targetMin !== null) scroll.scrollTop = Math.max(0, (targetMin - startHour * 60) / 60 * hourPx);
        });
      }, isBack);
    } catch (err) { showErrorMsg(err, isBack); }
  }

  // ===== Дашборд репетитора (главная) =====
  let dashWeekOffset = 0;

  function dashPlural(n, one, few, many) {
    const a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }
  function dashMoney(n) { return Math.round(Number(n) || 0).toLocaleString('ru-RU'); }
  const DASH_MONTHS_SHORT = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  const DASH_MONTHS_NOM = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
  const DASH_MONTHS_DAT = ['январю', 'февралю', 'марту', 'апрелю', 'маю', 'июню', 'июлю', 'августу', 'сентябрю', 'октябрю', 'ноябрю', 'декабрю'];

  function dashRing(pct, size, stroke, color, text, fontSize, fillBg) {
    const r = (size - stroke) / 2, c = 2 * Math.PI * r;
    const p = pct === null || pct === undefined ? 0 : Math.max(0, Math.min(100, pct));
    const el = document.createElement('div');
    el.className = 'dash-ring';
    el.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">` +
      `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="${fillBg || 'none'}" stroke="var(--border)" stroke-width="${stroke}"/>` +
      (p > 0 ? `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-dasharray="${p / 100 * c} ${c}" stroke-linecap="round"/>` : '') +
      `</svg><div class="val" style="font-size:${fontSize}px;">${text}</div>`;
    return el;
  }

  function dashCard(extraClass, title, opts) {
    opts = opts || {};
    const card = document.createElement('div');
    card.className = 'dash-card ' + (extraClass || '');
    if (title) {
      const t = document.createElement('div');
      t.className = 'dash-title';
      t.innerHTML = `<span>${title}</span>`;
      if (opts.count !== undefined) {
        const c = document.createElement('span');
        c.className = 'count';
        c.textContent = opts.count;
        t.appendChild(c);
      }
      if (opts.onPlus) {
        const plus = document.createElement('button');
        plus.className = 'dash-plus';
        plus.title = opts.plusTitle || 'Добавить';
        plus.textContent = '+';
        plus.onclick = (e) => { e.stopPropagation(); opts.onPlus(); };
        t.appendChild(plus);
      }
      card.appendChild(t);
    }
    if (opts.onClick) {
      card.classList.add('clickable');
      card.onclick = opts.onClick;
    }
    return card;
  }

  function dashGo(level, title) {
    stack = [{ level, title }];
    render(false);
  }

  // Цвет занятия: у каждого ученика (или пары) свой, всегда один и тот же —
  // вычисляется из его id, поэтому совпадает на всех экранах.
  const LESSON_COLORS = [
    ['#238BA7', '#E3F4F8'], ['#4A74C9', '#E8EEFA'], ['#8A63C9', '#F0EAFA'], ['#D05C8E', '#FBE9F1'],
    ['#E08A3C', '#FDF0E3'], ['#3E9E6A', '#E5F5EC'], ['#D0584E', '#FBE8E6'], ['#B8961F', '#FBF5DE'],
    ['#5B5FC7', '#EBEBFA'], ['#9A6B4A', '#F4ECE5'],
  ];
  function lessonColor(l) {
    const ids = [l.telegram_id, l.partner_telegram_id].filter(Boolean).map(Number).sort((a, b) => a - b);
    const key = ids.length ? ids.join('-') : String(l.subject_id || l.student_name || '');
    let h = 0;
    for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
    return LESSON_COLORS[h % LESSON_COLORS.length];
  }

  function buildLessonBoard(s, nowDate, nowStr) {
    const card = dashCard('w6');
    const pad2 = (n) => String(n).padStart(2, '0');
    const dateKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    const hm = (str) => str.slice(11, 16);
    const endHm = (l) => {
      const d = new Date(`${l.scheduled_at.slice(0, 10)}T${hm(l.scheduled_at)}:00`);
      d.setMinutes(d.getMinutes() + (l.duration_minutes || 60));
      return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    };
    const nowHm = nowStr.slice(11, 16);
    const checkSvg = '<svg viewBox="0 0 20 20" fill="none"><path d="M4 10.5L8 14.5L16 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    function eventEl(l, withCheck) {
      const [c, tint] = lessonColor(l);
      const ev = document.createElement('div');
      ev.className = 'board-ev';
      ev.style.setProperty('--ev', c);
      ev.style.setProperty('--ev-tint', tint);
      const end = endHm(l);
      if (withCheck && nowHm && end <= nowHm) ev.classList.add('past');
      ev.innerHTML = `<div class="txt"><div class="nm">${escapeHtml(l.student_name)}</div><div class="tm">${hm(l.scheduled_at)} \u2014 ${end}</div></div>`;
      ev.onclick = () => promptLessonActions(Object.assign({ partner_name: null }, l), () => render(false));
      if (withCheck) {
        // Кружок «проведено»: первое нажатие отмечает, и через 2,5 секунды
        // занятие уходит с доски. Если нажали по ошибке — нажмите ещё раз
        // в эти 2,5 секунды, отметка снимется и ничего не сохранится.
        const chk = document.createElement('button');
        chk.className = 'board-check';
        chk.title = 'Отметить проведённым';
        chk.innerHTML = checkSvg;
        let timer = null;
        chk.onclick = (e) => {
          e.stopPropagation();
          if (timer) {
            clearTimeout(timer);
            timer = null;
            chk.classList.remove('on');
            return;
          }
          chk.classList.add('on');
          timer = setTimeout(async () => {
            timer = null;
            try {
              await apiSend('POST', `/api/teacher/lessons/${l.id}/conducted`, {});
              ev.classList.add('gone');
              setTimeout(() => {
                const col = ev.parentElement;
                ev.remove();
                if (col && !col.querySelector('.board-ev')) {
                  col.insertAdjacentHTML('beforeend', '<div class="board-empty">Все занятия на сегодня проведены \ud83c\udf89</div>');
                }
              }, 320);
              showToast('Отмечено: проведён');
            } catch (err) {
              chk.classList.remove('on');
              showToast('Не получилось: ' + err.message);
            }
          }, 2500);
        };
        ev.appendChild(chk);
      }
      return ev;
    }

    const board = document.createElement('div');
    board.className = 'board';

    // Левая колонка — сегодня.
    const left = document.createElement('div');
    left.className = 'board-col';
    left.innerHTML = `<div class="board-weekday">${nowDate.toLocaleDateString('ru-RU', { weekday: 'long' })}</div><div class="board-daynum">${nowDate.getDate()}</div>`;
    const todayList = (s.today_lessons || []).filter((l) => l.status === 'scheduled');
    if (!todayList.length) {
      const done = (s.today_lessons || []).some((l) => l.status === 'conducted');
      left.insertAdjacentHTML('beforeend', `<div class="board-empty">${done ? 'Все занятия на сегодня проведены \ud83c\udf89' : 'Сегодня занятий нет'}</div>`);
    } else {
      todayList.forEach((l) => left.appendChild(eventEl(l, true)));
    }
    board.appendChild(left);

    // Правая колонка — завтра, потом ближайший следующий день с занятиями.
    const right = document.createElement('div');
    right.className = 'board-col';
    const tomorrow = new Date(nowDate);
    tomorrow.setDate(nowDate.getDate() + 1);
    const byDay = {};
    (s.upcoming_lessons || []).forEach((l) => { (byDay[l.scheduled_at.slice(0, 10)] = byDay[l.scheduled_at.slice(0, 10)] || []).push(l); });
    const SLOTS = 3;
    let used = 0;
    const tKey = dateKey(tomorrow);
    right.insertAdjacentHTML('beforeend', '<div class="board-label">Завтра</div>');
    const tList = byDay[tKey] || [];
    if (!tList.length) {
      right.insertAdjacentHTML('beforeend', '<div class="board-empty small">Занятий нет</div>');
    } else {
      tList.slice(0, SLOTS).forEach((l) => right.appendChild(eventEl(l, false)));
      used = Math.min(SLOTS, tList.length);
      if (tList.length > SLOTS) {
        const n = tList.length - SLOTS;
        right.insertAdjacentHTML('beforeend', `<div class="board-more">ещё ${n} ${dashPlural(n, 'занятие', 'занятия', 'занятий')}</div>`);
      }
    }
    const nextKey = Object.keys(byDay).sort().find((k) => k > tKey);
    if (nextKey) {
      const [y, m, d] = nextKey.split('-').map(Number);
      const nd = new Date(y, m - 1, d);
      const label = nd.toLocaleDateString('ru-RU', { weekday: 'long' }) + ', ' + d + ' ' + DASH_MONTHS_SHORT[m - 1];
      right.insertAdjacentHTML('beforeend', `<div class="board-label next">${label}</div>`);
      const list = byDay[nextKey];
      const room = Math.max(0, SLOTS - used);
      list.slice(0, room).forEach((l) => right.appendChild(eventEl(l, false)));
      const rest = list.length - Math.min(room, list.length);
      if (rest > 0) {
        right.insertAdjacentHTML('beforeend', `<div class="board-more">ещё ${rest} ${dashPlural(rest, 'занятие', 'занятия', 'занятий')}</div>`);
      }
    }
    board.appendChild(right);
    card.appendChild(board);

    const foot = document.createElement('div');
    foot.className = 'board-foot';
    const allBtn = document.createElement('button');
    allBtn.textContent = 'Всё расписание \u2192';
    allBtn.onclick = () => dashGo('schedule_grid', 'Расписание');
    foot.appendChild(allBtn);
    card.appendChild(foot);
    return card;
  }

            let right;
            if (e.status === 'awaiting_review') right = '<span class="muted" style="color:var(--d-accent);">на проверке</span>';
            else if (e.overdue) right = '<span class="late">просрочено</span>';
            else {
              const [, m, dd] = e.entry_date.slice(0, 10).split('-');
              right = `<span class="muted">${dd ? `${Number(dd)} ${DASH_MONTHS_SHORT[Number(m) - 1]}` : ''}${e.entry_date.length >= 16 ? ' ' + e.entry_date.slice(11, 16) : ''}</span>`;
            }
            diaryCard.insertAdjacentHTML('beforeend',
              `<div class="dash-row"><span class="name"><span class="dash-dot${e.overdue ? ' late' : ''}"></span>${escapeHtml(e.student_name)} \u00b7 ${escapeHtml(title)}</span>${right}</div>`);
          });
        }
        grid.appendChild(diaryCard);

        // --- Долги ---
        const debtsCard = dashCard('w2 half', 'Долги', { onClick: () => dashGo('payments', 'Оплаты') });
        if (!s.debts_count) {
          debtsCard.insertAdjacentHTML('beforeend', '<div class="dash-empty">Долгов нет</div>');
        } else {
          debtsCard.insertAdjacentHTML('beforeend', `<div class="dash-big">${dashMoney(s.debts_total)} \u20bd</div>`);
          s.debts.forEach((d) => {
            debtsCard.insertAdjacentHTML('beforeend', `<div class="dash-row"><span class="name">${escapeHtml(d.student_name)}</span><span class="muted">${dashMoney(d.amount)}</span></div>`);
          });
        }
        grid.appendChild(debtsCard);

        // --- Продлить (абонементы на исходе) ---
        const ren = s.renewals || [];
        const renCard = dashCard('w2 half', 'Продлить', { count: ren.length || undefined, onClick: () => dashGo('packages', 'Абонементы') });
        if (!ren.length) {
          renCard.insertAdjacentHTML('beforeend', '<div class="dash-empty">Всё в порядке</div>');
        } else {
          ren.slice(0, 5).forEach((r) => {
            const label = r.remaining <= 0 ? 'истёк' : `${r.remaining} ${dashPlural(r.remaining, 'урок', 'урока', 'уроков')}`;
            renCard.insertAdjacentHTML('beforeend', `<div class="dash-row"><span class="name">${escapeHtml(r.student_name)}</span><span class="${r.remaining <= 0 ? 'late' : 'muted'}">${label}</span></div>`);
          });
        }
        grid.appendChild(renCard);

        // --- Дни рождения ---
        const bd = s.birthdays || [];
        const bdCard = dashCard('w2', 'Дни рождения');
        if (!bd.length) {
          bdCard.insertAdjacentHTML('beforeend', '<div class="dash-empty">В ближайшие 2 недели нет</div>');
        } else {
          bd.forEach((b) => {
            const name = b.first_name || (b.username ? '@' + b.username : 'id' + b.telegram_id);
            const [dd, mm] = String(b.date || '').split('.');
            const when = b.days_left === 0 ? '🎂 сегодня' : (dd ? `${Number(dd)} ${DASH_MONTHS_SHORT[Number(mm) - 1]}` : b.date);
            bdCard.insertAdjacentHTML('beforeend', `<div class="dash-row"><span class="name">${escapeHtml(name)}</span><span class="muted">${when}</span></div>`);
          });
        }
        grid.appendChild(bdCard);

        // --- Нагрузка на неделю (со стрелками ‹ ›) ---
        const weekCard = dashCard('w6');
        grid.appendChild(weekCard);
        function drawWeek(weekStartStr, load) {
          weekCard.innerHTML = '';
          const [wy, wm, wd] = weekStartStr.split('-').map(Number);
          const start = new Date(wy, wm - 1, wd);
          const total = load.reduce((a, b) => a + b, 0);
          const headRow = document.createElement('div');
          headRow.className = 'dash-week-head';
          const left = document.createElement('div');
          left.style.cssText = 'display:flex;align-items:center;gap:8px;';
          left.innerHTML = `<span class="dash-title" style="margin:0;">${dashWeekOffset === 0 ? 'Нагрузка на неделю' : start.getDate() + ' ' + DASH_MONTHS_SHORT[start.getMonth()] + ' \u2014 неделя'}</span>`;
          const nav = document.createElement('div');
          nav.className = 'dash-week-nav';
          const prevBtn = document.createElement('button');
          prevBtn.textContent = '\u2039';
          prevBtn.onclick = (e) => { e.stopPropagation(); loadWeek(dashWeekOffset - 1); };
          const nextBtn = document.createElement('button');
          nextBtn.textContent = '\u203a';
          nextBtn.onclick = (e) => { e.stopPropagation(); loadWeek(dashWeekOffset + 1); };
          nav.appendChild(prevBtn);
          nav.appendChild(nextBtn);
          left.appendChild(nav);
          headRow.appendChild(left);
          const tot = document.createElement('div');
          tot.className = 'dash-week-total';
          tot.innerHTML = `${total} <span>${dashPlural(total, 'урок', 'урока', 'уроков')}</span>`;
          headRow.appendChild(tot);
          weekCard.appendChild(headRow);

          const days = document.createElement('div');
          days.className = 'dash-week-days';
          const maxLoad = Math.max(1, ...load);
          const todayKey = nowDate.toDateString();
          load.forEach((count, i) => {
            const d = new Date(start);
            d.setDate(start.getDate() + i);
            const isToday = d.toDateString() === todayKey;
            const col = document.createElement('div');
            col.className = 'dash-week-day' + (isToday ? ' today' : '');
            col.innerHTML = `<div class="lbl">${WEEKDAY_SHORT[i]} ${d.getDate()}</div>`;
            // Цвет по загрузке: мало — бирюзовый, средне — жёлтый, много — красный.
            const ratio = count / maxLoad;
            const color = count === 0 ? 'var(--border)' : (count >= 5 ? '#E0605A' : (count >= 3 ? '#E3B341' : 'var(--d-accent)'));
            const ring = dashRing(count === 0 ? 0 : Math.max(25, ratio * 100), 40, 3.5, color, count, 14, isToday ? 'var(--d-tint)' : 'none');
            if (count === 0) ring.querySelector('.val').style.color = 'var(--text-soft)';
            col.appendChild(ring);
            days.appendChild(col);
          });
          weekCard.appendChild(days);
        }
        async function loadWeek(offset) {
          try {
            const w = await apiGet('/api/teacher/week-load?offset=' + offset);
            dashWeekOffset = offset;
            drawWeek(w.week_start, w.load);
          } catch (err) { showToast('Не получилось загрузить неделю'); }
        }
        drawWeek(s.week_start || (() => {
          const d = new Date(nowDate); d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
          return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        })(), s.week_load || [0, 0, 0, 0, 0, 0, 0]);

        // --- Статистика месяца ---
        const ms = s.month_stats || {};
        const statsCard = dashCard('w6', 'Статистика месяца');
        const stats = document.createElement('div');
        stats.className = 'dash-stats';
        function addStat(pct, text, label, sub, color) {
          const col = document.createElement('div');
          col.className = 'dash-stat';
          col.appendChild(dashRing(pct, 56, 4.5, color, text, 14));
          col.insertAdjacentHTML('beforeend', `<div class="lbl">${label}</div><div class="sub">${sub}</div>`);
          stats.appendChild(col);
        }
        addStat(ms.paid_pct, ms.paid_pct === null || ms.paid_pct === undefined ? '\u2014' : ms.paid_pct + '%', 'Оплачено',
          ms.waiting_amount > 0 ? `ждём ${dashMoney(ms.waiting_amount)} \u20bd` : 'долгов нет', 'var(--d-accent)');
        const pace = ms.pace_pct;
        addStat(pace === null || pace === undefined ? null : Math.min(100, Math.abs(pace)),
          pace === null || pace === undefined ? '\u2014' : (pace >= 0 ? '+' : '') + pace + '%', 'Темп',
          pace === null || pace === undefined ? 'нет данных' : `${ms.pace_diff >= 0 ? '+' : '\u2212'}${dashMoney(Math.abs(ms.pace_diff))} \u20bd к ${nowDate.getDate()}-му`,
          pace !== null && pace < 0 ? '#E0605A' : '#E3B341');
        addStat(ms.no_disruption_pct, ms.no_disruption_pct === null || ms.no_disruption_pct === undefined ? '\u2014' : ms.no_disruption_pct + '%', 'Без срывов',
          `${ms.cancelled_count || 0} ${dashPlural(ms.cancelled_count || 0, 'отмена', 'отмены', 'отмен')} \u00b7 ${ms.rescheduled_count || 0} ${dashPlural(ms.rescheduled_count || 0, 'перенос', 'переноса', 'переносов')}`,
          '#5BAE7E');
        statsCard.appendChild(stats);
        grid.appendChild(statsCard);

        screen.appendChild(root);
      }, isBack);
    } catch (err) { showErrorMsg(err, isBack); }
  }

  let _liveSocket = null;

  function openLiveSession(lessonId) {
    lockBodyScroll();
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;';
    overlay.innerHTML =
      '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0;">' +
      '<span style="font-weight:800;">🎨 Живое занятие</span>' +
      '<div style="display:flex;gap:8px;">' +
      '<span id="lsStatus" class="field-hint">подключаемся…</span>' +
      '<button id="lsClose" style="border:none;background:none;font-size:18px;cursor:pointer;">✕</button>' +
      '</div></div>' +
      '<div style="padding:8px 14px;border-bottom:1px solid var(--border);flex-shrink:0;">' +
      '<textarea id="lsTaskText" class="field-input" rows="2" placeholder="Напишите сюда текст задания — ученик увидит его сразу" style="margin-bottom:6px;resize:vertical;"></textarea>' +
      '<div class="field-hint">Ответ ученика (видно вживую, по мере ввода):</div>' +
      '<div id="lsAnswerView" style="min-height:20px;font-weight:700;padding:4px 0;"></div>' +
      '</div>' +
      '<div style="flex:1;position:relative;overflow:hidden;">' +
      '<canvas id="lsCanvas" style="width:100%;height:100%;touch-action:none;background:#fff;"></canvas>' +
      '</div>' +
      '<div style="display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--border);flex-shrink:0;">' +
      '<input type="color" id="lsColor" value="#1a1a2e" style="width:40px;height:40px;border:none;padding:0;">' +
      '<button id="lsClear" class="back-btn" style="flex:1;">Очистить доску</button>' +
      '</div>';
    document.body.appendChild(overlay);

    const canvas = overlay.querySelector('#lsCanvas');
    const ctx2d = canvas.getContext('2d');
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function drawStroke(stroke) {
      if (!stroke.points || stroke.points.length < 2) return;
      ctx2d.strokeStyle = stroke.color || '#1a1a2e';
      ctx2d.lineWidth = stroke.width || 3;
      ctx2d.lineJoin = 'round';
      ctx2d.lineCap = 'round';
      ctx2d.beginPath();
      ctx2d.moveTo(stroke.points[0][0] * canvas.width, stroke.points[0][1] * canvas.height);
      for (let i = 1; i < stroke.points.length; i++) {
        ctx2d.lineTo(stroke.points[i][0] * canvas.width, stroke.points[i][1] * canvas.height);
      }
      ctx2d.stroke();
    }

    const socket = io(API_BASE_URL, { transports: ['websocket', 'polling'] });
    _liveSocket = socket;
    const statusEl = overlay.querySelector('#lsStatus');
    socket.on('connect', () => {
      socket.emit('join_lesson', { lesson_id: lessonId, init_data: tg?.initData || '' });
      statusEl.textContent = 'подключено';
    });
    socket.on('disconnect', () => { statusEl.textContent = 'соединение потеряно'; });
    socket.on('error', (e) => { statusEl.textContent = e.message || 'ошибка'; });
    socket.on('board_state', (state) => {
      ctx2d.clearRect(0, 0, canvas.width, canvas.height);
      (state.strokes || []).forEach(drawStroke);
      if (state.current_task) taskTextEl.value = state.current_task.text || '';
    });
    socket.on('stroke_added', drawStroke);
    socket.on('board_cleared', () => ctx2d.clearRect(0, 0, canvas.width, canvas.height));
    socket.on('task_opened', (task) => { taskTextEl.value = (task && task.text) || ''; });
    const answerView = overlay.querySelector('#lsAnswerView');
    socket.on('answer_input', (data) => { answerView.textContent = data.value || ''; });

    let drawing = false;
    let currentStroke = null;
    const colorInput = overlay.querySelector('#lsColor');
    function pointFromEvent(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return [(clientX - rect.left) / rect.width, (clientY - rect.top) / rect.height];
    }
    function startDraw(e) {
      e.preventDefault();
      drawing = true;
      currentStroke = { points: [pointFromEvent(e)], color: colorInput.value, width: 3 };
    }
    function moveDraw(e) {
      if (!drawing) return;
      e.preventDefault();
      const prevPoint = currentStroke.points[currentStroke.points.length - 1];
      const newPoint = pointFromEvent(e);
      currentStroke.points.push(newPoint);
      drawStroke({ points: [prevPoint, newPoint], color: currentStroke.color, width: currentStroke.width });
    }
    function endDraw() {
      if (!drawing) return;
      drawing = false;
      if (currentStroke && currentStroke.points.length >= 2) {
        socket.emit('draw_stroke', { lesson_id: lessonId, init_data: tg?.initData || '', stroke: currentStroke });
      }
      currentStroke = null;
    }
    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', moveDraw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('mouseleave', endDraw);
    canvas.addEventListener('touchstart', startDraw);
    canvas.addEventListener('touchmove', moveDraw);
    canvas.addEventListener('touchend', endDraw);

    overlay.querySelector('#lsClear').onclick = () => {
      ctx2d.clearRect(0, 0, canvas.width, canvas.height);
      socket.emit('clear_board', { lesson_id: lessonId, init_data: tg?.initData || '' });
    };

    const taskTextEl = overlay.querySelector('#lsTaskText');
    let taskTimer = null;
    taskTextEl.oninput = () => {
      clearTimeout(taskTimer);
      taskTimer = setTimeout(() => {
        socket.emit('open_task', { lesson_id: lessonId, init_data: tg?.initData || '', task: { text: taskTextEl.value } });
      }, 300);
    };

    function closeSession() {
      window.removeEventListener('resize', resizeCanvas);
      socket.disconnect();
      unlockBodyScroll();
      overlay.remove();
    }
    overlay.querySelector('#lsClose').onclick = closeSession;
  }

  function _wireStudentLookup(overlay, getResolvedId, setResolvedId, onResolved) {
    const studentInput = overlay.querySelector('#lsStudent');
    const whoBox = overlay.querySelector('#lsWho');
    let lookupTimer = null;
    studentInput.oninput = () => {
      clearTimeout(lookupTimer);
      whoBox.style.display = 'none';
      setResolvedId(null);
      if (onResolved) onResolved(null);
      const val = studentInput.value.trim();
      if (!val) return;
      lookupTimer = setTimeout(async () => {
        try {
          const info = await apiGet(`/api/teacher/lookup-student?query=${encodeURIComponent(val)}`);
          setResolvedId(info.telegram_id);
          whoBox.textContent = '✅ ' + (info.first_name || '') + (info.username ? ' (@' + info.username + ')' : '') + ' · id' + info.telegram_id;
          whoBox.style.color = 'var(--green-dark)';
          whoBox.style.display = 'block';
          if (onResolved) onResolved(info.telegram_id);
        } catch (err) {
          setResolvedId(null);
          whoBox.textContent = '❌ Пользователь не найден.';
          whoBox.style.color = 'var(--red-dark)';
          whoBox.style.display = 'block';
          if (onResolved) onResolved(null);
        }
      }, 400);
    };

    try {
      const packages = await apiGet(`/api/teacher/students/${studentId}/packages`);
      const usable = packages.filter((p) => p.status === 'paid' && p.remaining_lessons > 0);
      if (!usable.length) { selectEl.parentElement.style.display = 'none'; return; }
      usable.forEach((p) => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = `${p.remaining_lessons} из ${p.total_lessons} уроков (${p.price} ${p.currency})`;
        selectEl.appendChild(opt);
      });
      selectEl.parentElement.style.display = 'block';

    const subjectLabel = overlay.querySelector('#raSubjectLabel');

    const courseTypeBox = overlay.querySelector('#raCourseType');
    const daysInput = overlay.querySelector('#raDays');
    const dateInput = overlay.querySelector('#raDate');

    const errBox = overlay.querySelector('#raErr');
    const roleOptions = [
      { key: 'guest', label: 'Гость' },
      { key: 'student', label: 'Ученик' },
      { key: 'teacher', label: 'Учитель' },
      { key: 'admin', label: 'Админ' },
    ];
    let selectedRole = null;
    let selectedSubjectId = null;
    let selectedCourseType = 'Курс';
    let durationMode = 'days';
    const todayForInput = new Date().toISOString().slice(0, 10);
    dateInput.min = todayForInput;
    dateInput.value = todayForInput;

    function setDurationMode(mode) {
      durationMode = mode;
      const daysActive = mode === 'days';
      modeDaysBtn.style.borderColor = daysActive ? 'var(--blue)' : 'var(--border)';
      modeDaysBtn.style.background = daysActive ? 'var(--blue-tint)' : 'var(--bg)';
      modeDaysBtn.style.color = daysActive ? 'var(--blue-dark)' : 'var(--text-soft)';
      modeDateBtn.style.borderColor = !daysActive ? 'var(--blue)' : 'var(--border)';
      modeDateBtn.style.background = !daysActive ? 'var(--blue-tint)' : 'var(--bg)';
      modeDateBtn.style.color = !daysActive ? 'var(--blue-dark)' : 'var(--text-soft)';
      daysInput.style.display = daysActive ? 'block' : 'none';
      dateInput.style.display = daysActive ? 'none' : 'block';
    }
    modeDaysBtn.onclick = () => setDurationMode('days');
    modeDateBtn.onclick = () => setDurationMode('date');

    const courseTypeOptions = [
      { key: 'Курс', label: 'Курс' },
      { key: 'Мини-группа', label: 'Мини-группа' },
      { key: 'Экспресс-курс', label: 'Экспресс' },
    ];
    function renderCourseTypeButtons() {
      courseTypeBox.innerHTML = '';
      courseTypeOptions.forEach((opt) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        const active = selectedCourseType === opt.key;
        btn.style.cssText = `flex:1;padding:8px 2px;border-radius:10px;border:2px solid ${active ? 'var(--blue)' : 'var(--border)'};background:${active ? 'var(--blue-tint)' : 'var(--bg)'};color:${active ? 'var(--blue-dark)' : 'var(--text-soft)'};font-weight:700;font-size:11.5px;cursor:pointer;`;
        btn.textContent = opt.label;
        btn.onclick = () => { selectedCourseType = opt.key; renderCourseTypeButtons(); };
        courseTypeBox.appendChild(btn);
      });
    }
    renderCourseTypeButtons();
    setDurationMode('days');

    async function loadSubjectPicker(onPick) {
      subjectsBox.innerHTML = '<div class="field-hint">Загружаем предметы…</div>';
      try {
        const subjects = await apiGet('/api/admin/subjects');
        subjectsBox.innerHTML = '';
        subjects.forEach((s) => {
          const sBtn = document.createElement('button');
          sBtn.type = 'button';
          const sActive = selectedSubjectId === s.id;
          sBtn.style.cssText = `text-align:left;padding:9px 11px;border-radius:10px;border:2px solid ${sActive ? 'var(--blue)' : 'var(--border)'};background:${sActive ? 'var(--blue-tint)' : 'var(--bg)'};color:${sActive ? 'var(--blue-dark)' : 'var(--text)'};font-weight:700;font-size:12.5px;cursor:pointer;`;
          sBtn.textContent = s.title;
          sBtn.onclick = () => { selectedSubjectId = s.id; onPick(); [...subjectsBox.children].forEach((b) => b.style.borderColor = 'var(--border)'); sBtn.style.borderColor = 'var(--blue)'; sBtn.style.background = 'var(--blue-tint)'; };
          subjectsBox.appendChild(sBtn);
        });
      } catch (err) {
        subjectsBox.innerHTML = '<div class="field-hint" style="color:var(--red-dark);">Не получилось загрузить предметы.</div>';
      }
    }

    function renderRoleButtons() {
      rolesBox.innerHTML = '';
      roleOptions.forEach((opt) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        const active = selectedRole === opt.key;
        btn.style.cssText = `text-align:left;padding:11px;border-radius:12px;border:2px solid ${active ? 'var(--blue)' : 'var(--border)'};background:${active ? 'var(--blue-tint)' : 'var(--bg-soft)'};color:${active ? 'var(--blue-dark)' : 'var(--text)'};font-weight:700;font-size:13.5px;cursor:pointer;`;
        btn.textContent = opt.label;
        btn.onclick = async () => {
          selectedRole = opt.key;
          renderRoleButtons();
          saveBtn.disabled = false;
          if (opt.key === 'teacher') {
            subjectWrap.style.display = 'block';
            subjectLabel.textContent = 'Предмет';
            accessWrap.style.display = 'none';
            loadSubjectPicker(() => {});
          } else if (opt.key === 'student') {
            subjectWrap.style.display = 'block';
            subjectLabel.textContent = 'Открыть доступ к предмету (необязательно)';
            loadSubjectPicker(() => { accessWrap.style.display = 'block'; });
          } else {
            subjectWrap.style.display = 'none';
            accessWrap.style.display = 'none';
            selectedSubjectId = null;
          }
        };
        rolesBox.appendChild(btn);
      });
    }
    renderRoleButtons();

    saveBtn.onclick = async () => {
      if (!selectedRole) return;
      if (selectedRole === 'student' && selectedSubjectId && durationMode === 'days' && (!daysInput.value || parseInt(daysInput.value, 10) < 1)) {
        errBox.textContent = 'Укажите количество дней.';
        errBox.style.display = 'block';
        return;
      }
      if (selectedRole === 'student' && selectedSubjectId && durationMode === 'date' && !dateInput.value) {
        errBox.textContent = 'Укажите дату окончания доступа.';
        errBox.style.display = 'block';
        return;
      }
      saveBtn.disabled = true;
      saveBtn.textContent = 'Назначаю…';
      try {
        const payload = { role: selectedRole };
        if (selectedRole === 'teacher' && selectedSubjectId) payload.subject_id = selectedSubjectId;
        await apiSend('POST', `/api/admin/users/${u.telegram_id}/role`, payload);
        if (selectedRole === 'student' && selectedSubjectId) {
          const grantPayload = { telegram_id: u.telegram_id, course_type: selectedCourseType };
          if (durationMode === 'days') grantPayload.days = parseInt(daysInput.value, 10);
          else grantPayload.expires_at = dateInput.value;
          await apiSend('POST', `/api/teacher/subjects/${selectedSubjectId}/grant-subscription`, grantPayload);
        }
        closeOverlay();
        showToast('Роль назначена');
        render(false);
      } catch (err) {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Назначить';
        errBox.textContent = 'Не получилось: ' + err.message;
        errBox.style.display = 'block';
      }
    };
  }

  // кнопками, регулярные дни, плитки абонемента/ДЗ/Telegram) =====
  const SC_MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  const SC_WEEKDAY_IN = ['В понедельник', 'Во вторник', 'В среду', 'В четверг', 'В пятницу', 'В субботу', 'В воскресенье'];

  function scLessonWhen(scheduledAt) {
    const [y, m, d] = scheduledAt.slice(0, 10).split('-').map(Number);
    const date = new Date(y, m - 1, d);
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const diff = Math.round((date - today) / 86400000);
    const time = scheduledAt.slice(11, 16);
    if (diff === 0) return `Сегодня в ${time}`;
    if (diff === 1) return `Завтра в ${time}`;
    const wd = (date.getDay() + 6) % 7;
    if (diff > 1 && diff < 7) return `${SC_WEEKDAY_IN[wd]} в ${time}`;
    return `${d} ${SC_MONTHS_GEN[m - 1]} в ${time}`;
  }

            await apiSend('POST', `/api/teacher/lessons/${n.id}/conducted`, {});
            showToast('Отмечено: проведён');
            refreshThisScreen();
          }));
          acts.appendChild(act('Перенос', '', async () => promptRescheduleLesson(lo, refreshThisScreen)));
          acts.appendChild(act('Отмена<small>без списания</small>', '', async () => scConfirm('Отменить занятие без списания?', async () => {
            await apiSend('POST', `/api/teacher/lessons/${n.id}/cancel`, { charge: false });
            showToast('Занятие отменено');
            refreshThisScreen();
          })));
          acts.appendChild(act('Отмена<small>со списанием</small>', '', async () => scConfirm('Отменить занятие со списанием с абонемента?', async () => {
            await apiSend('POST', `/api/teacher/lessons/${n.id}/cancel`, { charge: true });
            showToast('Отменено со списанием');
            refreshThisScreen();
          })));
          box.appendChild(acts);
          const remind = act('🔔 Напомнить об уроке', 'wide', async () => {
            await apiSend('POST', `/api/teacher/lessons/${n.id}/remind`, {});
            showToast('Напоминание отправлено');
          });
          box.appendChild(remind);
          lessonsCard.appendChild(box);

          upcoming.slice(1).forEach((l) => {
            const r = document.createElement('div');
            r.className = 'sc-more-row';
            r.innerHTML = `<span>${scLessonWhen(l.scheduled_at)}</span><span class="muted">${l.duration_minutes || 60} мин</span>`;
            r.onclick = () => promptLessonActions(toLessonObj(l), refreshThisScreen);
            lessonsCard.appendChild(r);
          });
        } else {
          const empty = document.createElement('div');
          empty.className = 'sc-next';
          empty.innerHTML = '<div class="sc-next-when" style="color:var(--text-soft);">Ближайших занятий нет</div><div class="sc-next-meta">Запланируйте разовый урок или регулярное занятие.</div>';
          const acts = document.createElement('div');
          acts.className = 'sc-actions';
          acts.style.gridTemplateColumns = '1fr 1fr';
          const a1 = document.createElement('button');
          a1.className = 'sc-act primary';
          a1.textContent = '+ Урок';
          a1.onclick = () => promptAddLesson(refreshThisScreen);
          const a2 = document.createElement('button');
          a2.className = 'sc-act';
          a2.textContent = '+ Регулярно';
          a2.onclick = () => promptAddLessonSeries(refreshThisScreen);
          acts.appendChild(a1);
          acts.appendChild(a2);
          empty.appendChild(acts);
          lessonsCard.appendChild(empty);
        }

        // Дни недели квадратиками + «Регулярно: Вт 18:00 · Чт 10:00».
        const week = document.createElement('div');
        week.className = 'sc-week';
        const days = new Set((c.recurring || []).map((r) => r.weekday));
        WEEKDAY_SHORT.forEach((w, i) => {
          const d = document.createElement('div');
          d.className = 'sc-wd' + (days.has(i) ? ' on' : '');
          d.style.setProperty('--ev', color);
          d.innerHTML = `${w}<i></i>`;
          week.appendChild(d);
        });
        lessonsCard.appendChild(week);
        const reg = document.createElement('div');
        reg.className = 'sc-regular';
        const recText = (c.recurring || []).map((r) => `${WEEKDAY_SHORT[r.weekday]} ${r.time}`).join(' \u00b7 ');
        reg.innerHTML = `<span>${recText ? 'Регулярно: ' + escapeHtml(recText) : 'Регулярного расписания нет'}</span>`;
        const regBtn = document.createElement('button');
        regBtn.textContent = recText ? 'изменить' : 'добавить';
        regBtn.onclick = () => {
          if (recText) { stack = [{ level: 'lessons', title: 'Мои уроки' }]; render(false); }
          else promptAddLessonSeries(refreshThisScreen);
        };
        reg.appendChild(regBtn);
        lessonsCard.appendChild(reg);
        main.appendChild(lessonsCard);

        // --- Плитки справа ---
        const tile = (title, valueHtml, onClick, extra) => {
          const t = document.createElement('div');
          t.className = 'sc-card' + (onClick ? ' link' : '');
          t.innerHTML = `<div class="sc-card-title"><span>${title}</span>${onClick ? '<span class="arr">\u203a</span>' : ''}</div>${valueHtml}`;
          if (extra) t.appendChild(extra);
          if (onClick) t.onclick = onClick;
          side.appendChild(t);
          return t;
        };

        const p = c.active_package;
        if (p) {
          const bar = document.createElement('div');
          bar.className = 'sc-progress';
          const pct = p.total_lessons ? Math.round(p.remaining_lessons / p.total_lessons * 100) : 0;
          bar.innerHTML = `<span style="width:${pct}%;${p.remaining_lessons <= 2 ? 'background:#E3B341;' : ''}"></span>`;
          tile('Абонементы и оплаты',
            `<div class="sc-tile-val">Осталось ${p.remaining_lessons} из ${p.total_lessons}${p.status === 'unpaid' ? ' \u00b7 <span style="color:var(--red-dark);">ждёт оплаты</span>' : ''}</div>`,
            () => { stack = [{ level: 'packages', title: 'Абонементы' }]; render(false); }, bar);
        } else {
          tile('Абонементы и оплаты', '<div class="sc-tile-val muted">Абонемента нет \u2014 создать</div>',
            () => { stack = [{ level: 'packages', title: 'Абонементы' }]; render(false); });
        }

        const hw = c.homework || {};
        const hwParts = [];
        if (hw.open) hwParts.push(`${hw.open} ${dashPlural(hw.open, 'задание', 'задания', 'заданий')}`);
        if (hw.awaiting_review) hwParts.push(`<span style="color:var(--d-accent);">${hw.awaiting_review} на проверке</span>`);
        if (hw.overdue) hwParts.push(`<span style="color:var(--red-dark);">${hw.overdue} просрочено</span>`);
        tile('Заметки и ДЗ',
          `<div class="sc-tile-val${hwParts.length ? '' : ' muted'}">${hwParts.length ? hwParts.join(' \u00b7 ') : 'Заданий нет'}</div>`,
          () => renderHomeworkDiary(studentId, displayName));

        if (c.username) {
          tile('Telegram', `<div class="sc-tile-val">@${escapeHtml(c.username)} \u00b7 написать</div>`,
            () => openExternalLink('https://t.me/' + c.username));
        } else {
          tile('Telegram', '<div class="sc-tile-val muted">Ника нет \u2014 напомнить можно кнопкой «Напомнить об уроке»</div>');
        }

        if (groups.length) {
          const sel = document.createElement('select');
          sel.className = 'field-input';
          sel.style.marginTop = '2px';
          sel.innerHTML = '<option value="">\u2014 без группы \u2014</option>' +
            groups.map((g) => `<option value="${g.id}"${g.title === groupTitle ? ' selected' : ''}>${escapeHtml(g.title)}</option>`).join('');
          sel.onclick = (e) => e.stopPropagation();
          sel.onchange = async () => {
            const groupId = sel.value ? parseInt(sel.value, 10) : null;
            try {
              await apiSend('POST', `/api/teacher/students/${studentId}/group`, { group_id: groupId });
              showToast('Группа обновлена');
              groupTitle = groupId ? groups.find((g) => g.id === groupId)?.title : null;
            } catch (err) { showToast('Не получилось: ' + err.message); }
          };
          tile('Группа', '', null, sel);
        }

        // --- Курсы (подписки на предмет) ---
        const now = new Date().toISOString().slice(0, 10);
        const activeSubs = subs.filter((x) => x.expires_at >= now);
        const coursesTile = document.createElement('div');
        coursesTile.className = 'sc-card';
        coursesTile.innerHTML = `<div class="sc-card-title"><span>Доступ к курсу</span></div><div class="sc-tile-val${activeSubs.length ? '' : ' muted'}">${activeSubs.length ? 'Активен до ' + fmtDate(activeSubs.map((x) => x.expires_at).sort().pop()) : 'Нет активного доступа'}</div>`;
        if (currentSubjectId) {
          const grant = document.createElement('button');
          grant.className = 'sc-act wide';
          grant.style.marginTop = '10px';
          grant.textContent = '➕ Продлить / выдать доступ';
          grant.onclick = () => promptGrantSubscription(studentId);
          coursesTile.appendChild(grant);
        }
        side.appendChild(coursesTile);

        if (subs.length) {
          const st = document.createElement('div');
          st.className = 'sc-section-title';
          st.textContent = 'История доступа';
          root.appendChild(st);
          const list = document.createElement('div');
          list.className = 'list';
          subs.forEach((sub) => {
            const active = sub.expires_at >= now;
            const row = document.createElement('div');
            row.className = 'row-card';
            row.style.opacity = active ? '1' : '0.55';
            const body = document.createElement('div');
            body.style.flex = '1';
            body.innerHTML = `<div class="row-title">${escapeHtml(sub.subject_title)}</div><div class="row-sub">${escapeHtml(sub.course_type || 'Курс')} \u00b7 ${active ? 'до ' : 'истекла '}${fmtDate(sub.expires_at)}</div>`;
            row.appendChild(body);
            if (active) {
              const delBtn = document.createElement('button');
              delBtn.className = 'icon-btn';
              delBtn.innerHTML = ICONS.trash;
              delBtn.onclick = () => {
                confirmDelete('Отозвать подписку на «' + sub.subject_title + '»?', async () => {
                  await apiSend('DELETE', `/api/teacher/subscriptions/${sub.id}`);
                  refreshThisScreen();
                });
              };
              row.appendChild(delBtn);
            }
            list.appendChild(row);
          });
          root.appendChild(list);
        }
      }, false);
    } catch (err) { showErrorMsg(err, false); }
  }

  async function renderHomeworkDiary(studentId, displayName) {
    showLoadingMenu();
    try {
      const entries = await apiGet(`/api/teacher/students/${studentId}/homework`);
      swapScreen((screen) => {
        const title = document.createElement('div');
        title.style.cssText = "font-family:'Involve',sans-serif;font-weight:800;font-size:17px;margin-bottom:14px;";
        title.textContent = 'Дневник ДЗ: ' + displayName;
        screen.appendChild(title);

        const addBtn = document.createElement('button');
        addBtn.className = 'add-row-btn';
        addBtn.style.width = '100%';
        addBtn.style.marginBottom = '14px';
        addBtn.textContent = '➕ Задать ДЗ';
        addBtn.onclick = () => promptAddHomework(studentId, () => renderHomeworkDiary(studentId, displayName));
        screen.appendChild(addBtn);

        if (!entries.length) {
          const p = document.createElement('p');
          p.className = 'state-msg';
          p.textContent = 'Пока нет ни одной записи.';
          screen.appendChild(p);
          return;
        }

        const statusMeta = {
          assigned: ['Задано', '#FFF3D6', '#B7791F'],
          awaiting_review: ['Ждёт проверки', '#E4ECFB', '#3B5BA9'],
          accepted: ['Принято', '#E3F9E5', 'var(--green-dark)'],
        };
        entries.forEach((e) => {
          const [y, m, d] = e.entry_date.split('-');
          const [label, bg, color] = statusMeta[e.status] || [e.status, 'var(--bg-soft)', 'var(--text-soft)'];
          const row = document.createElement('div');
          row.className = 'row-card';
          row.style.cssText = 'cursor:pointer;align-items:flex-start;';
          const info = document.createElement('div');
          info.style.cssText = 'flex:1;min-width:0;';
          info.innerHTML = `<div class="row-title">${d}.${m}.${y}</div>` +
            `<div class="field-hint" style="margin-top:2px;">${escapeHtml(e.text.slice(0, 60))}${e.text.length > 60 ? '…' : ''}</div>`;
          row.appendChild(info);
          const badge = document.createElement('span');
          badge.style.cssText = `padding:4px 9px;border-radius:8px;font-size:11px;font-weight:800;flex-shrink:0;background:${bg};color:${color};`;
          badge.textContent = label;
          row.appendChild(badge);
          row.onclick = () => promptHomeworkDetail(e, studentId, displayName);
          screen.appendChild(row);
        });
      }, false);
    } catch (err) { showErrorMsg(err, false); }
  }

  async function _uploadFileForHomework(file, statusEl) {
    statusEl.textContent = 'Загружаю файл…';
    const formData = new FormData();
    formData.append('file', file);
    const res = await fetch(API_BASE_URL + '/api/upload-file', {
      method: 'POST',
      headers: { 'X-Telegram-Init-Data': tg?.initData || '' },
      body: formData,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || data.error || 'Не удалось загрузить файл');
    statusEl.textContent = '📎 ' + data.file_name;
    return data;
  }

  function promptAddHomework(studentId, onDone) {
    lockBodyScroll();
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;';
    const box = document.createElement('div');
    box.style.cssText = 'background:var(--bg);border-radius:16px;padding:18px;max-width:340px;width:100%;max-height:90vh;overflow-y:auto;';
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    box.innerHTML =
      '<div class="field-label">Дата</div>' +
      '<input class="field-input" id="hwDate" type="date" style="margin-bottom:10px;">' +
      '<div class="field-label">Задание</div>' +
      '<textarea class="field-input" id="hwText" rows="4" placeholder="Что нужно сделать" style="margin-bottom:10px;resize:vertical;"></textarea>' +
      '<input type="file" id="hwFile" style="margin-bottom:6px;">' +
      '<div id="hwFileStatus" class="field-hint" style="margin-bottom:10px;"></div>' +
      '<div id="hwErr" style="color:var(--red-dark);font-size:12.5px;font-weight:700;margin-bottom:8px;display:none;"></div>' +
      '<div style="display:flex;gap:8px;">' +
      '<button class="back-btn" id="hwCancel" style="flex:1;">Отмена</button>' +
      '<button class="save-btn" id="hwSave" style="flex:1;margin-top:0;">Задать</button>' +
      '</div>';

    let uploadedFile = null;
    const fileInput = overlay.querySelector('#hwFile');
    const fileStatus = overlay.querySelector('#hwFileStatus');
    fileInput.onchange = async () => {
      const file = fileInput.files[0];
      if (!file) return;
      try {
        uploadedFile = await _uploadFileForHomework(file, fileStatus);
      } catch (err) {
        fileStatus.textContent = 'Ошибка загрузки: ' + err.message;
        uploadedFile = null;
      }
    };
    const closeOverlay = () => { unlockBodyScroll(); overlay.remove(); };
    overlay.querySelector('#hwCancel').onclick = closeOverlay;
    const dateInput = overlay.querySelector('#hwDate');
    const textInput = overlay.querySelector('#hwText');
    const errBox = overlay.querySelector('#hwErr');
    const saveBtn = overlay.querySelector('#hwSave');
    saveBtn.onclick = async () => {
      if (!dateInput.value || !textInput.value.trim()) {
        errBox.textContent = 'Укажите дату и текст задания.';
        errBox.style.display = 'block';
        return;
      }
      saveBtn.disabled = true;
      saveBtn.textContent = 'Сохраняю…';
      try {
        await apiSend('POST', `/api/teacher/students/${studentId}/homework`, {
          entry_date: dateInput.value,
          text: textInput.value.trim(),
          file_id: uploadedFile?.file_id || null,
          file_name: uploadedFile?.file_name || null,
        });
        closeOverlay();
        onDone();
      } catch (err) {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Задать';
        errBox.textContent = 'Не получилось: ' + err.message;
        errBox.style.display = 'block';
      }
    };
  }

    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;';
    const [y, m, d] = entry.entry_date.split('-');
    const box = document.createElement('div');
    box.style.cssText = 'background:var(--bg);border-radius:16px;padding:18px;max-width:340px;width:100%;max-height:85vh;overflow-y:auto;';
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    box.innerHTML =
      `<div style="font-weight:700;margin-bottom:10px;">${d}.${m}.${y}</div>` +
      `<div style="margin-bottom:10px;white-space:pre-wrap;">${escapeHtml(entry.text)}</div>` +
      (entry.file_id ? `<a href="${API_BASE_URL}/api/image/${entry.file_id}" target="_blank" style="display:block;margin-bottom:14px;color:var(--accent);font-weight:700;">📎 ${escapeHtml(entry.file_name || 'Файл')}</a>` : '') +
      (entry.student_note || entry.student_file_id ? (
        '<div class="field-hint" style="margin:14px 0 6px;text-transform:uppercase;font-weight:800;">Ответ ученика</div>' +
        (entry.student_note ? `<div style="margin-bottom:8px;white-space:pre-wrap;">${escapeHtml(entry.student_note)}</div>` : '') +
        (entry.student_file_id ? `<a href="${API_BASE_URL}/api/image/${entry.student_file_id}" target="_blank" style="display:block;margin-bottom:14px;color:var(--accent);font-weight:700;">📎 ${escapeHtml(entry.student_file_name || 'Файл')}</a>` : '')
      ) : '<div class="field-hint" style="margin-bottom:14px;">Ученик пока не отправил ответ.</div>') +
      '<div style="display:flex;flex-direction:column;gap:8px;">' +
      (entry.status === 'awaiting_review' ? '<button class="save-btn" id="hwAccept" style="margin-top:0;">✅ Принять</button>' : '') +
      (entry.status === 'awaiting_review' ? '<button class="back-btn" id="hwRevise">↩️ Вернуть на доработку</button>' : '') +
      '<button class="back-btn" id="hwDelete" style="color:var(--red-dark);">🗑 Удалить запись</button>' +
      '<button class="back-btn" id="hwClose">Закрыть</button>' +

    const closeOverlay = () => { unlockBodyScroll(); overlay.remove(); };
    overlay.querySelector('#hwClose').onclick = closeOverlay;
    const acceptBtn = overlay.querySelector('#hwAccept');
    if (acceptBtn) acceptBtn.onclick = async () => {
      await apiSend('POST', `/api/teacher/homework/${entry.id}/accept`, {});
      closeOverlay();
      renderHomeworkDiary(studentId, displayName);
    };
    const reviseBtn = overlay.querySelector('#hwRevise');
    if (reviseBtn) reviseBtn.onclick = async () => {

  // Спрашивает текст сообщения для замка (можно оставить пустым — тогда
  // подставится стандартное «Пока недоступно»). onSave вызывается с текстом.
  function promptLockMessage(currentMessage, onSave) {
    lockBodyScroll();
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;';
    overlay.innerHTML = '<div style="background:var(--bg);border-radius:16px;padding:18px;max-width:340px;width:100%;">' +
      '<div class="field-label">Сообщение для ученика (необязательно)</div>' +
      '<div class="field-hint" style="margin:0 0 8px;">Например: «Откроется после предыдущей темы» или «Скоро будет»</div>' +
      '<input class="field-input" id="lockMsgInput" value="" style="margin-bottom:14px;">' +
      '<div style="display:flex;gap:8px;">' +
      '<button class="back-btn" id="lockMsgCancel" style="flex:1;">Отмена</button>' +
      '<button class="save-btn" id="lockMsgSave" style="flex:1;margin-top:0;">Поставить замок</button>' +
      '</div></div>';
    document.body.appendChild(overlay);
    const input = overlay.querySelector('#lockMsgInput');
    input.value = currentMessage || '';
    input.focus();
    function closeOverlay() { unlockBodyScroll(); overlay.remove(); }
    overlay.querySelector('#lockMsgCancel').onclick = closeOverlay;
    overlay.querySelector('#lockMsgSave').onclick = async () => {
      closeOverlay();
      await onSave(input.value.trim() || 'Пока недоступно');
