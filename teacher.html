      rerenderOptionsArea();

      const eFieldObj = makeFormattedField('Объяснение (необязательно)', null, existing ? (existing.explanation || '') : '', 'Покажется ученику после ответа');
      const eInput = eFieldObj.textarea;
      card.appendChild(eFieldObj.wrapper);

      const saveBtn = document.createElement('button');
      saveBtn.className = 'save-btn';
      saveBtn.textContent = existing ? 'Сохранить изменения' : 'Добавить задание';
      saveBtn.onclick = async () => {
        const question = qInput.value.trim();
        if (!question) { showToast('Введите текст вопроса'); return; }

        let answer, options;
        if (type === 'text') {
          answer = textAnswerInput.value.trim();
          if (!answer) { showToast('Введите правильный ответ'); return; }
          options = [];
        } else {
          const filled = optionRows.filter(r => r.text.trim());
          if (filled.length < 2) { showToast('Добавьте хотя бы 2 варианта ответа'); return; }
          const correctOnes = filled.filter(r => r.correct).map(r => r.text.trim());
          if (correctOnes.length === 0) { showToast('Отметьте хотя бы один верный вариант'); return; }
          options = filled.map(r => r.text.trim());
          answer = type === 'multi' ? correctOnes : correctOnes[0];
        }

        const taskData = {
          question, description: dInput.value.trim(), type, options, answer, explanation: eInput.value.trim(),
          image_file_id: imageFileId, table_data: tableData,
        };

        saveBtn.disabled = true;
        try {
          if (existing) {
            await apiSend('PATCH', `/api/teacher/tasks/${existing.id}`, taskData);
            showToast('Изменения сохранены');
          } else {
            await apiSend('POST', `/api/teacher/topics/${topicId}/tasks`, taskData);
            showToast('Задание добавлено');
          }
          stack.pop();
          renderCrumbs();
          render(true);
        } catch (err) {
          saveBtn.disabled = false;
          showToast('Не получилось сохранить: ' + err.message);
        }
      };
      card.appendChild(saveBtn);

      screen.appendChild(card);
    }, isBack);
  }

  // --- Предпросмотр: показывает задание ровно так, как его увидит ученик,
  // и по-настоящему его "решает" (проверка теми же правилами, что в боте) ---
  function checkAnswerPreview(userAnswer, correctAnswer) {
    if (Array.isArray(correctAnswer) || Array.isArray(userAnswer)) {
      const u = new Set((Array.isArray(userAnswer) ? userAnswer : [userAnswer]).map(x => x.trim().toLowerCase()));
      const c = new Set((Array.isArray(correctAnswer) ? correctAnswer : [correctAnswer]).map(x => x.trim().toLowerCase()));
      return u.size === c.size && [...c].every(x => u.has(x));
    }
    const uClean = userAnswer.trim().toLowerCase().replace(/\s+/g, '');
    const cClean = correctAnswer.trim().toLowerCase().replace(/\s+/g, '');
    const isDigits = s => /^\d+$/.test(s);
    if (isDigits(cClean)) {
      return isDigits(uClean) && [...uClean].sort().join('') === [...cClean].sort().join('');
    }
    return uClean === cClean;
  }

  function escapeHtml(s) {
    return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function renderMarkdownText(s) {
    let out = escapeHtml(s);
    out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
    out = out.replace(/\*([^*]+)\*/g, '<b>$1</b>');
    out = out.replace(/_([^_]+)_/g, '<i>$1</i>');
    return out.replace(/\n/g, '<br>');
  }

  // Миниатюра фото фиксированного размера + кнопка разворота на весь экран
  function renderTaskImage(container, imageFileId) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:relative;display:inline-block;margin-bottom:14px;';
    const img = document.createElement('img');
    img.src = API_BASE_URL + '/api/image/' + imageFileId;
    img.style.cssText = 'width:100%;max-width:280px;height:160px;object-fit:cover;border-radius:12px;display:block;cursor:pointer;';
    const expandBtn = document.createElement('button');
    expandBtn.type = 'button';
    expandBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M7 3H3V7M13 3H17V7M7 17H3V13M13 17H17V13" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    expandBtn.style.cssText = 'position:absolute;bottom:8px;right:8px;width:30px;height:30px;border-radius:50%;border:none;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;cursor:pointer;';
    const openFull = () => {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;';
      const fullImg = document.createElement('img');
      fullImg.src = img.src;
      fullImg.style.cssText = 'max-width:100%;max-height:100%;border-radius:8px;';
      overlay.appendChild(fullImg);
      overlay.onclick = () => overlay.remove();
      document.body.appendChild(overlay);
    };
    img.onclick = openFull;
    expandBtn.onclick = openFull;
    wrap.appendChild(img);
    wrap.appendChild(expandBtn);
    container.appendChild(wrap);
  }

  async function renderTaskPreview(topicId, taskId, isBack) {
    showLoadingMenu();
    try {
      const tasks = await apiGet(`/api/teacher/topics/${topicId}/tasks`);
      const task = tasks.find(t => t.id === taskId);
      renderQuestionPreview(task, isBack, () => { stack.pop(); renderCrumbs(); render(true); });
    } catch (err) { showErrorMsg(err, isBack); }
  }

  // --- Тесты: детали (настройки + список вопросов) ---
  async function renderTestDetail(testId, title, isBack) {
    showLoadingMenu();
    try {
      const [tests, questions] = await Promise.all([
        apiGet(`/api/teacher/subjects/${currentSubjectId}/tests`),
        apiGet(`/api/teacher/tests/${testId}/questions`),
      ]);
      const test = tests.find(t => t.id === testId) || {};
      const scales = await apiGet(`/api/teacher/subjects/${currentSubjectId}/scales`);

      const counters = {};
      const labeled = questions.map(q => {
        const part = q.part || 'A';
        counters[part] = (counters[part] || 0) + 1;
        const prefix = part === 'A' ? 'А' : 'В';
        return Object.assign({}, q, {
          title: prefix + counters[part] + ': ' + q.question,
          sub: (q.type === 'text' ? 'Текстовый ответ' : (q.type === 'multi' ? 'Несколько верных' : 'Один верный')) + ' · ' + (q.max_score || 1) + ' балл(ов)',
        });
      });

      const listScreen = renderRowList(
        labeled, 'task', 'yellow',
        () => {},
        (item) => { stack.push({ level: 'testq_form', testId, editId: item.id, title: 'Изменить вопрос' }); renderCrumbs(); render(false); },
        (item) => confirmDelete('Удалить этот вопрос?', async () => {
          await apiSend('DELETE', `/api/teacher/testquestions/${item.id}`);
          render(false);
        }),
        'В этом тесте пока нет вопросов.', 'Добавить вопрос',
        () => { stack.push({ level: 'testq_form', testId, editId: null, title: 'Новый вопрос' }); renderCrumbs(); render(false); },
        (item) => { stack.push({ level: 'testq_preview', testId, qId: item.id, title: 'Предпросмотр' }); renderCrumbs(); render(false); },
      );

      if (listScreen) {
        if (questions.length) {
          const templateBtn = document.createElement('button');
          templateBtn.className = 'add-row-btn';
          templateBtn.style.cssText = 'width:100%;margin-bottom:12px;color:var(--blue-dark);';
          templateBtn.textContent = '📋 Добавить похожий вопрос';
          templateBtn.onclick = () => {
            const last = questions[questions.length - 1];
            stack.push({
              level: 'testq_form', testId, editId: null, title: 'Новый вопрос',
              templateFrom: { question: last.question, type: last.type, options: last.options, part: last.part, max_score: last.max_score },
            });
            renderCrumbs();
            render(false);
          };
          listScreen.insertBefore(templateBtn, listScreen.firstChild);
        }

        const ioRow = document.createElement('div');
        ioRow.style.cssText = 'display:flex;gap:8px;margin-bottom:12px;';

        const exportBtn = document.createElement('button');
        exportBtn.className = 'add-row-btn';
        exportBtn.style.flex = '1';
        exportBtn.textContent = '⬇️ Экспорт в .docx';
        exportBtn.onclick = () => {
          const url = API_BASE_URL + `/api/teacher/tests/${testId}/export?init_data=` + encodeURIComponent(tg?.initData || '');
          // На iPhone скачивание через fetch+blob не работает — открываем
          // ссылку в системном браузере, там скачивание работает как надо.
          if (tg?.openLink) tg.openLink(url); else window.open(url, '_blank');
        };
        ioRow.appendChild(exportBtn);

        const importBtn = document.createElement('button');
        importBtn.className = 'add-row-btn';
        importBtn.style.flex = '1';
        importBtn.textContent = '⬆️ Импорт из .docx';
        const importInput = document.createElement('input');
        importInput.type = 'file';
        importInput.accept = '.docx';
        importInput.style.display = 'none';
        importInput.onchange = async () => {
          const file = importInput.files[0];
          if (!file) return;
          importBtn.disabled = true;
          importBtn.textContent = 'Загружаю…';
          try {
            const formData = new FormData();
            formData.append('file', file);
            const res = await fetch(API_BASE_URL + `/api/teacher/tests/${testId}/import`, {
              method: 'POST',
              headers: { 'X-Telegram-Init-Data': tg?.initData || '' },
              body: formData,
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.message || data.detail || ('Сервер ответил с ошибкой: ' + res.status));
            showToast(`Добавлено вопросов: ${data.added}` + (data.errors?.length ? `, не распознано: ${data.errors.length}` : ''));
            render(false);
          } catch (err) {
            importBtn.disabled = false;
            importBtn.textContent = '⬆️ Импорт из .docx';
            showToast('Не получилось импортировать: ' + err.message);
          }
        };
        importBtn.onclick = () => importInput.click();
        ioRow.appendChild(importBtn);
        ioRow.appendChild(importInput);

        listScreen.insertBefore(ioRow, listScreen.firstChild);

        const settingsCard = document.createElement('div');
        settingsCard.className = 'form-card';
        settingsCard.style.marginBottom = '14px';

        const timerField = document.createElement('div');
        timerField.className = 'field';
        timerField.innerHTML = '<label class="field-label">Лимит времени (минут, необязательно)</label>';
        const timerInput = document.createElement('input');
        timerInput.className = 'field-input';
        timerInput.type = 'number';
        timerInput.min = '1';
        timerInput.placeholder = 'Без ограничения';
        timerInput.value = test.time_limit_minutes || '';
        timerField.appendChild(timerInput);
        settingsCard.appendChild(timerField);

        const scaleField = document.createElement('div');
        scaleField.className = 'field';
        scaleField.innerHTML = '<label class="field-label">Шкала перевода баллов</label>';
        const scaleSelect = document.createElement('select');
        scaleSelect.className = 'field-input';
        scaleSelect.style.cssText = 'font-family:\'Nunito\',sans-serif;';
        const noneOpt = document.createElement('option');
        noneOpt.value = '';
        noneOpt.textContent = 'Без шкалы (только первичный балл)';
        scaleSelect.appendChild(noneOpt);
        scales.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.id;
          opt.textContent = s.title;
          if (test.scale_id === s.id) opt.selected = true;
          scaleSelect.appendChild(opt);
        });
        scaleField.appendChild(scaleSelect);
        settingsCard.appendChild(scaleField);

        const saveSettingsBtn = document.createElement('button');
        saveSettingsBtn.className = 'save-btn';
        saveSettingsBtn.textContent = 'Сохранить настройки теста';
        saveSettingsBtn.onclick = async () => {
          saveSettingsBtn.disabled = true;
          saveSettingsBtn.textContent = 'Сохраняю…';
          try {
            await apiSend('PATCH', `/api/teacher/tests/${testId}`, {
              time_limit_minutes: timerInput.value ? parseInt(timerInput.value, 10) : null,
              scale_id: scaleSelect.value ? parseInt(scaleSelect.value, 10) : null,
            });
            showToast('Настройки сохранены');
          } catch (err) {
            showToast('Не получилось сохранить: ' + err.message);
          }
          saveSettingsBtn.disabled = false;
          saveSettingsBtn.textContent = 'Сохранить настройки теста';
        };
        settingsCard.appendChild(saveSettingsBtn);

        listScreen.insertBefore(settingsCard, listScreen.firstChild);
      }
    } catch (err) { showErrorMsg(err, isBack); }
  }

  async function renderTestQPreviewReal(testId, qId, isBack) {
    showLoadingMenu();
    try {
      const questions = await apiGet(`/api/teacher/tests/${testId}/questions`);
      const q = questions.find(x => x.id === qId);
      renderQuestionPreview(q, isBack, () => { stack.pop(); renderCrumbs(); render(true); });
    } catch (err) { showErrorMsg(err, isBack); }
  }

  // --- Форма вопроса теста — та же форма, что у задания, плюс часть (А/В) и баллы ---
  async function renderTestQForm(testId, editId, isBack, templateFrom) {
    showLoadingMenu();
    let existing = null;
    if (editId) {
      try {
        const questions = await apiGet(`/api/teacher/tests/${testId}/questions`);
        existing = questions.find(q => q.id === editId);
      } catch (err) { showErrorMsg(err, isBack); return; }
    }

    let type = existing ? existing.type : (templateFrom ? templateFrom.type : 'text');
    let part = existing ? (existing.part || 'A') : (templateFrom ? (templateFrom.part || 'A') : 'A');
    let maxScore = existing ? (existing.max_score || 1) : (templateFrom ? (templateFrom.max_score || 1) : 1);
    let optionRows = [];
    if (existing && existing.type !== 'text') {
      const correctSet = new Set(Array.isArray(existing.answer) ? existing.answer : [existing.answer]);
      optionRows = existing.options.map(o => ({ text: o, correct: correctSet.has(o) }));
    } else if (!existing && templateFrom && templateFrom.type !== 'text') {
      optionRows = templateFrom.options.map(o => ({ text: o, correct: false }));
    }

    swapScreen((screen) => {
      const card = document.createElement('div');
      card.className = 'form-card';

      const partField = document.createElement('div');
      partField.className = 'field';
      partField.innerHTML = '<label class="field-label">Часть теста</label>';
      const partSeg = document.createElement('div');
      partSeg.className = 'segmented';
      [['A', 'Часть А'], ['B', 'Часть В']].forEach(([val, label]) => {
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = label;
        if (val === part) b.classList.add('active');
        b.onclick = () => { part = val; partSeg.querySelectorAll('button').forEach(x => x.classList.remove('active')); b.classList.add('active'); };
        partSeg.appendChild(b);
      });
      partField.appendChild(partSeg);
      card.appendChild(partField);

      const scoreField = document.createElement('div');
      scoreField.className = 'field';
      scoreField.innerHTML = '<label class="field-label">Баллы за вопрос</label>';
      const scoreInput = document.createElement('input');
      scoreInput.className = 'field-input';
      scoreInput.type = 'number';
      scoreInput.min = '1';
      scoreInput.value = maxScore;
      scoreField.appendChild(scoreInput);
      card.appendChild(scoreField);

      const typeField = document.createElement('div');
      typeField.className = 'field';
      typeField.innerHTML = '<label class="field-label">Тип вопроса</label>';
      const seg = document.createElement('div');
      seg.className = 'segmented';
      const typeOptions = [['text', 'Текстовый ответ'], ['buttons', 'Один верный'], ['multi', 'Несколько верных']];
      typeOptions.forEach(([val, label]) => {
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = label;
        if (val === type) b.classList.add('active');
        b.onclick = () => { type = val; rerenderOptionsArea(); seg.querySelectorAll('button').forEach(x => x.classList.remove('active')); b.classList.add('active'); };
        seg.appendChild(b);
      });
      typeField.appendChild(seg);
      card.appendChild(typeField);

      const qFieldObj = makeFormattedField('Вопрос', null, existing ? existing.question : (templateFrom ? templateFrom.question : ''), 'Текст вопроса');
      const qInput = qFieldObj.textarea;
      card.appendChild(qFieldObj.wrapper);

      const dFieldObj = makeFormattedField('Описание (необязательно)', null, existing ? (existing.description || '') : '', 'Дополнительный текст к вопросу');
      const dInput = dFieldObj.textarea;
      card.appendChild(dFieldObj.wrapper);

      let imageFileId = existing ? (existing.image_file_id || null) : null;
      let imageUploading = false;
      const imageField = document.createElement('div');
      imageField.className = 'field';
      card.appendChild(imageField);
      renderImageField();

      function renderImageField() {
        imageField.innerHTML = '<label class="field-label">Фото к вопросу (необязательно)</label>';
        if (imageUploading) {
          const p = document.createElement('div');
          p.className = 'field-hint';
          p.textContent = 'Загружаю фото…';
          imageField.appendChild(p);
          return;
        }
        if (imageFileId) {
          const preview = document.createElement('div');
          preview.style.cssText = 'position:relative;display:inline-block;';
          const img = document.createElement('img');
          img.src = API_BASE_URL + '/api/image/' + imageFileId;
          img.style.cssText = 'max-width:160px;max-height:120px;border-radius:10px;border:2px solid var(--border);display:block;';
          preview.appendChild(img);
          const removeBtn = document.createElement('button');
          removeBtn.type = 'button';
          removeBtn.innerHTML = ICONS.trash;
          removeBtn.style.cssText = 'position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:none;background:var(--red);color:white;display:flex;align-items:center;justify-content:center;cursor:pointer;';
          removeBtn.onclick = () => { imageFileId = null; renderImageField(); };
          preview.appendChild(removeBtn);
          imageField.appendChild(preview);
        } else {
          const uploadBtn = document.createElement('button');
          uploadBtn.type = 'button';
          uploadBtn.className = 'add-option-btn';
          uploadBtn.innerHTML = '🖼 Загрузить фото';
          const fileInput = document.createElement('input');
          fileInput.type = 'file';
          fileInput.accept = 'image/*';
          fileInput.style.display = 'none';
          fileInput.onchange = async () => {
            const file = fileInput.files[0];
            if (!file) return;
            imageUploading = true;
            renderImageField();
            try {
              const formData = new FormData();
              formData.append('image', file);
              const res = await fetch(API_BASE_URL + '/api/teacher/upload-image', {
                method: 'POST',
                headers: { 'X-Telegram-Init-Data': tg?.initData || '' },
                body: formData,
              });
              const data = await res.json().catch(() => ({}));
              if (!res.ok) throw new Error(data.message || data.detail || ('Сервер ответил с ошибкой: ' + res.status));
              imageFileId = data.file_id;
            } catch (err) {
              showToast('Не получилось загрузить фото: ' + err.message);
            }
            imageUploading = false;
            renderImageField();
          };
          uploadBtn.onclick = () => fileInput.click();
          imageField.appendChild(uploadBtn);
          imageField.appendChild(fileInput);
        }
      }

      let tableData = existing && existing.table_data ? existing.table_data.map(row => row.slice()) : null;
      const tableArea = document.createElement('div');
      card.appendChild(tableArea);
      renderTableArea();

      function autoGrowCell(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

      function renderTableArea() {
        tableArea.innerHTML = '';
        if (!tableData) {
          const addTableBtn = document.createElement('button');
          addTableBtn.type = 'button';
          addTableBtn.className = 'add-option-btn';
          addTableBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M10 4V16M4 10H16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg> Добавить таблицу';
          addTableBtn.style.marginBottom = '16px';
          addTableBtn.onclick = () => { tableData = [['', ''], ['', '']]; renderTableArea(); };
          tableArea.appendChild(addTableBtn);
          return;
        }
        const field = document.createElement('div');
        field.className = 'field';
        field.innerHTML = '<label class="field-label">Таблица</label>';
        const grid = document.createElement('div');
        grid.style.cssText = 'display:flex;flex-direction:column;gap:6px;margin-bottom:8px;width:100%;';
        tableData.forEach((row, ri) => {
          const rowEl = document.createElement('div');
          rowEl.style.cssText = 'display:flex;gap:6px;width:100%;';
          row.forEach((cell, ci) => {
            const cellInput = document.createElement('textarea');
            cellInput.rows = 1;
            cellInput.className = 'field-input';
            cellInput.style.cssText = 'padding:8px 10px;font-size:13px;flex:1;min-width:0;resize:none;overflow:hidden;line-height:1.4;word-break:break-word;';
            cellInput.value = cell;
            cellInput.oninput = () => { tableData[ri][ci] = cellInput.value; autoGrowCell(cellInput); };
            rowEl.appendChild(cellInput);
            setTimeout(() => autoGrowCell(cellInput), 0);
          });
          grid.appendChild(rowEl);
        });
        field.appendChild(grid);
        const controls = document.createElement('div');
        controls.style.cssText = 'display:flex;gap:14px;flex-wrap:wrap;';
        const addRowBtn = document.createElement('button');
        addRowBtn.type = 'button'; addRowBtn.className = 'add-option-btn';
        addRowBtn.textContent = '+ строка';
        addRowBtn.onclick = () => { tableData.push(tableData[0].map(() => '')); renderTableArea(); };
        controls.appendChild(addRowBtn);
        const addColBtn = document.createElement('button');
        addColBtn.type = 'button'; addColBtn.className = 'add-option-btn';
        addColBtn.textContent = '+ столбец';
        addColBtn.onclick = () => { tableData.forEach(row => row.push('')); renderTableArea(); };
        controls.appendChild(addColBtn);
        const removeTableBtn = document.createElement('button');
        removeTableBtn.type = 'button'; removeTableBtn.className = 'add-option-btn';
        removeTableBtn.style.color = 'var(--red-dark)';
        removeTableBtn.textContent = '✕ Убрать таблицу';
        removeTableBtn.onclick = () => { tableData = null; renderTableArea(); };
        controls.appendChild(removeTableBtn);
        field.appendChild(controls);
        tableArea.appendChild(field);
      }

      const answerArea = document.createElement('div');
      card.appendChild(answerArea);
      let textAnswerInput;

      function rerenderOptionsArea() {
        answerArea.innerHTML = '';
        if (type === 'text') {
          const f = document.createElement('div');
          f.className = 'field';
          f.innerHTML = '<label class="field-label">Правильный ответ</label>';
          textAnswerInput = document.createElement('input');
          textAnswerInput.className = 'field-input';
          textAnswerInput.placeholder = 'Например: о';
          textAnswerInput.value = existing && existing.type === 'text' ? (existing.answer || '') : '';
          f.appendChild(textAnswerInput);
          const hint = document.createElement('div');
          hint.className = 'field-hint';
          hint.textContent = 'Если ответ состоит только из цифр — порядок не важен. Если есть буквы — важен и порядок, и то, какая буква с какой цифрой.';
          f.appendChild(hint);
          answerArea.appendChild(f);
        } else {
          const f = document.createElement('div');
          f.className = 'field';
          const isMulti = type === 'multi';
          f.innerHTML = '<label class="field-label">Варианты ответа</label><div class="field-hint" style="margin:0 0 10px">' + (isMulti ? 'Отметьте галочкой все верные варианты — можно несколько.' : 'Отметьте галочкой один верный вариант.') + '</div>';
          const optionsList = document.createElement('div');
          f.appendChild(optionsList);
          if (!optionRows.length) optionRows.push({ text: '', correct: false }, { text: '', correct: false });

          function renderOptionRowsQ() {
            optionsList.innerHTML = '';
            optionRows.forEach((row, i) => {
              const r = document.createElement('div');
              r.className = 'option-row';
              const toggle = document.createElement('button');
              toggle.type = 'button'; toggle.className = 'correct-toggle' + (row.correct ? ' on' : ''); toggle.innerHTML = ICONS.check;
              toggle.onclick = () => { if (!isMulti) optionRows.forEach(o => o.correct = false); row.correct = !row.correct; renderOptionRowsQ(); };
              r.appendChild(toggle);
              const input = document.createElement('input');
              input.className = 'field-input'; input.placeholder = 'Вариант ' + (i + 1); input.value = row.text;
              input.oninput = () => { row.text = input.value; };
              r.appendChild(input);
              const removeBtn = document.createElement('button');
              removeBtn.type = 'button'; removeBtn.className = 'option-remove'; removeBtn.innerHTML = ICONS.trash;
              removeBtn.onclick = () => { optionRows.splice(i, 1); renderOptionRowsQ(); };
              r.appendChild(removeBtn);
              optionsList.appendChild(r);
            });
          }
          renderOptionRowsQ();

          const addOptBtn = document.createElement('button');
          addOptBtn.type = 'button'; addOptBtn.className = 'add-option-btn';
          addOptBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M10 4V16M4 10H16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg> Добавить вариант';
          addOptBtn.onclick = () => { optionRows.push({ text: '', correct: false }); renderOptionRowsQ(); };
          f.appendChild(addOptBtn);
          answerArea.appendChild(f);
        }
      }
      rerenderOptionsArea();

      const eFieldObj = makeFormattedField('Объяснение (необязательно)', null, existing ? (existing.explanation || '') : '', 'Покажется ученику при разборе после теста');
      const eInput = eFieldObj.textarea;
      card.appendChild(eFieldObj.wrapper);

      const saveBtn = document.createElement('button');
      saveBtn.className = 'save-btn';
      saveBtn.textContent = existing ? 'Сохранить изменения' : 'Добавить вопрос';
      saveBtn.onclick = async () => {
        const question = qInput.value.trim();
        if (!question) { showToast('Введите текст вопроса'); return; }

        let answer, options;
        if (type === 'text') {
          answer = textAnswerInput.value.trim();
          if (!answer) { showToast('Введите правильный ответ'); return; }
          options = [];
        } else {
          const filled = optionRows.filter(r => r.text.trim());
          if (filled.length < 2) { showToast('Добавьте хотя бы 2 варианта ответа'); return; }
          const correctOnes = filled.filter(r => r.correct).map(r => r.text.trim());
          if (correctOnes.length === 0) { showToast('Отметьте хотя бы один верный вариант'); return; }
          options = filled.map(r => r.text.trim());
          answer = type === 'multi' ? correctOnes : correctOnes[0];
        }

        const qData = {
          question, description: dInput.value.trim(), type, options, answer, explanation: eInput.value.trim(),
          image_file_id: imageFileId, table_data: tableData,
          part, max_score: Math.max(1, parseInt(scoreInput.value, 10) || 1),
        };

        saveBtn.disabled = true;
        try {
          if (existing) {
            await apiSend('PATCH', `/api/teacher/testquestions/${existing.id}`, qData);
            showToast('Изменения сохранены');
          } else {
            await apiSend('POST', `/api/teacher/tests/${testId}/questions`, qData);
            showToast('Вопрос добавлен');
          }
          stack.pop();
          renderCrumbs();
          render(true);
        } catch (err) {
          saveBtn.disabled = false;
          showToast('Не получилось сохранить: ' + err.message);
        }
      };
      card.appendChild(saveBtn);

      screen.appendChild(card);
    }, isBack);
  }

  // --- Шкала перевода баллов ---
  async function renderScaleForm(scaleId, isBack) {
    showLoadingMenu();
    let existing = null;
    if (scaleId) {
      try {
        existing = await apiGet(`/api/teacher/scales/${scaleId}`);
      } catch (err) { showErrorMsg(err, isBack); return; }
    }

    let rows = existing ? Object.entries(existing.table).map(([k, v]) => ({ primary: k, actual: String(v) })) : [{ primary: '0', actual: '0' }];

    swapScreen((screen) => {
      const card = document.createElement('div');
      card.className = 'form-card';

      const titleFieldObj = makeFormattedField('Название шкалы', null, existing ? existing.title : '', 'Например: ЕГЭ, русский язык 2026');
      const titleInput = titleFieldObj.textarea;
      titleInput.rows = 1;
      card.appendChild(titleFieldObj.wrapper);

      const tableField = document.createElement('div');
      tableField.className = 'field';
      tableField.innerHTML = '<label class="field-label">Первичный балл → тестовый балл</label><div class="field-hint" style="margin:0 0 10px;">Для каждого первичного балла, который может набрать ученик, укажите итоговый.</div>';
      const rowsArea = document.createElement('div');
      tableField.appendChild(rowsArea);
      card.appendChild(tableField);

      function renderRows() {
        rowsArea.innerHTML = '';
        rows.forEach((row, i) => {
          const rowEl = document.createElement('div');
          rowEl.style.cssText = 'display:flex;gap:8px;align-items:center;margin-bottom:6px;';
          const primaryInput = document.createElement('input');
          primaryInput.className = 'field-input'; primaryInput.type = 'number'; primaryInput.style.flex = '1';
          primaryInput.placeholder = 'первичный'; primaryInput.value = row.primary;
          primaryInput.oninput = () => { row.primary = primaryInput.value; };
          rowEl.appendChild(primaryInput);
          const arrow = document.createElement('span');
          arrow.textContent = '→'; arrow.style.color = 'var(--text-soft)';
          rowEl.appendChild(arrow);
          const actualInput = document.createElement('input');
          actualInput.className = 'field-input'; actualInput.type = 'number'; actualInput.style.flex = '1';
          actualInput.placeholder = 'тестовый'; actualInput.value = row.actual;
          actualInput.oninput = () => { row.actual = actualInput.value; };
          rowEl.appendChild(actualInput);
          const delBtn = document.createElement('button');
          delBtn.type = 'button'; delBtn.className = 'option-remove'; delBtn.innerHTML = ICONS.trash;
          delBtn.onclick = () => { rows.splice(i, 1); renderRows(); };
          rowEl.appendChild(delBtn);
          rowsArea.appendChild(rowEl);
        });
      }
      renderRows();

      const addRowBtn = document.createElement('button');
      addRowBtn.type = 'button'; addRowBtn.className = 'add-option-btn';
      addRowBtn.textContent = '+ строка';
      addRowBtn.onclick = () => { rows.push({ primary: '', actual: '' }); renderRows(); };
      card.appendChild(addRowBtn);

      const autoWrap = document.createElement('div');
      autoWrap.style.cssText = 'display:flex;gap:8px;margin-top:14px;align-items:flex-end;';
      const autoMaxPrimary = document.createElement('div');
      autoMaxPrimary.style.flex = '1';
      autoMaxPrimary.innerHTML = '<label class="field-label" style="font-size:12px;">Макс. первичный</label>';
      const autoMaxPrimaryInput = document.createElement('input');
      autoMaxPrimaryInput.className = 'field-input'; autoMaxPrimaryInput.type = 'number';
      autoMaxPrimary.appendChild(autoMaxPrimaryInput);
      autoWrap.appendChild(autoMaxPrimary);
      const autoMaxActual = document.createElement('div');
      autoMaxActual.style.flex = '1';
      autoMaxActual.innerHTML = '<label class="field-label" style="font-size:12px;">Макс. тестовый</label>';
      const autoMaxActualInput = document.createElement('input');
      autoMaxActualInput.className = 'field-input'; autoMaxActualInput.type = 'number';
      autoMaxActual.appendChild(autoMaxActualInput);
      autoWrap.appendChild(autoMaxActual);
      const autoBtn = document.createElement('button');
      autoBtn.type = 'button'; autoBtn.className = 'add-option-btn'; autoBtn.style.flexShrink = '0';
      autoBtn.textContent = 'Заполнить автоматически';
      autoBtn.onclick = () => {
        const maxP = parseInt(autoMaxPrimaryInput.value, 10);
        const maxA = parseInt(autoMaxActualInput.value, 10);
        if (!maxP || !maxA) { showToast('Укажите оба максимума'); return; }
        rows = [];
        for (let p = 0; p <= maxP; p++) {
          rows.push({ primary: String(p), actual: String(Math.round((p / maxP) * maxA)) });
        }
        renderRows();
        showToast('Шкала заполнена — можно поправить отдельные значения вручную');
      };
      autoWrap.appendChild(autoBtn);
      card.appendChild(autoWrap);
      const autoHint = document.createElement('div');
      autoHint.className = 'field-hint';
      autoHint.style.marginTop = '6px';
      autoHint.textContent = 'Посчитает пропорционально сама — от 0 до максимума с обеих сторон, дальше можно подправить любую строку вручную.';
      card.appendChild(autoHint);

      const saveBtn = document.createElement('button');
      saveBtn.className = 'save-btn';
      saveBtn.textContent = existing ? 'Сохранить изменения' : 'Создать шкалу';
      saveBtn.onclick = async () => {
        const title = titleInput.value.trim();
        if (!title) { showToast('Введите название шкалы'); return; }
        const tableDict = {};
        for (const row of rows) {
          if (row.primary === '' || row.actual === '') continue;
          tableDict[String(parseInt(row.primary, 10))] = parseInt(row.actual, 10);
        }
        if (!Object.keys(tableDict).length) { showToast('Добавьте хотя бы одну строку шкалы'); return; }
        saveBtn.disabled = true;
        try {
          if (existing) {
            await apiSend('PATCH', `/api/teacher/scales/${scaleId}`, { title, table: tableDict });
            showToast('Изменения сохранены');
          } else {
            await apiSend('POST', `/api/teacher/subjects/${currentSubjectId}/scales`, { title, table: tableDict });
            showToast('Шкала создана');
          }
          stack.pop();
          renderCrumbs();
          render(true);
        } catch (err) {
          saveBtn.disabled = false;
          showToast('Не получилось сохранить: ' + err.message);
        }
      };
      card.appendChild(saveBtn);

      screen.appendChild(card);
    }, isBack);
  }

  function renderQuestionPreview(task, isBack, onClose) {
    swapScreen((screen) => {
      const banner = document.createElement('p');
      banner.className = 'preview-banner';
      banner.textContent = '👁 Так это увидит ученик — можно попробовать ответить';
      screen.appendChild(banner);

      const card = document.createElement('div');
      card.className = 'task-card';

      const q = document.createElement('p');
      q.className = 'task-question';
      q.innerHTML = renderMarkdownText(task.question);
      card.appendChild(q);

      if (task.description) {
        const d = document.createElement('p');
        d.className = 'task-description';
        d.innerHTML = renderMarkdownText(task.description);
        card.appendChild(d);
      }

      if (task.image_file_id) {
        renderTaskImage(card, task.image_file_id);
      }

      if (task.table_data && task.table_data.length) {
        const table = document.createElement('table');
        table.style.cssText = 'width:100%;border-collapse:collapse;margin-bottom:16px;table-layout:fixed;';
        task.table_data.forEach(row => {
          const tr = document.createElement('tr');
          row.forEach(cell => {
            const td = document.createElement('td');
            td.style.cssText = 'border:1px solid var(--border);padding:8px 10px;font-size:13.5px;word-break:break-word;';
            td.innerHTML = renderMarkdownText(cell);
            tr.appendChild(td);
          });
          table.appendChild(tr);
        });
        card.appendChild(table);
      }

      const answerArea = document.createElement('div');
      card.appendChild(answerArea);

      function finish(result, answer, optionEls, correctList) {
        if (optionEls && correctList) {
          const selectedSet = new Set(Array.isArray(answer) ? answer : [answer]);
          const correctSet = new Set(correctList);
          optionEls.forEach((btn) => {
            const opt = btn.querySelector('.option-text').textContent;
            const isSelected = selectedSet.has(opt);
            const isCorrectOpt = correctSet.has(opt);
            btn.classList.remove('selected');
            btn.onclick = null;
            if (isSelected && isCorrectOpt) btn.classList.add('correct-selected');
            else if (isSelected && !isCorrectOpt) btn.classList.add('incorrect-selected');
            else if (!isSelected && isCorrectOpt) {
              btn.classList.add('correct-missed');
              const tag = document.createElement('span');
              tag.className = 'option-tag';
              tag.textContent = 'пропущено';
              btn.appendChild(tag);
            } else btn.classList.add('neutral-final');
          });
        }
        answerArea.querySelectorAll('.skip-btn, .save-btn, .field-input').forEach(el => el.remove());

        const feedback = document.createElement('div');
        feedback.className = 'feedback ' + (result ? 'ok' : 'bad');
        const title = document.createElement('p');
        title.className = 'feedback-title';
        title.textContent = result ? '✅ Верно!' : '❌ Неверно';
        feedback.appendChild(title);
        if (task.explanation) {
          const explain = document.createElement('p');
          explain.className = 'feedback-explain';
          explain.innerHTML = renderMarkdownText(task.explanation);
          feedback.appendChild(explain);
        }
        card.appendChild(feedback);
      }

      if ((task.type === 'buttons' || task.type === 'multi') && task.options.length) {
        const correctList = Array.isArray(task.answer) ? task.answer : [task.answer];
        const isMulti = task.type === 'multi';
        let selected = [];

        const checkBtn = document.createElement('button');
        checkBtn.className = 'save-btn';
        checkBtn.style.marginTop = '4px';
        checkBtn.textContent = 'Проверить';
        checkBtn.disabled = true;

        const optionEls = task.options.map((opt, i) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.innerHTML = '<span class="option-num">' + (i + 1) + '</span><span class="option-text"></span>';
          btn.querySelector('.option-text').textContent = opt;
          btn.onclick = () => {
            if (isMulti) {
              const pos = selected.indexOf(opt);
              if (pos === -1) { selected.push(opt); btn.classList.add('selected'); }
              else { selected.splice(pos, 1); btn.classList.remove('selected'); }
            } else {
              selected = [opt];
              optionEls.forEach(b => b.classList.remove('selected'));
              btn.classList.add('selected');
            }
            checkBtn.disabled = selected.length === 0;
          };
          answerArea.appendChild(btn);
          return btn;
        });

        checkBtn.onclick = () => finish(checkAnswerPreview(selected, correctList), selected, optionEls, correctList);
        answerArea.appendChild(checkBtn);
      } else {
        const input = document.createElement('input');
        input.className = 'field-input';
        input.placeholder = 'Введите ответ…';
        input.style.marginBottom = '10px';
        answerArea.appendChild(input);

        const checkBtn = document.createElement('button');
        checkBtn.className = 'save-btn';
        checkBtn.style.marginTop = '0';
        checkBtn.textContent = 'Проверить';
        checkBtn.disabled = true;
        input.addEventListener('input', () => { checkBtn.disabled = !input.value.trim(); });
        checkBtn.onclick = () => {
          if (!input.value.trim()) return;
          finish(checkAnswerPreview(input.value.trim(), task.answer), input.value.trim());
        };
        answerArea.appendChild(checkBtn);
      }

      screen.appendChild(card);

      const closeBtn = document.createElement('button');
      closeBtn.className = 'back-btn';
      closeBtn.style.cssText = 'width:100%;margin-top:14px;';
      closeBtn.textContent = 'Закрыть предпросмотр';
      closeBtn.onclick = onClose;
      screen.appendChild(closeBtn);
    }, isBack);
  }

  // --- Переключатель темы: тот же принцип, что у ученика ---
  (function initThemeToggle() {
    const btn = document.getElementById('themeToggle');
    const sunIcon = '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="2"/><path d="M12 2.5V5M12 19V21.5M4.2 4.2L6 6M18 18L19.8 19.8M2.5 12H5M19 12H21.5M4.2 19.8L6 18M18 6L19.8 4.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
    const moonIcon = '<svg viewBox="0 0 24 24" fill="none"><path d="M20 14.5C18.7 15.6 17 16.2 15.2 16.2C10.9 16.2 7.5 12.7 7.5 8.5C7.5 6.7 8.1 5 9.2 3.7C5.3 4.6 2.5 8 2.5 12.1C2.5 17 6.5 21 11.4 21C15.6 21 19 18.2 19.9 14.3C19.9 14.4 19.9 14.4 20 14.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';
    function isDark() {
      const saved = localStorage.getItem('miniapp-theme');
      if (saved === 'dark') return true;
      if (saved === 'light') return false;
      return window.matchMedia('(prefers-color-scheme: dark)').matches;
    }
    function applyIcon() { btn.innerHTML = isDark() ? sunIcon : moonIcon; }
    btn.onclick = () => {
      const next = isDark() ? 'light' : 'dark';
      localStorage.setItem('miniapp-theme', next);
      document.documentElement.setAttribute('data-theme', next);
      applyIcon();
    };
    const saved = localStorage.getItem('miniapp-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
    applyIcon();
  })();

  render(false);
</script>
