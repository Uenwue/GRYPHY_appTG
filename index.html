        toggle.style.cssText = `width:26px;height:26px;border-radius:${isMulti ? '7px' : '50%'};border:2px solid ${isCorrect ? 'var(--green)' : 'var(--border)'};background:${isCorrect ? 'var(--green)' : 'var(--bg)'};color:white;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;`;
        toggle.innerHTML = isCorrect ? '<svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M4 10l4 4 8-8" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '';
        toggle.dataset.correct = isCorrect ? '1' : '0';
        toggle.onclick = () => {
          const nowCorrect = toggle.dataset.correct !== '1';
          if (nowCorrect && !isMulti) {
            // одиночный выбор — снимаем отметку со всех остальных
            optionsBox.querySelectorAll('button[data-correct]').forEach((b) => {
              b.dataset.correct = '0';
              b.style.background = 'var(--bg)';
              b.style.borderColor = 'var(--border)';
              b.innerHTML = '';
            });
          }
          toggle.dataset.correct = nowCorrect ? '1' : '0';
          toggle.style.background = nowCorrect ? 'var(--green)' : 'var(--bg)';
          toggle.style.borderColor = nowCorrect ? 'var(--green)' : 'var(--border)';
          toggle.innerHTML = nowCorrect ? '<svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M4 10l4 4 8-8" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '';
        };
        row.appendChild(toggle);
        const input = document.createElement('input');
        input.className = 'field-input';
        input.value = text;
        input.style.flex = '1';
        row.appendChild(input);
        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.style.cssText = 'background:none;border:none;color:var(--red-dark);font-size:18px;cursor:pointer;padding:0 4px;flex-shrink:0;';
        delBtn.textContent = '✕';
        delBtn.onclick = () => row.remove();
        row.appendChild(delBtn);
        optionsBox.appendChild(row);
      }

      (full.options || []).forEach((opt) => addOptionRow(opt, correctSet.has(opt)));
      overlay.querySelector('#fixAddOption').onclick = () => addOptionRow('', false);
    } else {
      aInput = overlay.querySelector('#fixA');
      aInput.value = full.answer || '';
    }

    function closeOverlay() { overlay.remove(); }
    overlay.querySelector('#fixCancel').onclick = closeOverlay;
    saveBtn.onclick = async () => {
      const question = qInput.value.trim();
      let answer, options;
      if (isChoice) {
        const rows = [...optionsBox.querySelectorAll('div')];
        const texts = rows.map((r) => r.querySelector('input').value.trim()).filter(Boolean);
        const corrects = rows.filter((r) => r.querySelector('input').value.trim() && r.querySelector('button[data-correct]').dataset.correct === '1')
          .map((r) => r.querySelector('input').value.trim());
        if (texts.length < 2) {
          errBox.textContent = 'Нужно хотя бы два варианта ответа.';
          errBox.style.display = 'block';
          return;
        }
        if (!corrects.length) {
          errBox.textContent = 'Отметьте хотя бы один правильный вариант.';
          errBox.style.display = 'block';
          return;
        }
        options = texts;
        answer = full.type === 'multi' ? corrects : corrects[0];
      } else {
        answer = aInput.value.trim();
      }
      if (!question || (isChoice ? false : !answer)) {
        errBox.textContent = 'Заполните вопрос и ответ.';
        errBox.style.display = 'block';
        return;
      }
      saveBtn.disabled = true;
      saveBtn.textContent = 'Сохраняю…';
      try {
        const path = kind === 'task' ? `/api/teacher/tasks/${item.id}` : `/api/teacher/testquestions/${item.id}`;
        const payload = { question, answer, explanation: eInput.value.trim() };
        if (isChoice) payload.options = options;
        await apiSend('PATCH', path, payload);
        closeOverlay();
        const okMsg = 'Исправлено.';
        if (tg?.showAlert) tg.showAlert(okMsg); else alert(okMsg);
        if (onSaved) onSaved();
      } catch (err) {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Сохранить';
        errBox.textContent = 'Не получилось сохранить: ' + err.message;
        errBox.style.display = 'block';
      }
    };
  }

  function buildReportErrorButton(context) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'text-align:center;margin-top:10px;';
    const btn = document.createElement('button');
    btn.style.cssText = 'background:none;border:none;color:var(--text-soft);font-size:12px;font-weight:700;cursor:pointer;padding:6px;';
    btn.textContent = '\uD83D\uDC1E Сообщить об ошибке';
    btn.onclick = () => promptReportError(context);
    wrap.appendChild(btn);
    return wrap;
  }

  function promptReportError(context) {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px;';
    overlay.innerHTML = '<div style="background:var(--bg);border-radius:16px;padding:18px;max-width:360px;width:100%;max-height:90vh;overflow-y:auto;">' +
      '<div class="field-label">' + (context.task_id || context.test_question_id ? 'Что не так в этом задании?' : 'Расскажите, что не так') + '</div>' +
      '<textarea class="field-input" id="repMsg" rows="4" style="resize:vertical;margin-bottom:10px;" placeholder="Опишите ошибку своими словами…"></textarea>' +
      '<label id="repPhotoLabel" style="display:flex;align-items:center;gap:8px;padding:10px 12px;border:2px dashed var(--border);border-radius:12px;cursor:pointer;margin-bottom:10px;font-size:13px;font-weight:700;color:var(--text-soft);">' +
      '📎 Приложить фото (необязательно)' +
      '<input type="file" accept="image/*" id="repPhoto" style="display:none;">' +
      '</label>' +
      '<div id="repPhotoPreviewWrap" style="display:none;margin-bottom:10px;position:relative;">' +
      '<img id="repPhotoPreview" style="max-width:100%;border-radius:12px;display:block;">' +
      '<button id="repPhotoRemove" type="button" style="position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,0.6);color:white;border:none;font-size:14px;cursor:pointer;">✕</button>' +
      '</div>' +
      '<div id="repErr" style="color:var(--red-dark);font-size:12.5px;font-weight:700;margin-bottom:8px;display:none;"></div>' +
      '<div style="display:flex;gap:8px;">' +
      '<button class="back-btn" id="repCancel" style="flex:1;">Отмена</button>' +
      '<button class="submit-btn" id="repSend" style="flex:1;margin-top:0;">Отправить</button>' +
      '</div></div>';
    document.body.appendChild(overlay);
    const msgInput = overlay.querySelector('#repMsg');
    const errBox = overlay.querySelector('#repErr');
    const sendBtn = overlay.querySelector('#repSend');
    const photoInput = overlay.querySelector('#repPhoto');
    const previewWrap = overlay.querySelector('#repPhotoPreviewWrap');
    const previewImg = overlay.querySelector('#repPhotoPreview');
    const photoLabel = overlay.querySelector('#repPhotoLabel');
    let selectedPhoto = null;
    msgInput.focus();

    photoInput.onchange = () => {
      const file = photoInput.files[0];
      if (!file) return;
      selectedPhoto = file;
      previewImg.src = URL.createObjectURL(file);
      previewWrap.style.display = 'block';
      photoLabel.style.display = 'none';
    };
    overlay.querySelector('#repPhotoRemove').onclick = () => {
      selectedPhoto = null;
      photoInput.value = '';
      previewWrap.style.display = 'none';
      photoLabel.style.display = 'flex';
    };

    function closeOverlay() { overlay.remove(); }
    overlay.querySelector('#repCancel').onclick = closeOverlay;
    sendBtn.onclick = async () => {
      const message = msgInput.value.trim();
      if (!message) {
        errBox.textContent = 'Опишите проблему хотя бы в двух словах.';
        errBox.style.display = 'block';
        return;
      }
      sendBtn.disabled = true;
      errBox.style.display = 'none';
      try {
        let photo_file_id = null;
        if (selectedPhoto) {
          sendBtn.textContent = 'Загружаю фото…';
          const formData = new FormData();
          formData.append('image', selectedPhoto);
          const uploadRes = await fetch(API_BASE_URL + '/api/upload-report-image', {
            method: 'POST',
            headers: { 'X-Telegram-Init-Data': tg?.initData || '' },
            body: formData,
          });
          if (!uploadRes.ok) throw new Error('Не получилось загрузить фото');
          const uploadData = await uploadRes.json();
          photo_file_id = uploadData.file_id;
        }
        sendBtn.textContent = 'Отправляю…';
        await apiPost('/api/report-error', { ...context, message, photo_file_id });
        closeOverlay();
        const okMsg = 'Спасибо! Мы получили сообщение.';
        if (tg?.showAlert) tg.showAlert(okMsg); else alert(okMsg);
      } catch (err) {
        sendBtn.disabled = false;
        sendBtn.textContent = 'Отправить';
        errBox.textContent = 'Не получилось отправить: ' + err.message;
        errBox.style.display = 'block';
      }
    };
  }

  let taskFeedbackMode = 'immediate';

  async function submitAnswer(taskId, answer, cardEl, task, optionEls) {
    try {
      const result = await apiPost(`/api/tasks/${taskId}/answer`, { answer });

      const taskRef = currentTasks.find(t => t.id === taskId);
      if (taskRef) { taskRef.answered = true; taskRef.is_correct = result.correct; taskRef.given_answer = answer; taskRef.correct_answer_final = result.correct_answer; }

      // Режим "с промежутком" — ответ сохраняется, но верно/неверно не
      // показываем сразу, сразу идём к следующему заданию (итог — только
      // на чек-поинте каждые 20 или в самом конце).
      if (taskFeedbackMode === 'deferred') {
        const remaining = currentTasks.filter(t => !t.answered).length;
        const answeredSoFar = currentTasks.filter(t => t.answered).length;
        if (remaining > 0 && answeredSoFar > 0 && answeredSoFar % 20 === 0) {
          renderCheckpoint();
        } else {
          renderTaskScreen(false);
        }
        return;
      }

      // Для вариантов с кнопками — красим каждый вариант по отдельности:
      // выбрал и верно → зелёным; выбрал и неверно → красным;
      // не выбрал, но это был верный вариант → зелёный контур ("пропущено");
      // не выбрал и он неверный → просто гаснет.
      // Правильный ответ берём из ОТВЕТА СЕРВЕРА (result.correct_answer) —
      // до ответа ученику он не отдаётся вообще, поэтому раскрашивать по
      // "заранее известному" answer нельзя, его там никогда не было.
      if (optionEls) {
        const selectedSet = new Set(Array.isArray(answer) ? answer : [answer]);
        const correctAnswerList = Array.isArray(result.correct_answer) ? result.correct_answer : [result.correct_answer];
        const correctSet = new Set(correctAnswerList);
        optionEls.forEach((btn) => {
          const opt = btn.querySelector('.option-text').textContent;
          const isSelected = selectedSet.has(opt);
          const isCorrectOpt = correctSet.has(opt);
          btn.classList.remove('selectable', 'selected');
          btn.onclick = null;
          if (isSelected && isCorrectOpt) {
            btn.classList.add('correct-selected');
          } else if (isSelected && !isCorrectOpt) {
            btn.classList.add('incorrect-selected');
          } else if (!isSelected && isCorrectOpt) {
            btn.classList.add('correct-missed');
            const tag = document.createElement('span');
            tag.className = 'option-tag';
            tag.textContent = 'пропущено';
            btn.appendChild(tag);
          } else {
            btn.classList.add('neutral-final');
          }
        });
      }

      const feedback = document.createElement('div');
      feedback.className = 'feedback ' + (result.correct ? 'ok' : 'bad');

      const title = document.createElement('p');
      title.className = 'feedback-title';
      title.textContent = result.correct ? '✅ Верно!' : '❌ Неверно';
      feedback.appendChild(title);

      if (!result.correct && !optionEls) {
        const body = document.createElement('p');
        body.className = 'feedback-body';
        body.innerHTML = `Правильный ответ: ${escapeHtml(result.correct_answer)}`;
        feedback.appendChild(body);
      }

      if (result.explanation) {
        const explain = document.createElement('p');
        explain.className = 'feedback-explain';
        explain.innerHTML = renderMarkdownText(result.explanation);
        feedback.appendChild(explain);
      }

      // Кнопки "Пропустить"/"Проверить" (и поле ввода, если оно было) больше
      // не нужны — убираем их совсем, а не просто гасим, чтобы объяснение
      // оказалось на их месте, а под ним — уже одна кнопка "Далее".
      cardEl.querySelectorAll('.skip-btn, .submit-btn, .text-input').forEach(el => el.remove());

      cardEl.appendChild(feedback);

      const nextBtn = document.createElement('button');
      nextBtn.className = 'next-btn';
      const remaining = currentTasks.filter(t => !t.answered).length;
      const answeredSoFar = currentTasks.filter(t => t.answered).length;
      if (remaining > 0 && answeredSoFar > 0 && answeredSoFar % 20 === 0) {
        nextBtn.textContent = 'Посмотреть промежуточный итог';
        nextBtn.onclick = () => renderCheckpoint();
      } else {
        nextBtn.textContent = remaining > 0 ? 'Далее →' : 'Показать итог';
        nextBtn.onclick = () => renderTaskScreen(false);
      }
      cardEl.appendChild(nextBtn);
    } catch (err) {
      showState('Не получилось отправить ответ. ' + err.message, true, false);
    }
  }

  // Промежуточный итог — показывается после каждых 20 отвеченных заданий,
  // чтобы не листать длинный раздел вслепую до самого конца.
  function renderCheckpoint() {
    swapScreen((screen) => {
      const answered = currentTasks.filter(t => t.answered);
      const correct = answered.filter(t => t.is_correct).length;
      const wrong = answered.length - correct;
      const remaining = currentTasks.length - answered.length;

      const card = document.createElement('div');
      card.className = 'result-card';
      card.innerHTML = `
        <div class="result-label">Промежуточный итог</div>
        <div class="result-score">${correct} / ${answered.length}</div>
        <div class="result-breakdown">
          <div class="result-stat ok"><div class="num">${correct}</div><div class="lbl">Верно</div></div>
          <div class="result-stat bad"><div class="num">${wrong}</div><div class="lbl">Неверно</div></div>
        </div>
      `;
      const continueBtn = document.createElement('button');
      continueBtn.className = 'submit-btn';
      continueBtn.style.marginTop = '20px';
      continueBtn.textContent = `Продолжить (осталось ${remaining})`;
      continueBtn.onclick = () => renderTaskScreen(false);
      card.appendChild(continueBtn);

      const currentScope = stack[stack.length - 1];
      if (currentScope?.scope && currentScope.scopeId) {
        const reviewBtn = document.createElement('button');
        reviewBtn.className = 'skip-btn';
        reviewBtn.style.marginTop = '10px';
        reviewBtn.textContent = '🔍 Пересмотреть свои ответы';
        reviewBtn.onclick = () => {
          stack.push({
            level: currentScope.scope === 'section' ? 'section_review' : 'topic_review',
            topicId: currentScope.scopeId, sectionId: currentScope.scopeId, title: 'Разбор ответов',
          });
          renderCrumbs();
          render(false);
        };
        card.appendChild(reviewBtn);
      }

      screen.appendChild(card);
    }, false);
  }

  async function render(isBack) {
    renderCrumbs();
    const current = stack[stack.length - 1];
    showLoading('Загружаем', isBack);

    try {
      if (current.level === 'subjects') {
        const subjects = await apiGet('/api/subjects');
        renderList(subjects.map(s => ({ id: s.id, title: s.title })),
          (item) => { stack.push({ level: 'subject_home', subjectId: item.id, title: item.title }); render(false); },
          'subjects', isBack);
      } else if (current.level === 'subject_home') {
        renderSubjectHome(current.subjectId, isBack);
      } else if (current.level === 'sections') {
        const kind = current.purpose === 'homework' ? 'homework' : 'trainer';
        const sections = await apiGet(`/api/subjects/${current.subjectId}/sections?kind=${kind}`);
        const purpose = current.purpose;
        renderList(sections.map(s => ({ id: s.id, title: s.title, is_locked: s.is_locked, lock_message: s.lock_message, sub: (purpose === 'tasks' || purpose === 'homework') ? s.sub : undefined })),
          (item) => {
            if (purpose === 'homework') {
              stack.push({ level: 'homework_list', sectionId: item.id, title: item.title });
            } else {
              stack.push({ level: 'topics', sectionId: item.id, purpose, title: item.title });
            }
            render(false);
          },
          'sections', isBack);
      } else if (current.level === 'topics') {
        const topics = await apiGet(`/api/sections/${current.sectionId}/topics`);
        const purpose = current.purpose;
        const listScreen = renderList(topics.map((t, i) => ({
            id: t.id, title: t.title, is_locked: t.is_locked, lock_message: t.lock_message,
            eyebrow: (purpose === 'tasks' || purpose === 'homework') ? (purpose === 'homework' ? 'Урок ' : 'Тема ') + (i + 1) : undefined,
            task_count: (purpose === 'tasks' || purpose === 'homework') ? t.task_count : undefined,
            correct_count: (purpose === 'tasks' || purpose === 'homework') ? t.correct_count : undefined,
          })),
          async (item) => {
            if (purpose === 'rules') {
              stack.push({ level: 'rules', topicId: item.id, title: item.title });
              renderCrumbs();
              showLoading('Загружаем правила', false);
              try {
                const data = await apiGet(`/api/topics/${item.id}/rules`);
                renderRulesWithVideo(data, item.id, item.title);
              } catch (err) {
                showState('Не получилось загрузить правила.', true, true);
              }
            } else {
              stack.push({ level: 'order_choice', scope: 'topic', scopeId: item.id, title: item.title });
              renderCrumbs();
              render(false);
            }
          },
          'topics', isBack);
        if (purpose === 'tasks' && topics.some(t => !t.is_locked && t.task_count > 0) && listScreen) {
          const wholeBtn = document.createElement('button');
          wholeBtn.className = 'add-row-btn';
          wholeBtn.style.cssText = 'width:100%;margin-bottom:14px;padding:16px;font-size:15.5px;color:var(--blue-dark);';
          wholeBtn.textContent = '🎯 Решить весь раздел целиком';
          wholeBtn.onclick = () => {
            stack.push({ level: 'order_choice', scope: 'section', scopeId: current.sectionId, title: current.title });
            renderCrumbs();
            render(false);
          };
          listScreen.insertBefore(wholeBtn, listScreen.firstChild);
        }
      } else if (current.level === 'order_choice') {
        renderOrderChoice(current.scope, current.scopeId, current.title, isBack);
      } else if (current.level === 'homework_list') {
        renderHomeworkList(current.sectionId, isBack);
      } else if (current.level === 'tasks') {
        renderTaskScreen(isBack);
      } else if (current.level === 'rules') {
        const data = await apiGet(`/api/topics/${current.topicId}/rules`);
        renderRulesWithVideo(data, current.topicId, current.title, isBack);
      } else if (current.level === 'tests') {
        const tests = await apiGet(`/api/subjects/${current.subjectId}/tests`);
        renderList(tests.map(t => ({
            id: t.id, title: t.title,
            time_limit_minutes: t.time_limit_minutes, question_count: t.question_count,
            sub: t.question_count + ' вопросов' + (t.time_limit_minutes ? ` · ⏱ ${t.time_limit_minutes} мин` : ''),
          })),
          (item) => {
            stack.push({ level: 'test_ready', testId: item.id, title: item.title, timeLimit: item.time_limit_minutes, questionCount: item.question_count });
            renderCrumbs();
            render(false);
          },
          'tests', isBack);
      } else if (current.level === 'test_ready') {
        renderTestReadyScreen(current.testId, current.title, current.timeLimit, current.questionCount, isBack);
      } else if (current.level === 'test_taking') {
        renderTestQuestion(isBack);
      } else if (current.level === 'test_results') {
        renderTestResults(isBack);
      } else if (current.level === 'test_review') {
        renderTestReview(current.attemptId, current.questions, isBack);
      } else if (current.level === 'topic_review') {
        renderTopicReview(current.topicId, isBack);
      } else if (current.level === 'section_review') {
        renderTopicReview(current.sectionId, isBack, true);
      } else if (current.level === 'rule_view') {
        renderRuleView(current.rule, isBack);
      }
    } catch (err) {
      showState('Не получилось загрузить данные.', true, true, isBack);
    }
  }

  function openRule(rule) {
    stack.push({ level: 'rule_view', rule, title: rule.title });
    renderCrumbs();
    renderRuleView(rule, false);
  }

  function extractYoutubeId(url) {
    if (!url) return null;
    const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{6,})/);
    return m ? m[1] : null;
  }

  function renderRulesWithVideo(data, topicId, topicTitle, isBack) {
    const rules = data.rules || [];
    const screen = renderList(rules.map(r => ({ id: r.id, title: r.title })),
      (r) => { openRule(rules.find(x => x.id === r.id)); },
      'rules', isBack);

    if (data.video_url) {
      const videoId = extractYoutubeId(data.video_url);
      const videoWrap = document.createElement('div');
      videoWrap.style.cssText = 'position:relative;width:calc(100% + 32px);margin-left:-16px;margin-right:-16px;padding-top:56.25%;overflow:hidden;margin-bottom:16px;background:#000;';
      if (videoId) {
        videoWrap.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${videoId}" style="position:absolute;inset:0;width:100%;height:100%;border:none;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
      } else {
        videoWrap.style.padding = '20px';
        videoWrap.style.color = 'white';
        videoWrap.textContent = 'Не получилось распознать ссылку на видео.';
      }
      screen.insertBefore(videoWrap, screen.firstChild);
    }

    const startBtn = document.createElement('button');
    startBtn.className = 'add-row-btn';
    startBtn.style.cssText = 'width:100%;margin-top:12px;padding:16px;font-size:15.5px;color:var(--blue-dark);';
    startBtn.textContent = '🎯 Приступить к заданиям';
    startBtn.onclick = () => {
      stack.push({ level: 'order_choice', scope: 'topic', scopeId: topicId, title: topicTitle || '' });
      renderCrumbs();
      render(false);
    };
    screen.appendChild(startBtn);
  }

  function renderRuleView(rule, isBack) {
    swapScreen((screen) => {
      const card = document.createElement('div');
      card.className = 'task-card';
      card.innerHTML = `
        <p class="task-question">${rule.heading || rule.title}</p>
        <p class="task-description" style="margin-bottom:0">${rule.description || ''}</p>
      `;
      screen.appendChild(card);
    }, isBack);
  }

  // --- Экран предмета: выбор "Разделы" / "Правила" / "Тесты" ---
  function renderSubjectHome(subjectId, isBack) {
    swapScreen(async (screen) => {
      const list = document.createElement('div');
      list.className = 'list';
      screen.appendChild(list);

      let blocks = { tasks_hidden: false, homework_hidden: false, rules_hidden: false, tests_hidden: false, labels: {} };
      try {
        blocks = await apiGet(`/api/subjects/${subjectId}/blocks`);
      } catch (err) { /* если не получилось — просто показываем всё, не критично */ }
      const labels = blocks.labels || {};

      const items = [
        { key: 'tasks', title: labels.tasks?.title || 'Задания', sub: labels.tasks?.desc || 'Тренируйтесь по темам и разделам', hidden: blocks.tasks_hidden, emoji: '📂', color: '#A8D8F5' },
        { key: 'rules', title: labels.rules?.title || 'Правила', sub: labels.rules?.desc || 'Справочник по темам курса', hidden: blocks.rules_hidden, emoji: '📖', color: '#A8E6D4' },
        { key: 'tests', title: labels.tests?.title || 'Тесты', sub: labels.tests?.desc || 'Проверьте себя в формате экзамена', hidden: blocks.tests_hidden, emoji: '🧪', color: '#FFDB70' },
      ].filter(item => !item.hidden);
      items.forEach((item, i) => {
        const card = document.createElement('button');
        card.className = 'item-card';
        card.style.animationDelay = (i * 0.05) + 's';
        const iconSq = document.createElement('div');
        iconSq.className = 'item-icon-square';
        iconSq.style.background = item.color;
        iconSq.style.fontSize = '22px';
        iconSq.textContent = item.emoji;
        card.appendChild(iconSq);
        const left = document.createElement('div');
        left.style.flex = '1';
        left.style.minWidth = '0';
        const t = document.createElement('div');
        t.className = 'item-title';
        t.textContent = item.title;
        left.appendChild(t);
        const s = document.createElement('div');
        s.className = 'item-sub';
        s.textContent = item.sub;
        left.appendChild(s);
        card.appendChild(left);
        const arrow = document.createElement('span');
        arrow.className = 'item-arrow-btn';
        arrow.innerHTML = '<svg viewBox="0 0 20 20" fill="none"><path d="M8 5L13 10L8 15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        card.appendChild(arrow);
        card.onclick = () => {
          if (item.key === 'tests') { stack.push({ level: 'tests', subjectId, title: 'Тесты' }); render(false); return; }
          stack.push({ level: 'sections', subjectId, purpose: item.key, title: 'Разделы' });
          render(false);
        };
        list.appendChild(card);
      });
    }, isBack);
  }

  // --- Прохождение теста: без подсказок по ходу, итог — в конце ---
  let currentTestQuestions = [];
  let currentTestIndex = 0;
  let currentAttemptId = null;
  let currentTestFinalSummary = null;
  let testDeadline = null;
  let testTimerInterval = null;
  let skippedTestQuestions = [];
  let isSecondPassOfSkipped = false;

  function stopTestTimer() {
    if (testTimerInterval) { clearInterval(testTimerInterval); testTimerInterval = null; }
  }

  async function startTest(testId, title) {
    stack.push({ level: 'test_taking', testId, title });
    renderCrumbs();
    showLoading('Загружаем тест', false);
    try {
      const res = await apiPost(`/api/tests/${testId}/start`, {});
      currentAttemptId = res.attempt_id;
      currentTestQuestions = res.questions;
      currentTestIndex = 0;
      skippedTestQuestions = [];
      isSecondPassOfSkipped = false;
      stopTestTimer();
      testDeadline = res.time_limit_minutes ? (Date.now() + res.time_limit_minutes * 60000) : null;
      renderTestQuestion(false);
    } catch (err) {
      showState('Не получилось загрузить тест. ' + err.message, true, true);
    }
  }

  function renderTestReadyScreen(testId, title, timeLimit, questionCount, isBack) {
    swapScreen((screen) => {
      const card = document.createElement('div');
      card.className = 'result-card';
      card.style.textAlign = 'center';

      const icon = document.createElement('div');
      icon.style.cssText = 'font-size:44px;margin-bottom:10px;';
      icon.textContent = '🧪';
      card.appendChild(icon);

      const titleEl = document.createElement('div');
      titleEl.style.cssText = 'font-family:\'Jost\',sans-serif;font-weight:700;font-size:19px;margin-bottom:10px;';
      titleEl.textContent = title;
      card.appendChild(titleEl);

      const infoEl = document.createElement('div');
      infoEl.className = 'field-hint';
      infoEl.style.cssText = 'font-size:14px;margin-bottom:6px;';
      infoEl.textContent = 'Вопросов: ' + questionCount;
      card.appendChild(infoEl);

      if (timeLimit) {
        const timeEl = document.createElement('div');
        timeEl.className = 'field-hint';
        timeEl.style.cssText = 'font-size:14px;font-weight:700;color:var(--red-dark);margin-bottom:16px;';
        timeEl.textContent = '⏱ На тест даётся ' + timeLimit + ' мин.';
        card.appendChild(timeEl);
      } else {
        const timeEl = document.createElement('div');
        timeEl.className = 'field-hint';
        timeEl.style.cssText = 'margin-bottom:16px;';
        timeEl.textContent = 'Без ограничения по времени.';
        card.appendChild(timeEl);
      }

      const readyBtn = document.createElement('button');
      readyBtn.className = 'submit-btn';
      readyBtn.textContent = 'Начать тест';
      readyBtn.onclick = () => {
        stack.pop();
        startTest(testId, title);
      };
      card.appendChild(readyBtn);

      screen.appendChild(card);
    }, isBack);
  }

  function renderTestQuestion(isBack) {
    const screen = swapScreen(() => {}, isBack);

    if (currentTestIndex >= currentTestQuestions.length) {
      if (skippedTestQuestions.length > 0) {
        // Пропущенные вопросы нельзя оставить без ответа — возвращаемся к
        // ним отдельным кругом, и на этот раз пропустить уже нельзя.
        currentTestQuestions = skippedTestQuestions;
        skippedTestQuestions = [];
        currentTestIndex = 0;
        isSecondPassOfSkipped = true;
        renderTestQuestion(false);
        return;
      }
      stopTestTimer();
      finishCurrentTest();
      return;
    }

    const q = currentTestQuestions[currentTestIndex];

    const headerRow = document.createElement('div');
    headerRow.className = 'task-header-row';
    const numLabel = document.createElement('span');
    numLabel.className = 'progress-num';
    numLabel.textContent = (isSecondPassOfSkipped ? 'Пропущенный вопрос ' : 'Вопрос ') + (currentTestIndex + 1) + ' из ' + currentTestQuestions.length;
    headerRow.appendChild(numLabel);
    const track = document.createElement('div');
    track.className = 'progress-bar-track';
    const fill = document.createElement('div');
    fill.className = 'progress-bar-fill';
    fill.style.width = Math.round((currentTestIndex / currentTestQuestions.length) * 100) + '%';
    track.appendChild(fill);
    headerRow.appendChild(track);
    screen.appendChild(headerRow);

    if (testDeadline) {
      const timerEl = document.createElement('div');
      timerEl.id = 'testTimer';
      timerEl.style.cssText = 'text-align:center;font-family:\'Jost\',sans-serif;font-weight:700;font-size:15px;margin-bottom:12px;color:var(--text-soft);';
      screen.appendChild(timerEl);

      function tick() {
        const msLeft = testDeadline - Date.now();
        if (msLeft <= 0) {
          timerEl.textContent = '⏱ 00:00:00';
          stopTestTimer();
          if (tg?.showAlert) tg.showAlert('Время вышло — тест завершается автоматически.');
          finishCurrentTest();
          return;
        }
        const totalSec = Math.floor(msLeft / 1000);
        const hh = Math.floor(totalSec / 3600);
        const mm = Math.floor((totalSec % 3600) / 60);
        const ss = totalSec % 60;
        timerEl.textContent = '⏱ ' + String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
        if (msLeft < 60000) timerEl.style.color = 'var(--red-dark)';
      }
      stopTestTimer();
      tick();
      testTimerInterval = setInterval(tick, 1000);
    }

    const card = document.createElement('div');
    card.className = 'task-card';

    if (q.label) {
      const label = document.createElement('span');
      label.className = 'question-label' + (q.label.startsWith('В') ? ' part-b' : '');
      label.textContent = q.label;
      card.appendChild(label);
    }

    const qEl = document.createElement('p');
    qEl.className = 'task-question';
    qEl.textContent = q.question;
    card.appendChild(qEl);

    if (q.description) {
      const d = document.createElement('p');
      d.className = 'task-description';
      d.textContent = q.description;
      card.appendChild(d);
    }

    if (q.image_file_id) {
      renderTaskImage(card, q.image_file_id);
    }

    if (q.table_data && q.table_data.length) {
      const table = document.createElement('table');
      table.style.cssText = 'width:100%;border-collapse:collapse;margin-bottom:16px;table-layout:fixed;';
      q.table_data.forEach(row => {
        const tr = document.createElement('tr');
        row.forEach(cell => {
          const td = document.createElement('td');
          td.style.cssText = 'border:1px solid var(--border);padding:8px 10px;font-size:13.5px;word-break:break-word;';
          td.textContent = cell;
          tr.appendChild(td);
        });
        table.appendChild(tr);
      });
      card.appendChild(table);
    }

    const answerArea = document.createElement('div');
    card.appendChild(answerArea);

    const advance = async (answer, skip) => {
      try {
        if (skip) {
          // Не отправляем "пропуск" на сервер — просто откладываем вопрос
          // на потом, отвечать всё равно придётся, до конца теста его не
          // обойти. Ответ уйдёт на сервер, когда до него дойдёт очередь.
          // Что уже успели выбрать/напечатать — сохраняем как черновик,
          // чтобы не потерять при повторном показе этого вопроса.
          q.draftAnswer = answer;
          skippedTestQuestions.push(q);
        } else {
          await apiPost(`/api/tests/attempts/${currentAttemptId}/answer`, { question_id: q.id, answer });
        }
        currentTestIndex++;
        renderTestQuestion(false);
      } catch (err) {
        showState('Не получилось сохранить ответ. ' + err.message, true, false);
      }
    };

    const isLastOverall = currentTestIndex === currentTestQuestions.length - 1 && skippedTestQuestions.length === 0;

    if ((q.type === 'buttons' || q.type === 'multi') && q.options && q.options.length) {
      const isMulti = q.type === 'multi';
      const draftSet = new Set(q.draftAnswer ? (Array.isArray(q.draftAnswer) ? q.draftAnswer : [q.draftAnswer]) : []);
      let selected = q.draftAnswer ? (Array.isArray(q.draftAnswer) ? [...q.draftAnswer] : [q.draftAnswer]) : [];
      const nextBtn = document.createElement('button');
      nextBtn.className = 'submit-btn';
      nextBtn.textContent = isLastOverall ? 'Завершить тест' : 'Далее';
      nextBtn.disabled = selected.length === 0;

      const optBtns = q.options.map((opt) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn' + (draftSet.has(opt) ? ' selected' : '');
        btn.innerHTML = '<span class="option-text"></span>';
        btn.querySelector('.option-text').innerHTML = renderMarkdownText(opt);
        btn.onclick = () => {
          if (isMulti) {
            const pos = selected.indexOf(opt);
            if (pos === -1) { selected.push(opt); btn.classList.add('selected'); }
            else { selected.splice(pos, 1); btn.classList.remove('selected'); }
          } else {
            selected = [opt];
            optBtns.forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
          }
          nextBtn.disabled = selected.length === 0;
        };
        answerArea.appendChild(btn);
        return btn;
      });

      if (!isSecondPassOfSkipped) {
        const skipBtn = document.createElement('button');
        skipBtn.className = 'skip-btn';
        skipBtn.textContent = 'Пропустить';
        skipBtn.onclick = () => advance(isMulti ? selected : (selected[0] || null), true);
        answerArea.appendChild(skipBtn);
      }

      nextBtn.onclick = () => { if (!selected.length) return; advance(isMulti ? selected : selected[0], false); };
      answerArea.appendChild(nextBtn);
    } else {
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'text-input';
      input.placeholder = 'Введите ответ…';
      if (q.draftAnswer) input.value = q.draftAnswer;
      answerArea.appendChild(input);

      const submitBtn = document.createElement('button');
      submitBtn.className = 'submit-btn';
      submitBtn.textContent = isLastOverall ? 'Завершить тест' : 'Далее';
      submitBtn.disabled = !input.value.trim();
      input.addEventListener('input', () => { submitBtn.disabled = !input.value.trim(); });
      submitBtn.onclick = () => { if (!input.value.trim()) return; advance(input.value.trim(), false); };

      if (!isSecondPassOfSkipped) {
        const skipBtn = document.createElement('button');
        skipBtn.className = 'skip-btn';
        skipBtn.textContent = 'Пропустить';
        skipBtn.onclick = () => advance(input.value.trim() || null, true);
        answerArea.appendChild(skipBtn);
      }
      answerArea.appendChild(submitBtn);

      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitBtn.click(); });
    }

    screen.appendChild(card);
    screen.appendChild(buildReportErrorButton({ test_question_id: q.id }));
    if (isTeacherViewing) {
      screen.appendChild(buildTeacherFixButton('testq', q, () => renderTestQuestion(false)));
    }
  }

  async function finishCurrentTest() {
    stopTestTimer();
    showLoading('Считаем результат', false);
    try {
      currentTestFinalSummary = await apiPost(`/api/tests/attempts/${currentAttemptId}/finish`, {});
      stack.push({ level: 'test_results', title: 'Результат' });
      renderCrumbs();
      renderTestResults(false);
    } catch (err) {
      showState('Не получилось посчитать результат. ' + err.message, true, true);
    }
  }

  function renderTestResults(isBack) {
    const screen = swapScreen(() => {}, isBack);
    const s = currentTestFinalSummary;

    const card = document.createElement('div');
    card.className = 'result-card';
    const scoreLine = s.actual_score !== null && s.actual_score !== undefined
      ? `<div class="result-score">${s.actual_score}</div><div class="field-hint" style="text-align:center;">тестовый балл</div>`
      : `<div class="result-score">${s.primary_score} / ${s.max_primary_score}</div><div class="field-hint" style="text-align:center;">первичный балл</div>`;
    card.innerHTML = `
      <div class="result-label">Результат</div>
      ${scoreLine}
      <div class="result-breakdown" style="margin-top:14px;">
        <div class="result-stat ok"><div class="num">${s.correct}</div><div class="lbl">Верно</div></div>
        ${s.partial ? `<div class="result-stat mid"><div class="num">${s.partial}</div><div class="lbl">Частично</div></div>` : ''}
        <div class="result-stat bad"><div class="num">${s.wrong}</div><div class="lbl">Неверно</div></div>
      </div>
      ${s.actual_score !== null && s.actual_score !== undefined ? `<div class="field-hint" style="text-align:center;margin-top:10px;font-weight:700;">Первичный балл: ${s.primary_score}/${s.max_primary_score}</div>` : ''}
      ${s.elapsed_str ? `<div class="field-hint" style="text-align:center;margin-top:6px;">⏱ Затрачено времени: ${s.elapsed_str}</div>` : ''}
    `;

    const reviewBtn = document.createElement('button');
    reviewBtn.className = 'skip-btn';
    reviewBtn.style.marginTop = '18px';
    reviewBtn.textContent = '🔍 Пересмотреть свои ответы';
    reviewBtn.onclick = () => { stack.push({ level: 'test_review', attemptId: currentAttemptId, questions: s.questions, title: 'Разбор ответов' }); renderCrumbs(); render(false); };
    card.appendChild(reviewBtn);

    const doneBtn = document.createElement('button');
    doneBtn.className = 'submit-btn';
    doneBtn.style.marginTop = '10px';
    doneBtn.textContent = 'Готово';
    doneBtn.onclick = () => { stack.pop(); stack.pop(); render(true); };
    card.appendChild(doneBtn);

    const retryBtn = document.createElement('button');
    retryBtn.className = 'skip-btn';
    retryBtn.style.marginTop = '10px';
    retryBtn.textContent = '🔄 Пройти заново';
    retryBtn.onclick = () => {
      const testId = stack[stack.length - 2]?.testId;
      const title = stack[stack.length - 2]?.title;
      stack.pop(); stack.pop();
      startTest(testId, title);
    };
    card.appendChild(retryBtn);

    screen.appendChild(card);
  }

  // --- Разбор своих ответов в тесте: список вопросов -> открыть любой,
  // увидеть свой ответ / правильный / объяснение (как просили) ---
  // --- Разбор своих ответов по обычным заданиям темы ---
  async function renderTopicReview(scopeId, isBack, isSection) {
    showLoading('Загружаем', isBack);
    try {
      const base = isSection ? `/api/sections/${scopeId}` : `/api/topics/${scopeId}`;
      const summary = await apiGet(`${base}/review`);
      const statusIcon = { correct: ' ✅', partial: ' 🟡', wrong: ' ❌' };
      renderList(
        summary.questions.map(([num, status]) => ({ id: num, title: 'Задание ' + num + (statusIcon[status] || ' ❌') })),
        async (item) => {
          showLoading('Загружаем', false);
          try {
            const detail = await apiGet(`${base}/review/${item.id}`);
            stack.push({ level: 'review_detail', title: 'Разбор ответа' });
            renderCrumbs();
            renderReviewDetail(detail, false);
          } catch (err) {
            showState('Не получилось загрузить. ' + err.message, true, true);
          }
        },
        'topics', isBack
      );
    } catch (err) {
      showState('Не получилось загрузить. ' + err.message, true, true, isBack);
    }
  }

  function renderTestReview(attemptId, questions, isBack) {
    renderList(
      questions.map(q => ({
        id: q.label,
        title: q.label + (q.correct ? ' ✅' : (q.earned > 0 ? ' 🟡' : ' ❌')),
        sub: q.earned + ' из ' + q.max + ' балл(ов)', part: q.label[0] === 'А' ? 'A' : 'B',
        position: parseInt(q.label.slice(1), 10),
      })),
      async (item) => {
        showLoading('Загружаем', false);
        try {
          const detail = await apiGet(`/api/tests/attempts/${attemptId}/question/${item.part}/${item.position}`);
          stack.push({ level: 'review_detail', title: 'Разбор ответа' });
          renderCrumbs();
          renderReviewDetail(detail, false);
        } catch (err) {
          showState('Не получилось загрузить. ' + err.message, true, true);
        }
      },
      'tests', isBack
    );
  }

  function renderReviewDetail(detail, isBack) {
    swapScreen((screen) => {
      const card = document.createElement('div');
      card.className = 'task-card';

      const q = document.createElement('p');
      q.className = 'task-question';
      q.innerHTML = renderMarkdownText(detail.question);
      card.appendChild(q);

      if (detail.description) {
        const d = document.createElement('p');
        d.className = 'task-description';
        d.innerHTML = renderMarkdownText(detail.description);
        card.appendChild(d);
      }

      if (detail.image_file_id) {
        renderTaskImage(card, detail.image_file_id);
      }

      if (detail.table_data && detail.table_data.length) {
        const table = document.createElement('table');
        table.style.cssText = 'width:100%;border-collapse:collapse;margin-bottom:16px;table-layout:fixed;';
        detail.table_data.forEach(row => {
          const tr = document.createElement('tr');
          row.forEach(cell => {
            const td = document.createElement('td');
            td.style.cssText = 'border:1px solid var(--border);padding:8px 10px;font-size:13.5px;word-break:break-word;';
            td.textContent = cell;
            tr.appendChild(td);
          });
          table.appendChild(tr);
        });
        card.appendChild(table);
      }

      // Если у задания были варианты (кнопки/несколько верных) — показываем
      // их так же, как на экране решения: кто что выбрал, что было верно.
      if ((detail.type === 'buttons' || detail.type === 'multi') && detail.options && detail.options.length) {
        const correctList = Array.isArray(detail.correct_answer) ? detail.correct_answer
          : (typeof detail.correct_answer === 'string' && detail.type === 'multi' ? detail.correct_answer.split(';') : [detail.correct_answer]);
        const givenList = Array.isArray(detail.given_answer) ? detail.given_answer
          : (typeof detail.given_answer === 'string' ? detail.given_answer.split(';') : []);
        const selectedSet = new Set(givenList.map(x => (x || '').trim()));
        const correctSet = new Set(correctList.map(x => (x || '').trim()));

        detail.options.forEach((opt, idx) => {
          const btn = document.createElement('div');
          btn.className = 'option-btn';
          btn.style.cursor = 'default';
          btn.innerHTML = '<span class="option-num"></span><span class="option-text"></span>';
          btn.querySelector('.option-num').textContent = idx + 1;
          btn.querySelector('.option-text').innerHTML = renderMarkdownText(opt);
          const isSelected = selectedSet.has(opt.trim());
          const isCorrectOpt = correctSet.has(opt.trim());
          if (isSelected && isCorrectOpt) {
            btn.classList.add('correct-selected');
          } else if (isSelected && !isCorrectOpt) {
            btn.classList.add('incorrect-selected');
          } else if (!isSelected && isCorrectOpt) {
            btn.classList.add('correct-missed');
            const tag = document.createElement('span');
            tag.className = 'option-tag';
            tag.textContent = 'пропущено';
            btn.appendChild(tag);
          } else {
            btn.classList.add('neutral-final');
          }
          card.appendChild(btn);
        });
      }

      const isPartialTest = detail.earned_score !== undefined && detail.earned_score > 0 && detail.earned_score < detail.max_score;
      const isPartialTask = detail.status === 'partial';
      const isPartial = isPartialTest || isPartialTask;
      const feedback = document.createElement('div');
      feedback.className = 'feedback ' + (isPartial ? 'mid' : (detail.is_correct ? 'ok' : 'bad'));
      const title = document.createElement('p');
      title.className = 'feedback-title';
      title.textContent = isPartialTest ? `🟡 Частично верно (${detail.earned_score} из ${detail.max_score})`
        : isPartialTask ? '🟡 Частично верно (была 1 ошибка в выборе)'
        : (detail.is_correct ? '✅ Верно' : '❌ Неверно');
      feedback.appendChild(title);
      if (detail.type === 'text' || !detail.options) {
        const body = document.createElement('p');
        body.className = 'feedback-body';
        body.innerHTML = 'Ваш ответ: ' + escapeHtml(detail.given_answer || '—') + (detail.is_correct ? '' : ('. Правильный: ' + escapeHtml(detail.correct_answer)));
        feedback.appendChild(body);
      }
      if (detail.explanation) {
        const explain = document.createElement('p');
        explain.className = 'feedback-explain';
        explain.innerHTML = renderMarkdownText(detail.explanation);
        feedback.appendChild(explain);
      }
      card.appendChild(feedback);

      screen.appendChild(card);
    }, isBack);
  }

  // --- Вкладка "Профиль": Предмет -> Задания/Тесты -> статистика (как в боте) ---
  let activeTab = 'study';
  let profileStack = [{ level: 'profile_subjects', title: '' }];

  async function getDefaultSubject() {
    const subjects = await apiGet('/api/subjects');
    if (!subjects.length) return null;
    const rus = subjects.find((s) => /русск/i.test(s.title));
    return rus || subjects[0];
  }

  function switchTab(tab) {
    if (activeTab === tab) return;
    activeTab = tab;
    document.getElementById('tabStudy').classList.toggle('active', tab === 'study');
    document.getElementById('tabChallenges').classList.toggle('active', tab === 'challenges');

      profileStack = [{ level: 'profile_subjects', title: '' }];
      renderProfileCrumbs();
      renderProfile(false);
    } else if (tab === 'challenges') {
      if (!trainerInitialized) {
        trainerInitialized = true;
        crumbsEl.innerHTML = '';
        crumbsEl.style.display = 'none';
        showLoading('Загружаем', false);
        getDefaultSubject().then((subject) => {
          if (!subject) {
            showState('Нет доступных предметов.', false, false);
            return;
          }
          trainerStack = [{ level: 'subject_home', subjectId: subject.id, title: subject.title }];
          stack = trainerStack;
          renderCrumbs();
          render(false);
        }).catch((err) => {
          showState('Не получилось загрузить. ' + err.message, true, true);
        });
      } else {
        stack = trainerStack;
        renderCrumbs();
        render(false);

      showLoading('Загружаем', false);

        renderProfileCrumbs();
        renderProfile(false);
      }).catch((err) => {
        showState('Не получилось загрузить. ' + err.message, true, true);
      });

  function buildCalendarGrid(year, month, eventDatesSet, selectedDate, onDayClick, onPrev, onNext) {
    const wrap = document.createElement('div');
    wrap.className = 'cal-wrap';

    const head = document.createElement('div');
    head.className = 'cal-head';
    const prevBtn = document.createElement('button');
    prevBtn.className = 'cal-nav-btn';
    prevBtn.innerHTML = '‹';
    prevBtn.onclick = onPrev;
    const title = document.createElement('div');
    title.className = 'cal-title';
    const monthNames = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
    title.textContent = monthNames[month] + ' ' + year;
    const nextBtn = document.createElement('button');
    nextBtn.className = 'cal-nav-btn';
    nextBtn.innerHTML = '›';
    nextBtn.onclick = onNext;
    head.appendChild(prevBtn);
    head.appendChild(title);
    head.appendChild(nextBtn);
    wrap.appendChild(head);

    const grid = document.createElement('div');
    grid.className = 'cal-grid';
    ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].forEach((d) => {
      const lbl = document.createElement('div');
      lbl.className = 'cal-daylabel';
      lbl.textContent = d;
      grid.appendChild(lbl);
    });

    const now = new Date();
    const todayStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    const firstDay = new Date(year, month, 1);
    let startOffset = firstDay.getDay() - 1;
    if (startOffset < 0) startOffset = 6;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const isColorMap = eventDatesSet instanceof Map;

    for (let i = 0; i < startOffset; i++) {
      const empty = document.createElement('div');
      empty.className = 'cal-day empty';
      grid.appendChild(empty);
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'cal-day';
      const hasEvent = eventDatesSet.has(dateStr);
      if (hasEvent) cell.classList.add('has-event');
      if (dateStr === todayStr) cell.classList.add('today');
      if (dateStr === selectedDate) cell.classList.add('selected');
      const numSpan = document.createElement('span');
      numSpan.className = 'cal-day-num';
      numSpan.textContent = d;
      cell.appendChild(numSpan);
      if (hasEvent) {
        const colors = isColorMap ? eventDatesSet.get(dateStr) : ['var(--yellow)'];
        const dotsWrap = document.createElement('span');
        dotsWrap.className = 'cal-day-dots';
        colors.slice(0, 3).forEach((color) => {
          const dot = document.createElement('span');
          dot.className = 'cal-day-dot';
          dot.style.background = color;
          dotsWrap.appendChild(dot);
        });
        cell.appendChild(dotsWrap);
      }
      cell.onclick = () => onDayClick(dateStr);
      grid.appendChild(cell);
    }
    wrap.appendChild(grid);
    return wrap;
  }
