<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Экзамен — мини-апп</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAF6EE;
    --paper-line: #DCD3BE;
    --ink: #232522;
    --ink-soft: #5B5C54;
    --red: #C1442D;
    --green: #3E6B4F;
    --card-shadow: 0 18px 40px -18px rgba(35, 37, 34, 0.35);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: 'PT Sans', system-ui, sans-serif;
  }

  body {
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: -1px -1px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 380px;
    background: #FFFDF8;
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    box-shadow: var(--card-shadow);
    padding: 40px 28px 32px;
    text-align: center;
    transform: rotate(-0.6deg);
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 28px; right: 28px;
    height: 1px;
    background: var(--paper-line);
  }

  .eyebrow {
    font-family: 'PT Sans', sans-serif;
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 18px;
  }

  h1 {
    font-family: 'PT Serif', serif;
    font-weight: 700;
    font-size: 26px;
    line-height: 1.25;
    margin: 0 0 6px;
  }

  .greeting-name {
    color: var(--red);
  }

  .subtitle {
    font-size: 15px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin: 0 0 28px;
  }

  .seal-wrap {
    width: 132px;
    height: 132px;
    margin: 0 auto 26px;
    position: relative;
  }

  .seal-svg {
    width: 100%;
    height: 100%;
    transform: rotate(-8deg);
  }

  .seal-circle, .seal-inner {
    fill: none;
    stroke: var(--green);
    stroke-width: 2.5;
    stroke-dasharray: 320;
    stroke-dashoffset: 320;
    animation: draw 1.1s ease-out forwards;
  }

  .seal-inner {
    stroke-dasharray: 240;
    stroke-dashoffset: 240;
    animation-delay: 0.15s;
  }

  .seal-check {
    fill: none;
    stroke: var(--red);
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 60;
    stroke-dashoffset: 60;
    animation: draw 0.5s ease-out forwards;
    animation-delay: 0.9s;
  }

  .seal-text {
    font-family: 'PT Serif', serif;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    fill: var(--ink-soft);
  }

  @keyframes draw {
    to { stroke-dashoffset: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .seal-circle, .seal-inner, .seal-check {
      animation: none;
      stroke-dashoffset: 0;
    }
  }

  .status-line {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 22px;
  }

  .status-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    margin-right: 6px;
    vertical-align: middle;
  }

  .next-btn {
    width: 100%;
    padding: 13px 18px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 3px;
    font-family: 'PT Sans', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.01em;
    cursor: pointer;
  }

  .next-btn:focus-visible {
    outline: 2px solid var(--red);
    outline-offset: 2px;
  }

  .next-btn:active {
    transform: translateY(1px);
  }

  .footnote {
    margin-top: 18px;
    font-size: 11.5px;
    color: var(--ink-soft);
    line-height: 1.5;
  }

  .footnote code {
    background: var(--paper);
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    padding: 1px 5px;
    font-size: 11px;
  }
</style>
</head>
<body>

  <main class="card">
    <p class="eyebrow">Подготовка к экзамену</p>

    <div class="seal-wrap" aria-hidden="true">
      <svg class="seal-svg" viewBox="0 0 132 132">
        <circle class="seal-circle" cx="66" cy="66" r="58"></circle>
        <circle class="seal-inner" cx="66" cy="66" r="48"></circle>
        <path class="seal-check" d="M44 68 L58 82 L90 46"></path>
        <text class="seal-text" x="66" y="118" text-anchor="middle">ПОДКЛЮЧЕНО</text>
      </svg>
    </div>

    <h1>Привет, <span class="greeting-name" id="userName">гость</span>!</h1>
    <p class="subtitle">Это первая страница мини-аппа — фундамент, на котором построим остальное: разделы, задания и тесты.</p>

    <p class="status-line"><span class="status-dot"></span><span id="statusText">Проверяем соединение с Telegram…</span></p>

    <button class="next-btn" id="pingBtn">Проверить связь с ботом</button>

    <p class="footnote" id="debugInfo">Открыто вне Telegram — часть данных недоступна.</p>
  </main>

<script>
  const tg = window.Telegram?.WebApp;
  const nameEl = document.getElementById('userName');
  const statusEl = document.getElementById('statusText');
  const debugEl = document.getElementById('debugInfo');
  const pingBtn = document.getElementById('pingBtn');

  if (tg) {
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;
    if (user?.first_name) {
      nameEl.textContent = user.first_name;
    }

    if (tg.initData) {
      statusEl.textContent = 'Мини-апп подключен и видит данные Telegram';
      debugEl.innerHTML = 'ID пользователя: <code>' + (user?.id ?? '—') + '</code>';
    } else {
      statusEl.textContent = 'Открыто через Telegram, но initData пуст';
    }

    // Подхватываем цвета темы Telegram (по желанию можно закомментировать,
    // чтобы всегда использовать собственную "бумажную" тему выше)
    // document.body.style.background = tg.themeParams.bg_color || '';
  } else {
    statusEl.textContent = 'Telegram WebApp SDK не найден';
  }

  pingBtn.addEventListener('click', () => {
    if (tg) {
      tg.HapticFeedback?.impactOccurred('light');
    }
    statusEl.textContent = 'Пока это просто кнопка-заглушка — бэкенд подключим на следующем шаге';
  });
</script>

</body>
</html>
