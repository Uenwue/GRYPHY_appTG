  :root {
    --bg: #FFFFFF;
    --bg-soft: #F7F7F7;
    --border: #E5E5E5;
    --text: #3C3C3C;
    --text-soft: #777777;
    --green: #58CC02;
    --green-dark: #58A700;
    --green-tint: #D7FFB8;
    --blue: #1CB0F6;
    --blue-dark: #1899D6;
    --blue-tint: #DDF4FF;
    --red: #FF4B4B;
    --red-dark: #EA2B2B;
    --red-tint: #FFDFE0;
    --yellow: #FFC800;
    --yellow-dark: #B8860B;
    --yellow-tint: #FFF1C2;
    --card-shadow: 0 2px 0 var(--border);
    --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    --nav-active: #539DF3;
    --nav-inactive: #484C52;
    --accent: #539DF3;
    --accent-dark: #2F7BD9;
  }

  /* Тёмная тема — включается автоматически по системной настройке... */
  @media (prefers-color-scheme: dark) {
    html:not([data-theme="light"]) {
      --bg: #1B2029;
      --bg-soft: #262D3A;
      --border: #3A4252;
      --text: #F1F3F6;
      --text-soft: #A6AFC0;
      --green-tint: rgba(88, 204, 2, 0.16);
      --blue-tint: rgba(28, 176, 246, 0.16);
      --red-tint: rgba(255, 75, 75, 0.16);
      --yellow-tint: rgba(255, 200, 0, 0.16);
      --nav-inactive: #676D75;
    }
  }
  /* ...или вручную через переключатель (сохраняется в localStorage) */
  html[data-theme="dark"] {
    --bg: #1B2029;
    --bg-soft: #262D3A;
    --border: #3A4252;
    --text: #F1F3F6;
    --text-soft: #A6AFC0;
    --green-tint: rgba(88, 204, 2, 0.16);
    --blue-tint: rgba(28, 176, 246, 0.16);
    --red-tint: rgba(255, 75, 75, 0.16);
    --yellow-tint: rgba(255, 200, 0, 0.16);
    --nav-inactive: #676D75;
  }

  .theme-toggle {
    margin-left: auto; flex-shrink: 0;
    width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--border); background: var(--bg);
    display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-soft);
    transition: transform 0.12s var(--bounce);
  }
  .theme-toggle:active { transform: scale(0.88); }
  .theme-toggle svg { width: 18px; height: 18px; }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg-soft); color: var(--text);
    font-family: 'Nunito', system-ui, sans-serif;
  }

  html, body {
    background: var(--bg);
  }
  body {
    padding: 20px 16px 40px;
  }

  @media (min-width: 1200px) {
    /* На широком экране (Telegram Desktop, браузер) узкая мобильная
       колонка выглядит потерянной и мелкой — масштабируем весь
       интерфейс целиком, оставляя саму компоновку (узкую центрированную
       колонку) нетронутой, это осознанный мобильный стиль, а не баг. */
    body { zoom: 1.25; }
  }

  @media (min-width: 1700px) {
    body { zoom: 1.5; }
  }

  .demo-flag {
    max-width: 420px; margin: 0 auto 14px;
    background: var(--yellow); border: none; border-radius: 12px;
    padding: 8px 12px; font-size: 12.5px; font-weight: 700; color: var(--yellow-dark); text-align: center;
  }

  .wrap { max-width: 420px; margin: 0 auto; }

  header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
    background: var(--bg);
  }
  .stamp-mini { width: 40px; height: 40px; flex-shrink: 0; }
  header h1 { flex: 1; font-family: 'Jost', sans-serif; font-size: 19px; font-weight: 700; margin: 0; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .header-icon-btn { position: relative; flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--bg-soft); color: var(--text-soft); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .header-icon-btn .header-icon-dot { position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--red-dark); }
  header .who { color: var(--green-dark); }

  .crumbs { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 14px; min-height: 36px; }

  .back-btn {

  .crumb-title {
    font-family: 'Jost', sans-serif; font-size: 16px; font-weight: 700; color: var(--text);
    white-space: normal; min-width: 0; line-height: 1.3; padding-top: 6px;

  .screen { animation: screen-in 0.32s var(--bounce) both; }

  @keyframes screen-in { from { opacity: 0; transform: translateX(18px) scale(0.98); } to { opacity: 1; transform: translateX(0) scale(1); } }
  @keyframes screen-in-back { from { opacity: 0; transform: translateX(-18px) scale(0.98); } to { opacity: 1; transform: translateX(0) scale(1); } }

  .list { display: flex; flex-direction: column; gap: 12px; }

  .item-card {

  .item-arrow-btn {
    width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--blue, #1CB0F6); color: white;
  }
  .item-arrow-btn svg { width: 16px; height: 16px; }
  .item-arrow-btn.done { background: var(--green, #58CC02); }
  .item-arrow-btn.locked { background: var(--border); color: var(--text-soft); }

  .row-card {
    background: var(--bg); border: 2px solid var(--border); border-radius: 14px;
    padding: 13px 14px; display: flex; align-items: flex-start; gap: 12px;
    margin-bottom: 8px; box-shadow: 0 2px 8px rgba(49, 44, 44, 0.05);
    opacity: 0; animation: card-in 0.32s var(--bounce) both;
  }
  .row-title { font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 700; }
  .row-sub { font-size: 12px; color: var(--text-soft); font-weight: 600; margin-top: 1px; }

  @keyframes card-in { from { opacity: 0; transform: translateY(10px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }

  .item-card:hover { background: var(--bg-soft2, var(--bg-soft)); }
  .item-card:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .item-card:active { transform: scale(0.985); }

  .level-icon-wrap {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .level-icon-wrap.subjects { background: var(--green-tint); }
  .level-icon-wrap.sections { background: var(--blue-tint); }
  .level-icon-wrap.topics { background: var(--yellow-tint); }
  .level-icon-wrap.tests { background: var(--yellow-tint); }
  .level-icon-wrap.rules { background: var(--green-tint); }
  .level-icon { width: 18px; height: 18px; }

  .item-eyebrow { font-size: 12px; font-weight: 800; color: var(--text-soft); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 2px; }
  .item-title { font-family: 'Jost', sans-serif; font-size: 18px; font-weight: 700; line-height: 1.3; }
  .item-sub { font-size: 13.5px; color: var(--text-soft); margin-top: 4px; font-weight: 600; }
  .item-arrow { color: var(--border); font-size: 20px; flex-shrink: 0; font-weight: 700; }
  .item-status {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .item-status.done { background: var(--green); color: white; }
  .item-status.locked { background: var(--border); color: var(--text-soft); }
  .item-status svg { width: 14px; height: 14px; }
  .badge {
    display: inline-block; background: var(--green-tint); border: none;
    border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 700; color: var(--green-dark); white-space: nowrap;
  }

  .state-msg { text-align: center; color: var(--text-soft); font-size: 15px; font-weight: 700; padding: 30px 10px; }
  .state-msg.error { color: var(--red); }
  .retry-btn {
    margin-top: 10px; background: var(--blue); border: none; border-bottom: 4px solid var(--blue-dark); color: white; border-radius: 14px;
    padding: 10px 20px; font-family: 'Jost', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.02em; transition: transform 0.12s var(--bounce);
  }
  .retry-btn:active { transform: translateY(3px); border-bottom-width: 1px; }

  .loading-row { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 30px 10px; color: var(--text-soft); font-size: 15px; font-weight: 700; }
  .pencil-dots span {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); margin: 0 2px; animation: dot-bounce 0.9s var(--bounce) infinite;
  }
  .pencil-dots span:nth-child(2) { animation-delay: 0.13s; }
  .pencil-dots span:nth-child(3) { animation-delay: 0.26s; }
  @keyframes dot-bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-6px); opacity: 1; } }

  .progress-line { font-size: 13px; font-weight: 700; color: var(--text-soft); margin-bottom: 10px; text-align: center; text-transform: uppercase; letter-spacing: 0.03em; }

  .task-card {
    background: var(--bg); border: 2px solid var(--border); border-radius: 20px;
    box-shadow: 0 4px 14px rgba(49, 44, 44, 0.07); padding: 20px 18px;
    animation: card-in 0.36s var(--bounce) both;
  }

  .form-card {
    background: var(--bg); border: 2px solid var(--border); border-radius: 20px;
    box-shadow: 0 4px 14px rgba(49, 44, 44, 0.07); padding: 22px 20px;
    animation: card-in 0.36s var(--bounce) both;
  }

  .task-question { font-family: 'Jost', sans-serif; font-size: 19px; font-weight: 600; margin: 0 0 14px; }
  .question-label {
    display: inline-block; font-family: 'Jost', sans-serif; font-size: 12px; font-weight: 700;
    color: var(--blue-dark); background: var(--blue-tint); padding: 3px 9px; border-radius: 8px;
    margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.03em;
  }
  .question-label.part-b { color: var(--yellow-dark); background: var(--yellow-tint); }
  .task-description {
    font-size: 14.5px; color: var(--text-soft); font-weight: 600; line-height: 1.55;
    margin: 0 0 20px; padding: 12px 14px; background: var(--bg-soft); border-radius: 12px;
  }

  .text-input {
    width: 100%; padding: 13px 16px; font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700;
    border: 2px solid var(--border); border-radius: 14px; background: var(--bg-soft); color: var(--text);
    margin-bottom: 12px;
  }
  .text-input:focus-visible { outline: 2px solid var(--blue); border-color: var(--blue); }

  .submit-btn {
    width: 100%; padding: 10px 16px; background: var(--accent); color: white; border: none;
    border-bottom: 3px solid var(--accent-dark);
    border-radius: 10px; font-family: 'Jost', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.02em;
    transition: transform 0.12s var(--bounce), border-bottom-width 0.12s ease;
  }
  .submit-btn:disabled {
    background: var(--border); color: var(--text-soft); border-bottom-color: var(--border);
    opacity: 1; cursor: default;
  }
  .submit-btn:active:not(:disabled) { transform: translateY(3px); border-bottom-width: 0; }

  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 16px; border: 2px solid; animation: feedback-in 0.3s var(--bounce) both; }
  @keyframes feedback-in { from { opacity: 0; transform: translateY(-6px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .feedback.ok { background: var(--green-tint); border-color: var(--green); }
  html[data-theme="dark"] .feedback.ok, html:not([data-theme="light"]) .feedback.ok { background: var(--green-tint); }
  @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) .feedback.ok { background: var(--green-tint); } }
  .feedback.bad { background: var(--red-tint); border-color: var(--red); }
  .feedback.mid { background: var(--yellow-tint); border-color: var(--yellow); }
  .feedback.mid .feedback-title { color: var(--yellow-dark); }
  .feedback-title { font-family: 'Jost', sans-serif; font-weight: 700; font-size: 16px; margin: 0 0 6px; }
  .feedback.ok .feedback-title { color: var(--green-dark); }
  .feedback.bad .feedback-title { color: var(--red-dark); }
  .feedback-body { font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.5; }
  .feedback-explain { margin-top: 8px; font-size: 13.5px; color: var(--text); font-weight: 600; font-style: normal; line-height: 1.5; }

  .next-btn {
    width: 100%; margin-top: 14px; padding: 10px 16px; background: var(--blue); color: white; border: none;
    border-bottom: 3px solid var(--blue-dark);
    border-radius: 10px; font-family: 'Jost', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.02em;
    transition: transform 0.12s var(--bounce), border-bottom-width 0.12s ease;
  }
  .next-btn:active { transform: translateY(4px); border-bottom-width: 0; }

  @media (prefers-reduced-motion: reduce) {
    .screen, .screen.back, .item-card, .task-card, .feedback { animation: none !important; opacity: 1 !important; transform: none !important; }
  }

  /* --- Нижняя панель вкладок --- */
  body { padding-bottom: 78px; }

  .tab-bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--bg); border-top: 2px solid var(--border);
    display: flex; justify-content: center; gap: 0;
    padding: 8px 0 max(8px, env(safe-area-inset-bottom));
    z-index: 10;
  }
  .tab-bar-inner { max-width: 420px; width: 100%; display: flex; }
  .tab-btn {
    position: relative;
    flex: 1; background: none; border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 6px 2px; font-family: 'Nunito', sans-serif; font-size: 10px; font-weight: 700;
    color: var(--nav-inactive); transition: transform 0.12s var(--bounce), color 0.15s ease;
    text-transform: uppercase; letter-spacing: 0.01em;
  }
  .tab-btn svg { width: 21px; height: 21px; }
  .tab-btn.active { color: var(--nav-active); }
  .tab-btn.active::before {
    content: '';
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 44px;
    height: 3px;
    border-radius: 3px;
    background: var(--nav-active);
  }
  .tab-btn:active { transform: scale(0.92); }

  /* --- Выбор "Задания / Тесты" на экране предмета --- */
  .home-choice { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
  .choice-card {
    background: var(--bg); border: 2px solid var(--border); border-bottom: 3px solid var(--border);
    border-radius: 14px; padding: 14px 16px; text-align: center; cursor: pointer;
    font-family: 'Nunito', sans-serif; transition: transform 0.12s var(--bounce), box-shadow 0.12s ease;
    animation: card-in 0.36s var(--bounce) both;
    box-shadow: 0 3px 10px rgba(49, 44, 44, 0.06);
  }
  .choice-card:active { transform: translateY(2px); border-bottom-width: 1px; box-shadow: 0 1px 4px rgba(49, 44, 44, 0.06); }
  .choice-card .choice-icon { width: 28px; height: 28px; margin: 0 auto 6px; }
  .choice-card .choice-title { font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 600; color: var(--text); }

  /* --- Результаты теста --- */
  .result-card {
    background: var(--bg); border: 2px solid var(--border); border-radius: 20px;
    padding: 26px 20px; text-align: center; animation: card-in 0.36s var(--bounce) both;
    box-shadow: 0 4px 14px rgba(49, 44, 44, 0.07);
  }


  .field-label {
    display: block; font-family: 'Jost', sans-serif; font-size: 13px; font-weight: 700;
    color: var(--text); margin-bottom: 6px;
  }
  .field-hint { font-size: 11.5px; color: var(--text-soft); font-weight: 600; margin-top: 4px; }
  .field-input, .field-textarea {
    width: 100%; padding: 11px 13px; font-family: 'Nunito', sans-serif; font-size: 14.5px; font-weight: 600;
    border: 2px solid var(--border); border-radius: 12px; background: var(--bg-soft); color: var(--text);
    box-sizing: border-box;
  }
  .field-input:focus, .field-textarea:focus { outline: none; border-color: var(--blue); background: var(--bg); }
  .field-textarea { resize: vertical; min-height: 60px; font-family: 'Nunito', sans-serif; }

  .cal-wrap { background: var(--bg); border: 2px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 16px; box-shadow: 0 3px 10px rgba(49, 44, 44, 0.06); }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-title { font-family: 'Jost', sans-serif; font-size: 15.5px; font-weight: 800; text-transform: capitalize; }
  .cal-nav-btn {
    width: 30px; height: 30px; border-radius: 8px; border: none; background: var(--bg-soft);
    display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text);
  }
  .cal-nav-btn:active { transform: scale(0.88); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-daylabel { text-align: center; font-size: 10.5px; font-weight: 700; color: var(--text-soft); padding-bottom: 4px; }
  .cal-day {
    position: relative; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    border-radius: 0; font-size: 13px; font-weight: 600; cursor: pointer; background: transparent;
    border: none; color: var(--text); padding: 0;
  }
  .cal-day.empty { cursor: default; }
  .cal-day-num {
    display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 50%; transition: background 0.15s ease, color 0.15s ease;
  }
  .cal-day.today .cal-day-num { color: var(--accent); font-weight: 800; }
  .cal-day.selected .cal-day-num { background: var(--accent); color: white; font-weight: 800; }
  .cal-day.today.selected .cal-day-num { color: white; }
  .cal-day.has-event .cal-day-num { background: var(--blue-tint); border-radius: 50%; }
  .cal-day.has-event.today .cal-day-num, .cal-day.has-event.selected .cal-day-num { background: transparent; }
  .cal-day-dots { display: flex; gap: 2px; height: 5px; }
  .cal-day-dot { width: 5px; height: 5px; border-radius: 50%; }
  @keyframes dot-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.3); } }
  .result-score { font-family: 'Jost', sans-serif; font-size: 40px; font-weight: 700; color: var(--green-dark); margin: 6px 0; }
  .result-label { font-size: 13px; font-weight: 700; color: var(--text-soft); text-transform: uppercase; letter-spacing: 0.03em; }
  .result-breakdown { display: flex; justify-content: center; gap: 18px; margin-top: 16px; }
  .result-stat { text-align: center; }
  .result-stat .num { font-family: 'Jost', sans-serif; font-size: 20px; font-weight: 700; }
  .result-stat.ok .num { color: var(--green-dark); }
  .result-stat.bad .num { color: var(--red-dark); }
  .result-stat.mid .num { color: var(--yellow-dark); }
  .result-stat .lbl { font-size: 11px; color: var(--text-soft); font-weight: 700; }

  /* --- Профиль --- */
  .profile-card {
    background: var(--bg); border: 2px solid var(--border); border-radius: 16px;
    padding: 14px 16px; margin-bottom: 10px; animation: card-in 0.36s var(--bounce) both;
    box-shadow: 0 2px 8px rgba(49, 44, 44, 0.05);
  }
  .profile-card .p-title { font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 700; }
  .profile-card .p-date { font-size: 12px; color: var(--text-soft); font-weight: 600; margin: 2px 0 8px; }
  .profile-card .p-row { display: flex; gap: 14px; font-size: 13.5px; font-weight: 700; }
  .profile-card .p-ok { color: var(--green-dark); }
  .profile-card .p-bad { color: var(--red-dark); }
  .section-label {
    font-family: 'Jost', sans-serif; font-size: 14px; font-weight: 700; color: var(--text-soft);
    text-transform: uppercase; letter-spacing: 0.03em; margin: 18px 0 10px;
  }
  .section-label:first-child { margin-top: 0; }

  /* --- Прогресс-бар на экране задания --- */
  .task-header-row { margin-bottom: 20px; }
  .progress-num {
    display: block; font-size: 12.5px; font-weight: 700; color: var(--text-soft);
    margin-bottom: 6px; text-align: center; text-transform: uppercase; letter-spacing: 0.02em;
  }
  .progress-bar-track { height: 14px; background: var(--border); border-radius: 20px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 20px; transition: width 0.35s var(--bounce); }

  .add-row-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 13px; margin-top: 4px;
    background: var(--bg); border: 2px dashed var(--border); border-radius: 14px;
    font-family: 'Jost', sans-serif; font-size: 14px; font-weight: 700; color: var(--blue-dark); cursor: pointer;
    transition: transform 0.12s var(--bounce), border-color 0.15s ease;
  }
  .add-row-btn:hover { border-color: var(--blue); }
  .add-row-btn:active { transform: scale(0.98); }
  .add-row-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

  .skip-btn {
    width: 100%; padding: 10px 16px; margin-bottom: 8px;
    background: var(--bg); color: var(--text-soft); border: 2px solid var(--border); border-bottom: 3px solid var(--border);
    border-radius: 10px; font-family: 'Jost', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.02em;
    transition: transform 0.12s var(--bounce), border-bottom-width 0.12s ease;
  }
  .skip-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

  .choice-outline-btn {
    width: 100%; padding: 12px 16px;
    background: var(--blue-tint); color: var(--accent); border: 2px solid var(--accent);
    border-radius: 12px; font-family: 'Jost', sans-serif; font-size: 13.5px; font-weight: 700; cursor: pointer;
    transition: transform 0.12s var(--bounce);
  }
  .choice-outline-btn:active { transform: scale(0.98); }

  /* --- Пронумерованные варианты ответа (переключаемые, до "Проверить") --- */
  .option-btn {
    position: relative;
    display: flex; align-items: flex-start; gap: 9px;
    text-align: left; width: 100%; margin-bottom: 8px;
    background: var(--bg); border: 2px solid var(--border); border-bottom: 3px solid var(--border); border-radius: 12px;
    padding: 9px 40px 9px 12px; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 600; color: var(--text); cursor: pointer;
    transition: transform 0.12s var(--bounce), background 0.15s ease, border-color 0.15s ease;
  }
  .option-num {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 22px; height: 22px; margin-top: 1px; border-radius: 6px; border: 2px solid var(--border);
    font-family: 'Jost', sans-serif; font-size: 12px; font-weight: 700; color: var(--text-soft); background: var(--bg-soft);
  }
  .option-text { flex: 1; }
  .option-tag {
    font-size: 11px; font-weight: 700; color: var(--green-dark); white-space: nowrap; align-self: center;
    text-transform: uppercase; letter-spacing: 0.02em;
  }

  .option-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .option-btn.selectable:hover { border-color: var(--blue); }
  .option-btn.selectable:active { transform: translateY(3px); border-bottom-width: 2px; }

  .option-btn.selected { border-color: var(--blue); background: var(--blue-tint); }
  .option-btn.selected .option-num { border-color: var(--blue); color: var(--blue-dark); background: var(--bg); }

  .option-btn.correct-selected { border-color: var(--green); background: var(--green-tint); cursor: default; }
  .option-btn.correct-selected .option-num { border-color: var(--green); background: var(--green); color: white; }
  .option-btn.correct-selected::after {
    content: '✓'; position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    width: 24px; height: 24px; border-radius: 50%; background: var(--green); color: white;
    display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800;
  }

  .option-btn.incorrect-selected { border-color: var(--red); background: var(--red-tint); cursor: default; }
  .option-btn.incorrect-selected .option-num { border-color: var(--red); background: var(--red); color: white; }
  .option-btn.incorrect-selected::after {
    content: '✕'; position: absolute; right: 12px; top: 50%; transform: translateY(-50%);

<script>
  // Адрес вашего бэкенда на Amvera — заполнить после развёртывания.
  const API_BASE_URL = 'https://gryphy-bot-uenwue.waw0.amvera.tech';

  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  async function apiGet(path) {
    const res = await fetch(API_BASE_URL + path, { headers: { 'X-Telegram-Init-Data': tg?.initData || '' } });
    if (res.status === 401) { const e = new Error('Не удалось подтвердить, что это вы — откройте страницу через кнопку в боте.'); e.status = 401; throw e; }
    if (!res.ok) {
      let data = null;
      try { data = await res.json(); } catch (e) { /* тело не JSON — используем запасной текст ниже */ }
      const e = new Error((data && (data.message || data.error)) || ('Сервер ответил с ошибкой: ' + res.status));
      e.status = res.status;
      throw e;
    }
    return res.json();
  }

  async function apiPost(path, body) {
    const res = await fetch(API_BASE_URL + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': tg?.initData || '' },
      body: JSON.stringify(body),
    });
    if (res.status === 401) { const e = new Error('Не удалось подтвердить, что это вы — откройте страницу через кнопку в боте.'); e.status = 401; throw e; }
    if (!res.ok) {
      let data = null;
      try { data = await res.json(); } catch (e) { /* тело не JSON — используем запасной текст ниже */ }
      const e = new Error((data && (data.message || data.error)) || ('Сервер ответил с ошибкой: ' + res.status));
      e.status = res.status;
      throw e;
    }
    return res.json();
  }

  async function apiSend(method, path, body) {
    const res = await fetch(API_BASE_URL + path, {
      method,
      headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': tg?.initData || '' },
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
    if (res.status === 401) { const e = new Error('Не удалось подтвердить, что это вы — откройте страницу через кнопку в боте.'); e.status = 401; throw e; }
    if (!res.ok) {
      let data = null;
      try { data = await res.json(); } catch (e) { /* тело не JSON — используем запасной текст ниже */ }
      const e = new Error((data && (data.message || data.error)) || ('Сервер ответил с ошибкой: ' + res.status));
      e.status = res.status;
      throw e;
    }
    return res.json();
  }


  const screenHost = document.getElementById('screenHost');
  const crumbsEl = document.getElementById('crumbs');

  let stack = [{ level: 'subjects', title: 'Предметы' }];
  let trainerStack = stack;
  let hwStack = [{ level: 'subjects', title: 'Предметы' }];
  let trainerInitialized = false;
  let currentTasks = [];

  // Курс, выбранный на экране «Мои курсы» — общий для всех 4 вкладок, а не
  // каждая вкладка сама по себе выбирает какой-то предмет по умолчанию.
  let currentCourseId = null;
  let currentCourseTitle = '';
  let hwBuiltForCourse = null;

  async function buildHomeworkEntry(subjectId) {
    try {
      const hwSections = await apiGet(`/api/subjects/${subjectId}/sections?kind=homework`);
      if (hwSections.length === 1) {
        return [{ level: 'homework_list', sectionId: hwSections[0].id, title: '' }];
      }
      return [{ level: 'sections', subjectId, purpose: 'homework', title: '' }];
    } catch (err) {
      return [{ level: 'sections', subjectId, purpose: 'homework', title: '' }];
    }
  }

  const ICONS = {
    subjects: `<svg class="level-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="10" cy="10" r="7.2" stroke="var(--green-dark)" stroke-width="1.8"/>
      <circle cx="10" cy="10" r="3.2" stroke="var(--green-dark)" stroke-width="1.4"/>
    </svg>`,
    sections: `<svg class="level-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M2 6.5C2 5.67 2.67 5 3.5 5H8L9.5 6.5H16.5C17.33 6.5 18 7.17 18 8V14.5C18 15.33 17.33 16 16.5 16H3.5C2.67 16 2 15.33 2 14.5V6.5Z" stroke="var(--blue-dark)" stroke-width="1.7" stroke-linejoin="round"/>
    </svg>`,
    topics: `<svg class="level-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M5 3H15V17L10 14.2L5 17V3Z" stroke="var(--yellow-dark)" stroke-width="1.7" stroke-linejoin="round"/>
    </svg>`,
    tests: `<svg class="level-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M6 3H14L14 17L10 14.5L6 17V3Z" stroke="var(--yellow-dark)" stroke-width="1.7" stroke-linejoin="round"/>
    </svg>`,
    rules: `<svg class="level-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M4 4C4 3 4.9 2 6 2H15V18H6C4.9 18 4 17 4 16V4Z" stroke="var(--green-dark)" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M4 16C4 15 4.9 14 6 14H15" stroke="var(--green-dark)" stroke-width="1.7"/>
    </svg>`
  };

  function renderCrumbs() {
    crumbsEl.innerHTML = '';
    const hasBack = stack.length > 1;
    const title = stack[stack.length - 1].title;
    if (hasBack) {
      const btn = document.createElement('button');
      btn.className = 'back-btn';
      btn.innerHTML = '<svg viewBox="0 0 20 20" fill="none"><path d="M12.5 5L7.5 10L12.5 15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      btn.onclick = () => {
        // С результата теста и с самого теста "назад" всегда возвращает
        // к списку тестов целиком, а не на промежуточный шаг прохождения.
        const cur = stack[stack.length - 1].level;
        if (cur === 'test_results' || cur === 'test_taking') {
          stopTestTimer();
          stack.pop();
          if (stack[stack.length - 1]?.level === 'test_taking') stack.pop();
        } else {
          stack.pop();
        }
        render(true);
      };
      crumbsEl.appendChild(btn);
    }
    if (title) {
      const titleEl = document.createElement('span');
      titleEl.className = 'crumb-title';
      titleEl.textContent = title;
      crumbsEl.appendChild(titleEl);
    }
    crumbsEl.style.display = (hasBack || title) ? '' : 'none';
  }

  let homeworkCountdownInterval = null;
  function stopHomeworkCountdown() {
    if (homeworkCountdownInterval) { clearInterval(homeworkCountdownInterval); homeworkCountdownInterval = null; }
  }

  function swapScreen(buildFn, isBack) {
    stopHomeworkCountdown();
    const screen = document.createElement('div');
    screen.className = 'screen' + (isBack ? ' back' : '');
    screen.id = 'content';
    buildFn(screen);
    screenHost.innerHTML = '';
    screenHost.appendChild(screen);
    return screen;
  }

  function showState(message, isError = false, withRetry = false, isBack = false, retryFn = () => render(false)) {
    swapScreen((screen) => {
      const p = document.createElement('p');
      p.className = 'state-msg' + (isError ? ' error' : '');
      p.textContent = message;
      screen.appendChild(p);
      if (withRetry) {
        const btn = document.createElement('button');
        btn.className = 'retry-btn';

  function findNextUnanswered() { return currentTasks.findIndex(t => !t.answered); }

  function formatDateRu(dateStr) {
    if (!dateStr) return '';
    const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
    const [y, m, d] = dateStr.split('-').map(Number);
    return d + ' ' + months[m - 1];
  }

  function escapeHtml(s) {
    return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function renderMarkdownText(s) {
    let out = escapeHtml(s);
    out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
    out = out.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    out = out.replace(/\*([^*]+)\*/g, '<b>$1</b>');
    out = out.replace(/(?<!_)_(?!_)([^_\n]+?)(?<!_)_(?!_)/g, '<i>$1</i>');
    return out.replace(/\n/g, '<br>');
  }

    const wrap = document.createElement('div');

    const rightBtn = document.createElement('button');

    wrap.appendChild(leftBtn);
    wrap.appendChild(rightBtn);

    const updateArrows = () => {
      leftBtn.disabled = pager.scrollLeft <= 4;
      rightBtn.disabled = pager.scrollLeft >= pager.scrollWidth - pager.clientWidth - 4;
    };
    leftBtn.onclick = () => pager.scrollBy({ left: -pager.clientWidth, behavior: 'smooth' });
    rightBtn.onclick = () => pager.scrollBy({ left: pager.clientWidth, behavior: 'smooth' });
    pager.addEventListener('scroll', updateArrows);
    setTimeout(updateArrows, 0);

  }

  function formatCountdown(seconds) {
    if (seconds <= 0) return 'срок истёк';
    const d = Math.floor(seconds / 86400);
    const h = Math.floor((seconds % 86400) / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    if (d > 0) return `${d}д ${h}ч ${m}м`;
    if (h > 0) return `${h}ч ${m}м`;
    return `${m}м`;
  }

            onClick: () => {
              stack.push({ level: 'order_choice', scope: 'topic', scopeId: t.id, title: `Урок ${i + 1}: ${t.title}` });

  async function beginSolving(scope, scopeId, title, order, feedbackMode) {
    stack.push({ level: 'tasks', scope, scopeId, title });
    renderCrumbs();
    showLoading('Загружаем задания', false);
    try {
      const path = scope === 'section' ? `/api/sections/${scopeId}/tasks` : `/api/topics/${scopeId}/tasks`;
      currentTasks = await apiGet(path);
      if (order === 'random') {
        for (let i = currentTasks.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [currentTasks[i], currentTasks[j]] = [currentTasks[j], currentTasks[i]];
        }
      }
      taskFeedbackMode = feedbackMode || 'immediate';

      const answeredCount = currentTasks.filter(t => t.answered).length;
      if (answeredCount > 0 && answeredCount < currentTasks.length) {
        renderResumeChoice(answeredCount);
      } else {
        renderTaskScreen(false);
      }
    } catch (err) {
      showState('Не получилось загрузить задания. ' + err.message, true, true);
    }
  }

  function renderResumeChoice(answeredCount) {
    swapScreen((screen) => {
      const card = document.createElement('div');
      card.className = 'result-card';
      card.innerHTML = `
        <div class="result-label">У вас есть незаконченная попытка</div>
        <div class="field-hint" style="text-align:center;margin:10px 0 0;">Отвечено ${answeredCount} из ${currentTasks.length} — продолжить с того же места или начать заново?</div>
      `;
      const continueBtn = document.createElement('button');
      continueBtn.className = 'submit-btn';
      continueBtn.style.marginTop = '20px';
      continueBtn.textContent = 'Продолжить';
      continueBtn.onclick = () => renderTaskScreen(false);
      card.appendChild(continueBtn);

      const restartBtn = document.createElement('button');
      restartBtn.className = 'skip-btn';
      restartBtn.style.marginTop = '10px';
      restartBtn.textContent = '🔄 Начать заново';
      restartBtn.onclick = () => {
        currentTasks.forEach(t => { t.answered = false; t.is_correct = undefined; t.given_answer = undefined; });
        renderTaskScreen(false);
      };
      card.appendChild(restartBtn);

      screen.appendChild(card);
    }, false);
  }

  function renderTaskScreen(isBack) {
    const screen = swapScreen(() => {}, isBack);
    const answeredCount = currentTasks.filter(t => t.answered).length;

    if (answeredCount === currentTasks.length) {
      const p = document.createElement('p');
      p.className = 'state-msg';
      const correctCount = currentTasks.filter(t => t.is_correct).length;
      const partialCount = currentTasks.filter(t => {
        if (t.is_correct || t.type !== 'multi' || !t.given_answer || !t.correct_answer_final) return false;
        const givenSet = new Set(String(t.given_answer).split(';').map(x => x.trim().toLowerCase()));
        const correctSet = new Set(String(t.correct_answer_final).split(';').map(x => x.trim().toLowerCase()));
        const missing = [...correctSet].filter(x => !givenSet.has(x)).length;
        const extra = [...givenSet].filter(x => !correctSet.has(x)).length;
        return (missing + extra) === 1;
      }).length;
      p.textContent = `🏁 Все задания решены! Верно: ${correctCount} из ${currentTasks.length}` + (partialCount ? `, частично верно: ${partialCount}` : '') + '.';
      screen.appendChild(p);

      const retryBtn = document.createElement('button');
      retryBtn.className = 'submit-btn';
      retryBtn.style.maxWidth = '260px';
      retryBtn.style.margin = '0 auto 10px';
      retryBtn.style.display = 'block';
      retryBtn.textContent = '🔄 Пройти заново';
      retryBtn.onclick = () => {
        currentTasks.forEach(t => { t.answered = false; t.is_correct = undefined; t.given_answer = undefined; });
        renderTaskScreen(false);
      };
      screen.appendChild(retryBtn);

      const currentScope = stack[stack.length - 1];
      if (currentScope?.scope && currentScope.scopeId) {
        const reviewBtn = document.createElement('button');
        reviewBtn.className = 'skip-btn';
        reviewBtn.style.maxWidth = '260px';
        reviewBtn.style.margin = '0 auto';
        reviewBtn.style.display = 'block';
        reviewBtn.textContent = '🔍 Пересмотреть свои ответы';
        reviewBtn.onclick = () => {
          stack.push({
            level: currentScope.scope === 'section' ? 'section_review' : 'topic_review',
            topicId: currentScope.scopeId, sectionId: currentScope.scopeId, title: 'Разбор ответов',
          });
          renderCrumbs();
          render(false);
        };
        screen.appendChild(reviewBtn);
      }
      return;
    }

    const idx = findNextUnanswered();
    const task = currentTasks[idx];

    // Прогресс-бар (крестик выхода не нужен — назад ведёт кнопка в крошках сверху)
    const headerRow = document.createElement('div');
    headerRow.className = 'task-header-row';
    const numLabel = document.createElement('span');
    numLabel.className = 'progress-num';
    numLabel.textContent = 'Задание ' + (answeredCount + 1) + ' из ' + currentTasks.length;
    headerRow.appendChild(numLabel);
    const track = document.createElement('div');
    track.className = 'progress-bar-track';
    const fill = document.createElement('div');
    fill.className = 'progress-bar-fill';
    fill.style.width = Math.round((answeredCount / currentTasks.length) * 100) + '%';
    track.appendChild(fill);
    headerRow.appendChild(track);
    screen.appendChild(headerRow);

    const card = document.createElement('div');
    card.className = 'task-card';

    const q = document.createElement('p');
    q.className = 'task-question';
    q.textContent = task.question;
    card.appendChild(q);

    if (task.description) {
      const d = document.createElement('p');
      d.className = 'task-description';
      d.textContent = task.description;
      card.appendChild(d);
    }

    if (task.image_file_id) {
      renderTaskImage(card, task.image_file_id);
    }

    if (task.table_data && task.table_data.length) {
      const table = document.createElement('table');
      table.style.cssText = 'width:100%;border-collapse:collapse;margin-bottom:16px;table-layout:fixed;';
      task.table_data.forEach(row => {
        const tr = document.createElement('tr');
        row.forEach(cell => {
          const td = document.createElement('td');
          td.style.cssText = 'border:1px solid var(--border);padding:8px 10px;font-size:13.5px;word-break:break-word;';
          td.textContent = cell;
          tr.appendChild(td);
        });
        table.appendChild(tr);
      });
      card.appendChild(table);
    }

    const answerArea = document.createElement('div');
    card.appendChild(answerArea);

    if ((task.type === 'buttons' || task.type === 'multi') && task.options) {
      const isMulti = task.type === 'multi';
      let selected = task._draftSelected ? task._draftSelected.slice() : [];

      const submitBtn = document.createElement('button');
      submitBtn.className = 'submit-btn';
      submitBtn.textContent = 'Проверить';
      submitBtn.disabled = selected.length === 0;

      const optionEls = task.options.map((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn selectable';
        btn.innerHTML = `<span class="option-num">${i + 1}</span><span class="option-text"></span>`;
        btn.querySelector('.option-text').innerHTML = renderMarkdownText(opt);
        if (selected.includes(opt)) btn.classList.add('selected');
        btn.onclick = () => {
          if (isMulti) {
            const pos = selected.indexOf(opt);
            if (pos === -1) { selected.push(opt); btn.classList.add('selected'); }
            else { selected.splice(pos, 1); btn.classList.remove('selected'); }
          } else {
            selected = [opt];
            optionEls.forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
          }
          task._draftSelected = selected.slice();
          submitBtn.disabled = selected.length === 0;
        };
        answerArea.appendChild(btn);
        return btn;
      });

      submitBtn.onclick = () => submitAnswer(task.id, selected, card, task, optionEls);

      const skipBtn = document.createElement('button');
      skipBtn.className = 'skip-btn';
      skipBtn.textContent = 'Пропустить';
      skipBtn.onclick = () => {
        currentTasks.splice(currentTasks.indexOf(task), 1);
        currentTasks.push(task);
        renderTaskScreen(false);
      };
      answerArea.appendChild(skipBtn);
      answerArea.appendChild(submitBtn);
    } else {
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'text-input';
      input.placeholder = 'Введите ответ…';
      answerArea.appendChild(input);

      const submitBtn = document.createElement('button');
      submitBtn.className = 'submit-btn';
      submitBtn.textContent = 'Ответить';
      submitBtn.disabled = true;
      input.addEventListener('input', () => { submitBtn.disabled = !input.value.trim(); });
      submitBtn.onclick = () => { if (!input.value.trim()) return; submitAnswer(task.id, input.value.trim(), card, task); };

      const skipBtn = document.createElement('button');
      skipBtn.className = 'skip-btn';
      skipBtn.textContent = 'Пропустить';
      skipBtn.onclick = () => {
        currentTasks.splice(currentTasks.indexOf(task), 1);
        currentTasks.push(task);
        renderTaskScreen(false);
      };
      answerArea.appendChild(skipBtn);
      answerArea.appendChild(submitBtn);

      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitBtn.click(); });
    }

    screen.appendChild(card);
    screen.appendChild(buildReportErrorButton({ task_id: task.id }));
    if (isTeacherViewing) {
      screen.appendChild(buildTeacherFixButton('task', task, () => renderTaskScreen(false)));
    }
  }

  function buildTeacherFixButton(kind, item, onSaved) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'text-align:center;margin-top:6px;';
    const btn = document.createElement('button');
    btn.style.cssText = 'background:none;border:none;color:var(--yellow-dark);font-size:12px;font-weight:700;cursor:pointer;padding:6px;';
    btn.textContent = '✏️ Исправить (видно только вам)';
    btn.onclick = () => promptTeacherFix(kind, item, onSaved);
    wrap.appendChild(btn);
    return wrap;
  }

  async function promptTeacherFix(kind, item, onSaved) {
    let full;
    try {
      const path = kind === 'task' ? `/api/teacher/tasks/${item.id}` : `/api/teacher/testquestions/${item.id}`;
      full = await apiGet(path);
    } catch (err) {
      const msg = 'Не получилось загрузить данные: ' + err.message;
      if (tg?.showAlert) tg.showAlert(msg); else alert(msg);
      return;
    }

    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px;';
    const isChoice = full.type === 'buttons' || full.type === 'multi';
    overlay.innerHTML = '<div style="background:var(--bg);border-radius:16px;padding:18px;max-width:360px;width:100%;max-height:90vh;overflow-y:auto;">' +
      '<div class="field-label">Вопрос</div>' +
      '<textarea class="field-input" id="fixQ" rows="2" style="resize:vertical;margin-bottom:10px;"></textarea>' +
      (isChoice
        ? '<div class="field-label">Варианты ответа — отметьте правильные</div><div id="fixOptions" style="margin-bottom:10px;"></div><button type="button" id="fixAddOption" style="background:none;border:none;color:var(--blue-dark);font-size:12.5px;font-weight:700;cursor:pointer;padding:4px 0 10px;">+ добавить вариант</button>'
        : '<div class="field-label">Правильный ответ</div><input class="field-input" id="fixA" style="margin-bottom:10px;">') +
      '<div class="field-label">Объяснение (необязательно)</div>' +
      '<textarea class="field-input" id="fixE" rows="3" style="resize:vertical;margin-bottom:10px;"></textarea>' +
      '<div id="fixErr" style="color:var(--red-dark);font-size:12.5px;font-weight:700;margin-bottom:8px;display:none;"></div>' +
      '<div style="display:flex;gap:8px;">' +
      '<button class="back-btn" id="fixCancel" style="flex:1;">Отмена</button>' +
      '<button class="submit-btn" id="fixSave" style="flex:1;margin-top:0;">Сохранить</button>' +
      '</div></div>';
    document.body.appendChild(overlay);
    const qInput = overlay.querySelector('#fixQ');
    const eInput = overlay.querySelector('#fixE');
    const errBox = overlay.querySelector('#fixErr');
    const saveBtn = overlay.querySelector('#fixSave');
    qInput.value = full.question || '';
    eInput.value = full.explanation || '';

    let aInput = null;
    let optionsBox = null;
    const correctSet = new Set(isChoice ? (Array.isArray(full.answer) ? full.answer : [full.answer].filter(Boolean)) : []);

    if (isChoice) {
      optionsBox = overlay.querySelector('#fixOptions');
      const isMulti = full.type === 'multi';

      function addOptionRow(text, isCorrect) {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:6px;';
        const toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.style.cssText = `width:26px;height:26px;border-radius:${isMulti ? '7px' : '50%'};border:2px solid ${isCorrect ? 'var(--green)' : 'var(--border)'};background:${isCorrect ? 'var(--green)' : 'var(--bg)'};color:white;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;`;
        toggle.innerHTML = isCorrect ? '<svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M4 10l4 4 8-8" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '';
        toggle.dataset.correct = isCorrect ? '1' : '0';
        toggle.onclick = () => {
          const nowCorrect = toggle.dataset.correct !== '1';
          if (nowCorrect && !isMulti) {
            // одиночный выбор — снимаем отметку со всех остальных
            optionsBox.querySelectorAll('button[data-correct]').forEach((b) => {
              b.dataset.correct = '0';
              b.style.background = 'var(--bg)';
              b.style.borderColor = 'var(--border)';
              b.innerHTML = '';
            });
          }
          toggle.dataset.correct = nowCorrect ? '1' : '0';
          toggle.style.background = nowCorrect ? 'var(--green)' : 'var(--bg)';
          toggle.style.borderColor = nowCorrect ? 'var(--green)' : 'var(--border)';
          toggle.innerHTML = nowCorrect ? '<svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M4 10l4 4 8-8" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '';
        };
        row.appendChild(toggle);
        const input = document.createElement('input');
        input.className = 'field-input';
        input.value = text;
        input.style.flex = '1';
        row.appendChild(input);
        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.style.cssText = 'background:none;border:none;color:var(--red-dark);font-size:18px;cursor:pointer;padding:0 4px;flex-shrink:0;';
        delBtn.textContent = '✕';
        delBtn.onclick = () => row.remove();
        row.appendChild(delBtn);
        optionsBox.appendChild(row);
      }

      (full.options || []).forEach((opt) => addOptionRow(opt, correctSet.has(opt)));
      overlay.querySelector('#fixAddOption').onclick = () => addOptionRow('', false);
    } else {
      aInput = overlay.querySelector('#fixA');
      aInput.value = full.answer || '';
    }

    function closeOverlay() { overlay.remove(); }
    overlay.querySelector('#fixCancel').onclick = closeOverlay;
    saveBtn.onclick = async () => {
      const question = qInput.value.trim();
      let answer, options;
      if (isChoice) {
        const rows = [...optionsBox.querySelectorAll('div')];
        const texts = rows.map((r) => r.querySelector('input').value.trim()).filter(Boolean);
        const corrects = rows.filter((r) => r.querySelector('input').value.trim() && r.querySelector('button[data-correct]').dataset.correct === '1')
          .map((r) => r.querySelector('input').value.trim());
        if (texts.length < 2) {
          errBox.textContent = 'Нужно хотя бы два варианта ответа.';
          errBox.style.display = 'block';
          return;
        }
        if (!corrects.length) {
          errBox.textContent = 'Отметьте хотя бы один правильный вариант.';
          errBox.style.display = 'block';
          return;
        }
        options = texts;
        answer = full.type === 'multi' ? corrects : corrects[0];
      } else {
        answer = aInput.value.trim();
      }
      if (!question || (isChoice ? false : !answer)) {
        errBox.textContent = 'Заполните вопрос и ответ.';
        errBox.style.display = 'block';
        return;
      }
      saveBtn.disabled = true;
      saveBtn.textContent = 'Сохраняю…';
      try {
        const path = kind === 'task' ? `/api/teacher/tasks/${item.id}` : `/api/teacher/testquestions/${item.id}`;
        const payload = { question, answer, explanation: eInput.value.trim() };
        if (isChoice) payload.options = options;
        await apiSend('PATCH', path, payload);
        closeOverlay();
        const okMsg = 'Исправлено.';
        if (tg?.showAlert) tg.showAlert(okMsg); else alert(okMsg);
        if (onSaved) onSaved();
      } catch (err) {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Сохранить';
        errBox.textContent = 'Не получилось сохранить: ' + err.message;
        errBox.style.display = 'block';
      }
    };
  }

  function buildReportErrorButton(context) {
    const wrap = document.createElement('div');

  function promptReportError(context) {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px;';
    overlay.innerHTML = '<div style="background:var(--bg);border-radius:16px;padding:18px;max-width:360px;width:100%;max-height:90vh;overflow-y:auto;">' +
      '<div class="field-label">' + (context.task_id || context.test_question_id ? 'Что не так в этом задании?' : 'Расскажите, что не так') + '</div>' +
      '<textarea class="field-input" id="repMsg" rows="4" style="resize:vertical;margin-bottom:10px;" placeholder="Опишите ошибку своими словами…"></textarea>' +
      '<label id="repPhotoLabel" style="display:flex;align-items:center;gap:8px;padding:10px 12px;border:2px dashed var(--border);border-radius:12px;cursor:pointer;margin-bottom:10px;font-size:13px;font-weight:700;color:var(--text-soft);">' +
      '📎 Приложить фото (необязательно)' +
      '<input type="file" accept="image/*" id="repPhoto" style="display:none;">' +
      '</label>' +
      '<div id="repPhotoPreviewWrap" style="display:none;margin-bottom:10px;position:relative;">' +
      '<img id="repPhotoPreview" style="max-width:100%;border-radius:12px;display:block;">' +
      '<button id="repPhotoRemove" type="button" style="position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,0.6);color:white;border:none;font-size:14px;cursor:pointer;">✕</button>' +
      '</div>' +
      '<div id="repErr" style="color:var(--red-dark);font-size:12.5px;font-weight:700;margin-bottom:8px;display:none;"></div>' +

      '<button class="back-btn" id="repCancel" style="flex:1;">Отмена</button>' +

    document.body.appendChild(overlay);

    const errBox = overlay.querySelector('#repErr');

      previewWrap.style.display = 'block';
      photoLabel.style.display = 'none';
