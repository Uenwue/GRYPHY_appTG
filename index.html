  function buildCalendarGrid(year, month, eventDatesSet, selectedDate, onDayClick, onPrev, onNext) {
    const wrap = document.createElement('div');
    wrap.className = 'cal-wrap';

    const head = document.createElement('div');
    head.className = 'cal-head';
    const prevBtn = document.createElement('button');
    prevBtn.className = 'cal-nav-btn';
    prevBtn.innerHTML = '‹';
    prevBtn.onclick = onPrev;
    const title = document.createElement('div');
    title.className = 'cal-title';
    const monthNames = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
    title.textContent = monthNames[month] + ' ' + year;
    const nextBtn = document.createElement('button');
    nextBtn.className = 'cal-nav-btn';
    nextBtn.innerHTML = '›';
    nextBtn.onclick = onNext;
    head.appendChild(prevBtn);
    head.appendChild(title);
    head.appendChild(nextBtn);
    wrap.appendChild(head);

    const grid = document.createElement('div');
    grid.className = 'cal-grid';
    ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].forEach((d) => {
      const lbl = document.createElement('div');
      lbl.className = 'cal-daylabel';
      lbl.textContent = d;
      grid.appendChild(lbl);
    });

    const now = new Date();
    const todayStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    const firstDay = new Date(year, month, 1);
    let startOffset = firstDay.getDay() - 1;
    if (startOffset < 0) startOffset = 6;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const isColorMap = eventDatesSet instanceof Map;

    for (let i = 0; i < startOffset; i++) {
      const empty = document.createElement('div');
      empty.className = 'cal-day empty';
      grid.appendChild(empty);
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'cal-day';
      const hasEvent = eventDatesSet.has(dateStr);
      if (hasEvent) cell.classList.add('has-event');
      if (dateStr === todayStr) cell.classList.add('today');
      if (dateStr === selectedDate) cell.classList.add('selected');
      const numSpan = document.createElement('span');
      numSpan.textContent = d;
      cell.appendChild(numSpan);
      if (hasEvent) {
        const colors = isColorMap ? eventDatesSet.get(dateStr) : ['var(--yellow)'];
        const dotsWrap = document.createElement('span');
        dotsWrap.className = 'cal-day-dots';
        colors.slice(0, 3).forEach((color) => {
          const dot = document.createElement('span');
          dot.className = 'cal-day-dot';
          dot.style.background = color;
          dotsWrap.appendChild(dot);
        });
        cell.appendChild(dotsWrap);
      }
      cell.onclick = () => onDayClick(dateStr);
      grid.appendChild(cell);
    }
    wrap.appendChild(grid);
    return wrap;
  }

  async function renderStudentSchedule() {
    showLoading('Загружаем расписание', false);
    try {
      const events = await apiGet('/api/schedule');
      const now = new Date();

        calYear = now.getFullYear();
        calMonth = now.getMonth();
        calSelected = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
      }
      const eventDates = new Set(events.map((ev) => ev.event_time.slice(0, 10)));

      swapScreen((screen) => {
        const cal = buildCalendarGrid(calYear, calMonth, eventDates, calSelected,
          (dateStr) => { calSelected = dateStr; renderStudentSchedule(); },
          () => { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderStudentSchedule(); },
          () => { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderStudentSchedule(); },
        );
        screen.appendChild(cal);

        const dayEvents = events.filter((ev) => ev.event_time.slice(0, 10) === calSelected);

          const p = document.createElement('p');

  async function renderProfile(isBack) {

    showLoading('Загружаем', isBack);

    try {
    if (current.level === 'profile_subjects') {
      const [subjects, scheduleEvents] = await Promise.all([
        apiGet('/api/subjects'),
        apiGet('/api/schedule'),
      ]);
      swapScreen((screen) => {
        const title = document.createElement('h2');
        title.style.cssText = "font-family:'Jost',sans-serif;font-size:22px;font-weight:800;margin:0 0 2px;";
        title.textContent = 'Профиль';
        screen.appendChild(title);
        const subtitle = document.createElement('p');
        subtitle.className = 'field-hint';
        subtitle.style.cssText = 'margin:0 0 16px;font-size:13px;';
        subtitle.textContent = 'Данные аккаунта и доступ к предметам';

          p.className = 'state-msg';
          p.textContent = 'Пока нет пройденных тем или разделов по этому предмету.';
          screen.appendChild(p);
          return;
        }
        stats.tasks.forEach((item, i) => {
          const card = document.createElement('div');
          card.className = 'profile-card';
          card.style.animationDelay = (i * 0.05) + 's';
          card.innerHTML = `
            <div class="p-title">${item.title}</div>
            <div class="p-date">${item.date}</div>
            <div class="p-row"><span class="p-ok">✅ ${item.correct}</span><span class="p-bad">❌ ${item.wrong}</span></div>
          `;
          screen.appendChild(card);
        });
      }, isBack);
    } else if (current.level === 'profile_tests') {
      const stats = await apiGet(`/api/subjects/${current.subjectId}/profile`);
      swapScreen((screen) => {
        if (!stats.tests.length) {
          const p = document.createElement('p');
          p.className = 'state-msg';
          p.textContent = 'Пока нет пройденных тестов по этому предмету.';
          screen.appendChild(p);
          return;
        }
        stats.tests.forEach((item, i) => {
          const card = document.createElement('div');
          card.className = 'profile-card';
          card.style.animationDelay = (i * 0.05) + 's';
          const scoreText = (item.actual_score !== null && item.actual_score !== undefined)
            ? `${item.actual_score} тест. балл (${item.primary_score} перв.)`
            : `${item.primary_score} перв. балл`;
          card.innerHTML = `
            <div class="p-title">${item.test_title}</div>
            <div class="p-date">${item.date}</div>
            <div class="p-row">🏆 ${scoreText} · ✅ ${item.correct} ❌ ${item.wrong}</div>
          `;
          screen.appendChild(card);
        });
      }, isBack);
    }
    } catch (err) {
      showState('Не получилось загрузить. ' + err.message, true, true, isBack);
    }
  }

  // --- Тема оформления: применяет сохранённый выбор при загрузке (сам
  // переключатель — на экране профиля, applyThemeChoice вызывается оттуда) ---
  function applyThemeChoice(choice) {
    localStorage.setItem('miniapp-theme', choice);
    if (choice === 'system') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', choice);
    }
  }
  applyThemeChoice(localStorage.getItem('miniapp-theme') || 'system');

  async function checkProfileSetupThenStart() {
    try {
      const info = await apiGet('/api/me/profile-info');
      if (info.filled) {
        render(false);
      } else {
        renderProfileSetupForm();
      }
    } catch (err) {
      // Если проверку анкеты не удалось выполнить (например, сеть) — не
      // блокируем вход в приложение совсем, просто идём дальше как обычно.
      render(false);
    }
  }

  function renderProfileSetupForm() {
    crumbsEl.innerHTML = '';
    screenHost.innerHTML = '';
    const screen = document.createElement('div');
    screen.className = 'screen';
    screen.id = 'content';

    const card = document.createElement('div');
    card.className = 'task-card';

    const title = document.createElement('p');
    title.className = 'task-question';
    title.textContent = 'Давайте познакомимся!';
    card.appendChild(title);

    const hint = document.createElement('p');
    hint.className = 'task-description';
    hint.textContent = 'Расскажите немного о себе — это займёт одну минуту.';
    card.appendChild(hint);

    const makeField = (labelText, placeholder) => {
      const label = document.createElement('div');
      label.className = 'field-label';
      label.textContent = labelText;
      card.appendChild(label);
      const input = document.createElement('input');
      input.className = 'field-input';
      input.placeholder = placeholder;
      input.style.marginBottom = '14px';
      card.appendChild(input);
      return input;
    };

    const surnameInput = makeField('Фамилия', 'Иванова');
    const givenNameInput = makeField('Имя', 'Мария');
    const patronymicInput = makeField('Отчество (если есть)', 'Сергеевна');

    const statusLabel = document.createElement('div');
    statusLabel.className = 'field-label';
    statusLabel.textContent = 'Вы сейчас';
    card.appendChild(statusLabel);

    const statusGrid = document.createElement('div');
    statusGrid.style.cssText = 'display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;';
    const statusOptions = [
      { key: 'school', label: 'Учусь в школе' },
      { key: 'college', label: 'Учусь в колледже/вузе' },
      { key: 'work', label: 'Работаю' },
    ];
    let selectedStatus = null;
    const statusButtons = {};
    const gradeWrap = document.createElement('div');
    let gradeInput = null;

    function renderStatusButtons() {
      statusGrid.innerHTML = '';
      statusOptions.forEach((opt) => {
        const btn = document.createElement('button');
        const active = selectedStatus === opt.key;
        btn.type = 'button';
        btn.style.cssText = `padding:10px 4px;border-radius:12px;border:2px solid ${active ? 'var(--blue)' : 'var(--border)'};background:${active ? 'var(--blue-tint)' : 'var(--bg)'};color:${active ? 'var(--blue-dark)' : 'var(--text-soft)'};font-family:'Jost',sans-serif;font-size:12px;font-weight:700;cursor:pointer;line-height:1.25;`;
        btn.textContent = opt.label;
        btn.onclick = () => { selectedStatus = opt.key; renderStatusButtons(); renderGradeField(); };
        statusButtons[opt.key] = btn;
        statusGrid.appendChild(btn);
      });
    }
    function renderGradeField() {
      gradeWrap.innerHTML = '';
      gradeInput = null;
      if (selectedStatus === 'school') {
        const label = document.createElement('div');
        label.className = 'field-label';
        label.textContent = 'Класс';
        gradeWrap.appendChild(label);
        gradeInput = document.createElement('input');
        gradeInput.className = 'field-input';
        gradeInput.placeholder = 'Например, 11';
        gradeInput.style.marginBottom = '14px';
        gradeWrap.appendChild(gradeInput);
      }
    }
    renderStatusButtons();
    card.appendChild(statusGrid);
    card.appendChild(gradeWrap);
    renderGradeField();

    const cityInput = makeField('Город', 'Например, Минск');

    const errBox = document.createElement('div');
    errBox.style.cssText = 'color:#EA2B2B;font-size:12.5px;font-weight:700;margin-bottom:8px;display:none;';
    card.appendChild(errBox);

    const saveBtn = document.createElement('button');
    saveBtn.className = 'submit-btn';
    saveBtn.textContent = 'Продолжить';
    saveBtn.onclick = async () => {
      const surname = surnameInput.value.trim();
      const given_name = givenNameInput.value.trim();
      const patronymic = patronymicInput.value.trim();
      const city = cityInput.value.trim();
      const grade = gradeInput ? gradeInput.value.trim() : '';
      if (!surname || !given_name || !selectedStatus || !city) {
        errBox.textContent = 'Заполните фамилию, имя, статус и город.';
        errBox.style.display = 'block';
        return;
      }
      if (selectedStatus === 'school' && !grade) {
        errBox.textContent = 'Укажите класс.';
        errBox.style.display = 'block';
        return;
      }
      saveBtn.disabled = true;
      saveBtn.textContent = 'Сохраняю…';
      try {
        await apiPost('/api/me/profile-info', { surname, given_name, patronymic, status: selectedStatus, grade, city });
        render(false);
      } catch (err) {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Продолжить';
        errBox.textContent = 'Не получилось сохранить: ' + err.message;
        errBox.style.display = 'block';
      }
    };
    card.appendChild(saveBtn);

    screen.appendChild(card);
    screenHost.appendChild(screen);
  }

  checkProfileSetupThenStart();
</script>

</body>
</html>
