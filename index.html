          avatarsRow.className = 'lb-podium-avatars';
          const labelsRow = document.createElement('div');
          labelsRow.className = 'lb-podium-labels';
          const order = podium.length >= 2 ? [1, 0, 2] : [0];
          order.forEach((idx) => {
            const p = podium[idx];
            if (!p) return;
            const avatarSlot = document.createElement('div');
            avatarSlot.className = 'lb-podium-item' + (idx === 0 ? ' first' : '');
            const avatarWrap = document.createElement('div');
            avatarWrap.className = 'lb-avatar-wrap';
            if (idx === 0) {
              const crown = document.createElement('div');
              crown.className = 'lb-crown';
              crown.textContent = '👑';
              avatarWrap.appendChild(crown);
            }
            const avatar = document.createElement('div');
            avatar.className = 'lb-avatar';
            avatar.style.background = PASTEL_COLORS[idx % PASTEL_COLORS.length];
            avatar.textContent = initialOf(p.name);
            avatarWrap.appendChild(avatar);
            const rankBadge = document.createElement('div');
            rankBadge.className = 'lb-rank-badge';
            rankBadge.textContent = idx + 1;
            avatarWrap.appendChild(rankBadge);
            avatarSlot.appendChild(avatarWrap);
            avatarsRow.appendChild(avatarSlot);

            const labelSlot = document.createElement('div');
            labelSlot.className = 'lb-podium-item';
            const name = document.createElement('div');
            name.className = 'lb-podium-name';
            name.textContent = p.name;
            labelSlot.appendChild(name);
            const points = document.createElement('div');
            points.className = 'lb-podium-points';
            points.textContent = p.points;
            labelSlot.appendChild(points);
            labelsRow.appendChild(labelSlot);
          });
          podiumWrap.appendChild(avatarsRow);
          podiumWrap.appendChild(labelsRow);
          page.appendChild(podiumWrap);
        }

        if (rest.length) {
          const header = document.createElement('div');
          header.className = 'lb-list-header';
          header.innerHTML = `<span class="lb-col-rank">Ранг</span><span style="width:34px;flex-shrink:0;"></span><span class="lb-col-player">Игрок</span><span>${leaderboardType === 'test_scores' ? 'Баллы' : 'Задания'}</span>`;
          page.appendChild(header);

          rest.forEach((row) => {
            const isMe = String(row.telegram_id) === myId;
            const item = document.createElement('div');
            item.className = 'lb-row' + (isMe ? ' me' : '');
            const rank = document.createElement('div');
            rank.className = 'lb-row-rank';
            rank.textContent = row.place;
            item.appendChild(rank);
            const avatar = document.createElement('div');
            avatar.className = 'lb-row-avatar';
            avatar.style.background = isMe ? 'rgba(255,255,255,0.3)' : PASTEL_COLORS[row.place % PASTEL_COLORS.length];
            avatar.textContent = initialOf(row.name);
            item.appendChild(avatar);
            const name = document.createElement('div');
            name.className = 'lb-row-name';
            name.textContent = row.name + (isMe ? ' (вы)' : '');
            item.appendChild(name);
            const pts = document.createElement('div');
            pts.className = 'lb-row-points';
            pts.textContent = row.points;
            item.appendChild(pts);
            page.appendChild(item);
          });
        }
        return page;
      };

      swapScreen((screen) => {
        const segmented = document.createElement('div');
        segmented.className = 'lb-segmented';
        const tabDefs = [
          { key: 'total_tasks', label: 'Решено всего' },
          { key: 'correct_tasks', label: 'Верно решено' },
          { key: 'test_scores', label: 'Баллы тестов' },
        ];
        tabDefs.forEach((tab) => {
          const btn = document.createElement('button');
          btn.className = 'lb-segment' + (leaderboardType === tab.key ? ' active' : '');
          btn.textContent = tab.label;
          btn.onclick = () => { leaderboardType = tab.key; renderProfile(false); };
          segmented.appendChild(btn);
        });
        screen.appendChild(segmented);

        const periodLabel = document.createElement('div');
        periodLabel.className = 'lb-period-label';
        periodLabel.textContent = periodDefs[0].label;
        screen.appendChild(periodLabel);

        const dots = document.createElement('div');
        dots.className = 'stat-chart-dots';
        dots.style.marginBottom = '14px';
        periodDefs.forEach((p, i) => {
          const dot = document.createElement('span');
          dot.className = 'stat-chart-dot' + (i === 0 ? ' active' : '');
          dots.appendChild(dot);
        });
        screen.appendChild(dots);

        const pager = document.createElement('div');
        pager.className = 'lb-pager';
        periodDefs.forEach((p) => {
          const page = buildLeaderboardPage(rowsByPeriod[p.key]);
          page.classList.add('lb-pager-page');
          pager.appendChild(page);
        });
        screen.appendChild(addPagerArrows(pager));

        pager.addEventListener('scroll', () => {
          if (!pager.clientWidth) return;
          const idx = Math.min(periodDefs.length - 1, Math.max(0, Math.round(pager.scrollLeft / pager.clientWidth)));
          [...dots.children].forEach((dot, i) => dot.classList.toggle('active', i === idx));
          periodLabel.textContent = periodDefs[idx].label;
        });
      }, isBack);
    } else if (current.level === 'profile_challenges') {
      const items = await apiGet(`/api/subjects/${current.subjectId}/challenges`);
      const catLabels = { day: 'День', week: 'Неделя', weekend: 'Выходные', month: 'Месяц' };
      swapScreen((screen) => {
        if (!items.length) {
          const p = document.createElement('p');
          p.className = 'state-msg';
          p.textContent = 'Пока нет активных заданий месяца.';
          screen.appendChild(p);
          return;
        }
        const byCategory = {};
        items.forEach((it) => { (byCategory[it.category] = byCategory[it.category] || []).push(it); });
        ['month', 'week', 'weekend', 'day'].forEach((cat) => {
          const group = byCategory[cat];
          if (!group) return;
          const catTitle = document.createElement('div');
          catTitle.className = 'field-hint';
          catTitle.style.cssText = 'margin:0 0 8px;text-transform:uppercase;font-weight:800;letter-spacing:0.03em;';
          catTitle.textContent = catLabels[cat];
          screen.appendChild(catTitle);

          group.forEach((it) => {
            const card = document.createElement('div');
            card.className = 'result-card';
            card.style.cssText = 'text-align:left;margin-bottom:14px;';
            const done = it.progress >= it.target;
            const t = document.createElement('div');
            t.style.cssText = 'font-family:\'Jost\',sans-serif;font-weight:800;font-size:16px;margin-bottom:4px;';
            t.textContent = (done ? '✅ ' : '') + it.title;
            card.appendChild(t);
            if (it.description) {
              const d = document.createElement('div');
              d.className = 'field-hint';
              d.style.margin = '0 0 10px';
              d.textContent = it.description;
              card.appendChild(d);
            }
            const barTrack = document.createElement('div');
            barTrack.style.cssText = 'background:var(--bg-soft);border-radius:10px;height:16px;overflow:hidden;margin:8px 0 6px;';
            const barFill = document.createElement('div');
            const pct = Math.min(100, Math.round((it.progress / it.target) * 100));
            barFill.style.cssText = `height:100%;width:${pct}%;background:${done ? 'var(--green)' : 'var(--yellow)'};border-radius:10px;transition:width 0.4s var(--bounce);`;
            barTrack.appendChild(barFill);
            card.appendChild(barTrack);
            const label = document.createElement('div');
            label.style.cssText = 'text-align:center;font-family:\'Jost\',sans-serif;font-weight:800;font-size:13px;color:var(--text-soft);';
            label.textContent = it.progress + ' / ' + it.target;
            card.appendChild(label);
            screen.appendChild(card);
          });
        });
      }, isBack);
    } else if (current.level === 'profile_tasks' || current.level === 'profile_tests') {
      const stats = await apiGet(`/api/subjects/${current.subjectId}/profile`);
      swapScreen((screen) => {
        const tabs = document.createElement('div');
        tabs.style.cssText = 'display:flex;gap:6px;margin-bottom:16px;';
        [{ key: 'profile_tasks', label: 'Задания' }, { key: 'profile_tests', label: 'Тесты' }].forEach((t) => {
          const btn = document.createElement('button');
          const active = current.level === t.key;
          btn.textContent = t.label;
          btn.style.cssText = `flex:1;padding:9px 6px;border-radius:10px;border:2px solid ${active ? 'var(--blue)' : 'var(--border)'};background:${active ? 'var(--blue-tint)' : 'var(--bg)'};color:${active ? 'var(--blue-dark)' : 'var(--text-soft)'};font-family:'Jost',sans-serif;font-size:12.5px;font-weight:800;cursor:pointer;`;
          btn.onclick = () => { profileStack[profileStack.length - 1] = { level: t.key, subjectId: current.subjectId, title: 'История' }; renderProfile(false); };
          tabs.appendChild(btn);
        });
        screen.appendChild(tabs);

        if (current.level === 'profile_tasks') {
          if (!stats.tasks.length) {
            const p = document.createElement('p');
            p.className = 'state-msg';
            p.textContent = 'Пока нет пройденных тем или разделов по этому предмету.';
            screen.appendChild(p);
            return;
          }
          stats.tasks.forEach((item, i) => {
            const card = document.createElement('div');
            card.className = 'profile-card';
            card.style.animationDelay = (i * 0.05) + 's';
            card.innerHTML = `
              <div class="p-title">${item.title}</div>
              <div class="p-date">${item.date}</div>
              <div class="p-row"><span class="p-ok">✅ ${item.correct}</span><span class="p-bad">❌ ${item.wrong}</span></div>
            `;
            screen.appendChild(card);
          });
        } else {
          if (!stats.tests.length) {
            const p = document.createElement('p');
            p.className = 'state-msg';
            p.textContent = 'Пока нет пройденных тестов по этому предмету.';
            screen.appendChild(p);
            return;
          }
          stats.tests.forEach((item, i) => {
            const card = document.createElement('div');
            card.className = 'profile-card';
            card.style.animationDelay = (i * 0.05) + 's';
            const scoreText = (item.actual_score !== null && item.actual_score !== undefined)
              ? `${item.actual_score} тест. балл (${item.primary_score} перв.)`
              : `${item.primary_score} перв. балл`;
            card.innerHTML = `
              <div class="p-title">${item.test_title}</div>
              <div class="p-date">${item.date}</div>
              <div class="p-row">🏆 ${scoreText} · ✅ ${item.correct} ❌ ${item.wrong}</div>
            `;
            screen.appendChild(card);
          });
        }
      }, isBack);
    }
    } catch (err) {
      showState('Не получилось загрузить. ' + err.message, true, true, isBack, () => renderProfile(false));
    }
  }

  // --- Тема оформления: применяет сохранённый выбор при загрузке (сам
  // переключатель — на экране профиля, applyThemeChoice вызывается оттуда) ---
  function applyThemeChoice(choice) {
    localStorage.setItem('miniapp-theme', choice);
    if (choice === 'system') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', choice);
    }
  }
  applyThemeChoice(localStorage.getItem('miniapp-theme') || 'system');

  async function pickDefaultSubjectAndStart() {
    try {
      const subjects = await apiGet('/api/subjects');
      if (subjects.length) {
        const chosen = subjects[0];
        hwStack = await buildHomeworkEntry(chosen.id);
        stack = hwStack;
      }
    } catch (err) {
      // Не получилось узнать список предметов — остаёмся на обычном
      // экране выбора предмета, ничего страшного.
    }
    render(false);
  }

  function withDirectParam(url) {
    if (!url) return url;
    return url + (url.includes('?') ? '&' : '?') + 'direct=1';
  }

  function setAppChromeVisible(visible) {
    const header = document.querySelector('header');
    const tabBar = document.querySelector('.tab-bar');
    const crumbs = document.getElementById('crumbs');
    if (header) header.style.display = visible ? '' : 'none';
    if (tabBar) tabBar.style.display = visible ? '' : 'none';
    if (crumbs) crumbs.style.display = visible ? '' : 'none';
  }

  function removeBootLoader() {
    const loader = document.getElementById('bootLoader');
    if (loader) loader.remove();
  }

  async function checkProfileSetupThenStart() {
    // Скрываем всю обычную оболочку (шапку/вкладки/контент) сразу, ДО
    // всех запросов — иначе на секунду видна обычная разметка приложения
    // (и её placeholder-заглушка), а только потом решается, показывать ли
    // экран выбора роли. Простая полноэкранная заглушка вместо этого,
    // поверх всего (включая screenHost) — её снимает removeBootLoader,
    // как только принято решение, что показывать дальше.
    setAppChromeVisible(false);
    const bootLoader = document.createElement('div');
    bootLoader.id = 'bootLoader';
    bootLoader.style.cssText = 'position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:var(--bg);';
    bootLoader.innerHTML = '<span class="pencil-dots"><span></span><span></span><span></span></span>';
    document.body.appendChild(bootLoader);

    // Раньше это были три последовательных запроса подряд (анкета → подписка
    // → предметы), каждый ждал предыдущий — экран заметно дольше загружался.
    // Они друг от друга не зависят, поэтому просто запускаем все сразу и
    // разбираемся с результатами, когда все придут.
    const [roleRes, infoRes, statusRes, subjectsRes] = await Promise.allSettled([
      apiGet('/api/me/role'),
      apiGet('/api/me/profile-info'),
      apiGet('/api/me/subscription-status'),
      apiGet('/api/subjects'),
    ]);
    const roleInfo = roleRes.status === 'fulfilled' ? roleRes.value : null;
    const info = infoRes.status === 'fulfilled' ? infoRes.value : null;
    const status = statusRes.status === 'fulfilled' ? statusRes.value : null;
    const subjects = subjectsRes.status === 'fulfilled' ? subjectsRes.value : [];

    // Выбор «я ученик / я учитель» нужен только когда есть реальная
    // неопределённость: либо роль ещё не решена вообще (совсем новый
    // человек), либо у человека УЖЕ есть обе роли одновременно (свой
    // кабинет репетитора И доступ как у ученика к чужому курсу). Если
    // роль одна — выбирать не из чего, сразу идём в неё. Если человек уже
    // выбирал «я ученик» раньше на этом устройстве (localStorage) — тоже
    // не спрашиваем заново: иначе любое обновление страницы (не только
    // самое первое открытие) заново кидало бы на этот экран.
    let storedRoleChoice = null;
    try { storedRoleChoice = localStorage.getItem('gryphy_preferred_role'); } catch (err) {}
    const showChooser = !new URLSearchParams(location.search).has('direct')
      && storedRoleChoice !== 'student'
      && roleInfo && (roleInfo.role === 'guest' || (roleInfo.is_teacher && roleInfo.has_student_access));
    if (showChooser) {
      removeBootLoader();
      renderRoleChooser(roleInfo, () => { setAppChromeVisible(true); proceedAsStudent(info, status, subjects); });
      return;
    }
    setAppChromeVisible(true);
    proceedAsStudent(info, status, subjects);
  }

  async function proceedAsStudent(info, status, subjects) {
    removeBootLoader();
    if (info && !info.filled) {
      renderProfileSetupForm();
      return;
    }
    if (status && !status.has_access) {
      renderSubscriptionRequiredScreen();
      return;
    }
    // Возвращаемся туда, где человек уже был, вместо того чтобы каждый
    // раз при обновлении страницы заново показывать список курсов —
    // ТОЛЬКО если сохранённый курс всё ещё среди доступных (иначе, если
    // доступ пропал или это другое устройство, просто показываем список).
    let lastCourseId = null;
    try { lastCourseId = localStorage.getItem('gryphy_last_course_id'); } catch (err) {}
    const matchedCourse = lastCourseId ? subjects.find((s) => String(s.id) === lastCourseId) : null;
    if (matchedCourse) {
      enterCourse(matchedCourse);
      return;
    }
    renderMyCoursesScreen(subjects);
  }

  async function renderMyCoursesScreen(subjects) {
    setAppChromeVisible(false);
    // Красим саму страницу (body), а не пытаемся растянуть внутренний
    // блок отрицательными margin — тот трюк не совпадал с реальными
    // паддингами body (там ещё и переопределение снизу под нижнюю
    // панель) и обрезал часть содержимого снизу. Возвращается обратно
    // при выходе с этого экрана (enterCourse/openCourseSwitcher).
    document.body.style.background = '#F1FBFE';
    // Карточки нужны с деталями (чей курс/формат/остаток/дни) — по одному
    // запросу на предмет, обычно их немного (1-3 у ученика), так что это
    // не тяжело.
    const cards = await Promise.all(subjects.map((s) =>
      apiGet(`/api/subjects/${s.id}/course-card`).then((info) => ({ ...s, ...info })).catch(() => ({ ...s }))
    ));
    swapScreen((screen) => {
      screen.style.cssText = 'background:transparent;padding:0;';

      // Заголовок и кнопка меню — на голубом фоне, ВНЕ белого листа (он
      // ниже и накрывает только карточки курсов).
      const headerRow = document.createElement('div');
      headerRow.style.cssText = 'display:flex;align-items:center;justify-content:space-between;max-width:398px;margin:0 auto 16px;';
      const title = document.createElement('h2');
      title.style.cssText = 'font-family:"Involve",sans-serif;font-size:20px;font-weight:700;margin:0;color:#000;';
      title.textContent = 'Мои курсы';
      headerRow.appendChild(title);

      // Кнопка бокового меню — только для веб-версии вне Telegram (в самом
      // боте своя навигация через нижние вкладки, дублировать не нужно).
      const isInsideTelegram = !!(tg && tg.initData);
      if (!isInsideTelegram) {
        const sidebarBtn = document.createElement('button');
        sidebarBtn.setAttribute('aria-label', 'Меню');
        sidebarBtn.style.cssText = 'width:44px;height:44px;border-radius:50%;border:none;background:#238BA7;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;';
        sidebarBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="2" y="2" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="11" y="2" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="2" y="11" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="11" y="11" width="7" height="7" rx="1.5" fill="currentColor"/></svg>';
        sidebarBtn.onclick = () => switchTab('profile');
        headerRow.appendChild(sidebarBtn);
      }
      screen.appendChild(headerRow);

      // Большой белый «лист» (398) — подложка ТОЛЬКО для карточек курсов,
      // начинается ниже заголовка, а не накрывает его.
      const sheet = document.createElement('div');
      sheet.style.cssText = 'width:398px;max-width:100%;margin:0 auto;background:#fff;border-radius:24px;padding:20px 16px;box-sizing:border-box;';

      if (!cards.length) {
        const p = document.createElement('p');
        p.className = 'state-msg';
        p.textContent = 'У вас пока нет ни одного курса.';
        sheet.appendChild(p);
        screen.appendChild(sheet);
        return;
      }

      cards.forEach((c) => {
        const card = document.createElement('div');
        // Рамка + тень по спецификации (X 4, Y 0, blur 13, #000 15%) —
        // именно на карточке курса, а не на маленьких плашках формата
        // внутри неё (это разные «плашки»: одна большая — курс, и
        // несколько мелких овальных тегов формата/остатка внутри неё).
        card.style.cssText = 'width:348px;max-width:100%;background:#fff;border:1px solid #B9B9B9;border-radius:18px;padding:16px;margin:0 auto 16px;box-shadow:4px 0 13px 0 rgba(0,0,0,0.15);box-sizing:border-box;';

        const courseTitle = document.createElement('div');
        courseTitle.style.cssText = 'font-family:"Involve",sans-serif;font-size:16px;font-weight:700;color:#000;margin-bottom:4px;';
        courseTitle.textContent = c.title;
        card.appendChild(courseTitle);

        if (c.tutor_name) {
          const from = document.createElement('div');
          from.style.cssText = 'font-family:"Involve",sans-serif;font-size:13px;color:#B9B9B9;margin-bottom:10px;';
          from.textContent = 'От ' + c.tutor_name;
          card.appendChild(from);
        }

        const tagsRow = document.createElement('div');
        tagsRow.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;';
        function addTag(html) {
          const tag = document.createElement('span');
          tag.style.cssText = 'display:inline-block;padding:1px 8px;border-radius:20px;border:1px solid #B9B9B9;font-family:"Involve",sans-serif;font-size:12px;color:#B9B9B9;white-space:nowrap;';
          tag.innerHTML = html;
          tagsRow.appendChild(tag);
        }
        if (c.format) addTag(escapeHtml(c.format));
        if (c.lessons_remaining !== null && c.lessons_remaining !== undefined) {
          addTag(`Осталось уроков: <b style="color:#238BA7;">${c.lessons_remaining}</b>`);
        }
        if (c.days_left !== null && c.days_left !== undefined) {
          addTag(`До окончания доступа: <b style="color:#238BA7;">${c.days_left} дн.</b>`);
        }
        if (tagsRow.children.length) card.appendChild(tagsRow);

        if (c.description) {
          const desc = document.createElement('div');
          desc.style.cssText = 'font-family:"Involve",sans-serif;font-size:13px;color:#000;line-height:1.4;margin-bottom:14px;';
          desc.textContent = c.description;
          card.appendChild(desc);
        }

        const startBtn = document.createElement('button');
        startBtn.style.cssText = 'background:#238BA7;color:#fff;border:none;border-radius:20px;padding:6px 20px;font-family:"Involve",sans-serif;font-size:12px;font-weight:600;cursor:pointer;';
        startBtn.textContent = 'Приступить';
        startBtn.onclick = () => enterCourse(c);
        card.appendChild(startBtn);

        sheet.appendChild(card);
      });
      screen.appendChild(sheet);
    });
  }

  function enterCourse(subject) {
    document.body.style.background = '';
    currentCourseId = subject.id;
    currentCourseTitle = subject.title;
    try { localStorage.setItem('gryphy_last_course_id', String(subject.id)); } catch (err) {}
    trainerInitialized = false;
    hwBuiltForCourse = null;
    setAppChromeVisible(true);
    const ratingTabBtn = document.getElementById('tabRating');
    if (ratingTabBtn) ratingTabBtn.style.display = subject.rating_enabled ? '' : 'none';
    activeTab = null;
    switchTab('study');
  }

  function openCourseSwitcher() {
    apiGet('/api/subjects').then((subjects) => {
      renderMyCoursesScreen(subjects);
    }).catch((err) => alert('Не получилось загрузить список курсов: ' + err.message));
  }

  function renderRoleChooser(roleInfo, onChooseStudent) {
    swapScreen((screen) => {
      const title = document.createElement('h2');
      title.style.cssText = 'font-family:"Jost",sans-serif;font-size:20px;font-weight:800;margin:0 0 6px;';
      title.textContent = '👋 Добро пожаловать!';
      screen.appendChild(title);
      const subtitle = document.createElement('p');
      subtitle.className = 'field-hint';
      subtitle.style.cssText = 'margin:0 0 22px;font-size:13px;';
      subtitle.textContent = 'Вы сейчас как ученик или как репетитор?';
      screen.appendChild(subtitle);

      const studentBtn = document.createElement('button');
      studentBtn.className = 'submit-btn';
      studentBtn.style.cssText = 'margin-bottom:12px;';
      studentBtn.textContent = '🎓 Я ученик';
      studentBtn.onclick = () => {
        // Запоминаем выбор — иначе при обновлении страницы (а не только
        // при первом открытии) человека каждый раз снова спрашивали бы
        // «кто вы», хотя он уже выбрал в этой же сессии/на этом же
        // устройстве. Экран смены роли в настройках по-прежнему работает.
        try { localStorage.setItem('gryphy_preferred_role', 'student'); } catch (err) {}
        onChooseStudent();
      };
      screen.appendChild(studentBtn);

      const teacherBtn = document.createElement('button');
      teacherBtn.className = 'submit-btn';
      teacherBtn.style.cssText = 'background:var(--bg-soft);color:var(--text);border:2px solid var(--border);';
      teacherBtn.textContent = '👩‍🏫 Я репетитор';
      teacherBtn.onclick = async () => {
        try { localStorage.setItem('gryphy_preferred_role', 'teacher'); } catch (err) {}
        // Уже учитель — переходим в существующий кабинет и никогда не
        // предлагаем завести новый, даже если по какой-то причине не
        // пришла ссылка (тогда просто сообщаем об ошибке).
        if (roleInfo.is_teacher) {
          if (!roleInfo.teacher_app_url) {
            alert('Не удалось определить адрес учительского мини-аппа. Обратитесь к владельцу платформы.');
            return;
          }
          window.location.href = withDirectParam(roleInfo.teacher_app_url);
          return;
        }
        // Никакого ввода — кабинет создаётся сразу с именем по умолчанию
        // (бэкенд сам подставит «Кабинет <имя>»), переименовать можно
        // позже в настройках учительского мини-аппа.
        teacherBtn.disabled = true;
        teacherBtn.textContent = 'Открываю кабинет…';
        try {
          const res = await apiPost('/api/me/become-tutor', {});
          window.location.href = withDirectParam(res.teacher_app_url || roleInfo.teacher_app_url);
        } catch (err) {
          teacherBtn.disabled = false;
          teacherBtn.textContent = '👩‍🏫 Я репетитор';
          alert('Не получилось: ' + err.message);
        }
      };
      screen.appendChild(teacherBtn);
    });
  }

  async function checkSubscriptionThenStart() {
    try {
      const status = await apiGet('/api/me/subscription-status');
      if (status.has_access) {
        pickDefaultSubjectAndStart();
      } else {
        renderSubscriptionRequiredScreen();
      }
    } catch (err) {
      // Технический сбой самой проверки — не блокируем вход совсем,
      // основная защита всё равно на сервере (каждый эндпоинт с контентом
      // сам проверяет подписку и не отдаст ничего лишнего).
      pickDefaultSubjectAndStart();
    }
  }

  function renderSubscriptionRequiredScreen() {
    document.querySelector('nav.tab-bar').style.display = 'none';
    crumbsEl.innerHTML = '';
    crumbsEl.style.display = 'none';
    screenHost.innerHTML = '';
    const screen = document.createElement('div');
    screen.className = 'screen';
    screen.id = 'content';

    const card = document.createElement('div');
    card.className = 'task-card';
    card.style.textAlign = 'center';

    const emoji = document.createElement('div');
    emoji.style.cssText = 'font-size:40px;margin-bottom:10px;';
    emoji.textContent = '🔒';
    card.appendChild(emoji);

    const title = document.createElement('p');
    title.className = 'task-question';
    title.style.textAlign = 'center';
    title.textContent = 'Нужна подписка';
    card.appendChild(title);

    const hint = document.createElement('p');
    hint.className = 'task-description';
    hint.style.textAlign = 'center';
    hint.textContent = 'Чтобы открыть материалы курса, оформите подписку. Если уже оплатили и видите это сообщение — напишите менеджеру, доступ откроем вручную.';
    card.appendChild(hint);

    const contactBtn = document.createElement('button');
    contactBtn.className = 'submit-btn';
    contactBtn.textContent = '✍️ Написать менеджеру';
    contactBtn.onclick = async () => {
      try {
        const { url } = await apiGet('/api/manager-contact-url');
        if (url) {
          if (tg?.openTelegramLink && /^https?:\/\/t\.me\//.test(url)) {
            tg.openTelegramLink(url);
          } else if (tg?.openLink) {
            tg.openLink(url);
          } else {
            window.open(url, '_blank');
          }
          return;
        }
      } catch (err) { /* падаем на запасной путь ниже */ }
      const msg = 'Чтобы написать менеджеру, вернитесь в чат с ботом и нажмите там кнопку «Написать менеджеру» в главном меню.';
      if (tg?.showAlert) {
        tg.showAlert(msg, () => { if (tg?.close) tg.close(); });
      } else {
        alert(msg);
      }
    };
    card.appendChild(contactBtn);

    const retryBtn = document.createElement('button');
    retryBtn.className = 'back-btn';
    retryBtn.style.cssText = 'width:100%;margin-top:10px;';
    retryBtn.textContent = '🔄 Проверить ещё раз';
    retryBtn.onclick = () => checkSubscriptionThenStart();
    card.appendChild(retryBtn);

    screen.appendChild(card);
    screenHost.appendChild(screen);
  }

  function renderProfileSetupForm() {
    // Пока анкета не заполнена, ученик не должен иметь возможность уйти
    // никуда ещё — прячем нижнюю навигацию и хлебные крошки полностью.
    document.querySelector('nav.tab-bar').style.display = 'none';
    crumbsEl.innerHTML = '';
    crumbsEl.style.display = 'none';
    screenHost.innerHTML = '';
    const screen = document.createElement('div');
    screen.className = 'screen';
    screen.id = 'content';

    const card = document.createElement('div');
    card.className = 'task-card';

    const title = document.createElement('p');
    title.className = 'task-question';
    title.textContent = 'Давайте познакомимся!';
    card.appendChild(title);

    const hint = document.createElement('p');
    hint.className = 'task-description';
    hint.textContent = 'Расскажите немного о себе — это займёт одну минуту.';
    card.appendChild(hint);

    const nameHint = document.createElement('p');
    nameHint.className = 'field-hint';
    nameHint.style.cssText = 'margin:-8px 0 14px;color:var(--red-dark);';
    nameHint.textContent = 'Указывайте настоящие фамилию и имя — они видны в рейтинге и учителю.';
    card.appendChild(nameHint);

    const makeField = (labelText, placeholder) => {
      const label = document.createElement('div');
      label.className = 'field-label';
      label.textContent = labelText;
      card.appendChild(label);
      const input = document.createElement('input');
      input.className = 'field-input';
      input.placeholder = placeholder;
      input.style.marginBottom = '14px';
      card.appendChild(input);
      return input;
    };

    const surnameInput = makeField('Фамилия', 'Иванова');
    const givenNameInput = makeField('Имя', 'Мария');
    const patronymicInput = makeField('Отчество (если есть)', 'Сергеевна');

    const statusLabel = document.createElement('div');
    statusLabel.className = 'field-label';
    statusLabel.textContent = 'Вы сейчас';
    card.appendChild(statusLabel);

    const statusGrid = document.createElement('div');
    statusGrid.style.cssText = 'display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;';
    const statusOptions = [
      { key: 'school', label: 'Учусь в школе' },
      { key: 'college', label: 'Учусь в колледже/вузе' },
      { key: 'work', label: 'Работаю' },
    ];
    let selectedStatus = null;
    const statusButtons = {};
    const gradeWrap = document.createElement('div');
    let gradeInput = null;

    function renderStatusButtons() {
      statusGrid.innerHTML = '';
      statusOptions.forEach((opt) => {
        const btn = document.createElement('button');
        const active = selectedStatus === opt.key;
        btn.type = 'button';
        btn.style.cssText = `padding:10px 4px;border-radius:12px;border:2px solid ${active ? 'var(--blue)' : 'var(--border)'};background:${active ? 'var(--blue-tint)' : 'var(--bg)'};color:${active ? 'var(--blue-dark)' : 'var(--text-soft)'};font-family:'Jost',sans-serif;font-size:12px;font-weight:700;cursor:pointer;line-height:1.25;`;
        btn.textContent = opt.label;
        btn.onclick = () => { selectedStatus = opt.key; renderStatusButtons(); renderGradeField(); };
        statusButtons[opt.key] = btn;
        statusGrid.appendChild(btn);
      });
    }
    function renderGradeField() {
      gradeWrap.innerHTML = '';
      gradeInput = null;
      if (selectedStatus === 'school') {
        const label = document.createElement('div');
        label.className = 'field-label';
        label.textContent = 'Класс';
        gradeWrap.appendChild(label);
        gradeInput = document.createElement('input');
        gradeInput.className = 'field-input';
        gradeInput.placeholder = 'Например, 11';
        gradeInput.style.marginBottom = '14px';
        gradeWrap.appendChild(gradeInput);
      }
    }
    renderStatusButtons();
    card.appendChild(statusGrid);
    card.appendChild(gradeWrap);
    renderGradeField();

    const cityInput = makeField('Город', 'Например, Минск');
    const groupCodeInput = makeField('Код группы (если дали в школе/курсах)', 'Например, ABCD-1234');
    groupCodeInput.style.textTransform = 'uppercase';

    const errBox = document.createElement('div');
    errBox.style.cssText = 'color:var(--red-dark);font-size:12.5px;font-weight:700;margin-bottom:8px;display:none;';
    card.appendChild(errBox);

    const saveBtn = document.createElement('button');
    saveBtn.className = 'submit-btn';
    saveBtn.textContent = 'Продолжить';
    saveBtn.onclick = async () => {
      const surname = surnameInput.value.trim();
      const given_name = givenNameInput.value.trim();
      const patronymic = patronymicInput.value.trim();
      const city = cityInput.value.trim();
      const grade = gradeInput ? gradeInput.value.trim() : '';
      const group_code = groupCodeInput.value.trim();
      if (!surname || !given_name || !selectedStatus || !city) {
        errBox.textContent = 'Заполните фамилию, имя, статус и город.';
        errBox.style.display = 'block';
        return;
      }
      if (selectedStatus === 'school' && !grade) {
        errBox.textContent = 'Укажите класс.';
        errBox.style.display = 'block';
        return;
      }
      saveBtn.disabled = true;
      saveBtn.textContent = 'Сохраняю…';
      try {
        await apiPost('/api/me/profile-info', { surname, given_name, patronymic, status: selectedStatus, grade, city, group_code });
        document.querySelector('nav.tab-bar').style.display = '';
        pickDefaultSubjectAndStart();
      } catch (err) {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Продолжить';
        errBox.textContent = 'Не получилось сохранить: ' + err.message;
        errBox.style.display = 'block';
      }
    };
    card.appendChild(saveBtn);

    screen.appendChild(card);
    screenHost.appendChild(screen);
  }

  let isTeacherViewing = false;
  apiGet('/api/me/role').then((r) => { isTeacherViewing = !!r.is_teacher; }).catch(() => {});
  checkProfileSetupThenStart();
  apiGet('/api/me/notifications').then((d) => updateHeaderNotifDot(d.unread_count || 0)).catch(() => {});

  // Heartbeat «время в приложении» — раз в 30 секунд, только пока страница
  // видима, шлём накопленные секунды на дефолтный предмет пользователя.
  (function startAppTimeHeartbeat() {
    const INTERVAL_MS = 30000;
    let pingSubjectId = null;
    let sessionExpiredShown = false;
    getDefaultSubject().then((subject) => { if (subject) pingSubjectId = subject.id; }).catch(() => {});
    const timer = setInterval(() => {
      if (!pingSubjectId || document.visibilityState !== 'visible') return;
      apiPost(`/api/subjects/${pingSubjectId}/ping`, { seconds: Math.round(INTERVAL_MS / 1000) }).catch((err) => {
        if (err.status === 401) {
          clearInterval(timer);
          if (!sessionExpiredShown) {
            sessionExpiredShown = true;
            const msg = 'Сессия истекла (обычно это бывает, если приложение было открыто больше суток). Полностью закройте его и откройте заново через бота.';
            if (tg?.showAlert) tg.showAlert(msg);
          }
        }
      });
    }, INTERVAL_MS);
  })();
</script>

</body>
</html>
